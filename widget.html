<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>TQQQ widget</title>
<!-- The desktop widget page (js/widget-page.js). Keep the ?v= counter in step
     with index.html: both load the same assets. -->
<link rel="stylesheet" href="styles.css?v=408">
<style>
  /* Sized to fit by the widget's frame: never a scrollbar, which a Mac set to
     always show them draws as a white bar beside the card. */
  html, body { background: transparent; overflow: hidden; }
  /* Every text at the regular weight, the charts' labels and tooltips
     included: the user wants no bold anywhere in the widget. */
  body.widget-page * { font-weight: 400 !important; }
  body.widget-page { margin: 0; padding: 6px; min-height: 0; }
  /* Three charts and nothing else, each on its own white tile: your portfolio
     across the top, TQQQ intraday and the strategy's signal chart side by side
     below it. The card under the tiles is tinted, so the gaps between them
     read at a glance. */
  .wp-card {
    --wp-gap: 8px;
    background: var(--o-mist);
    border: 1px solid var(--border); border-radius: var(--r-xl);
    padding: var(--wp-gap);
    box-shadow: 0 1px 2px rgba(56, 56, 116, 0.06), 0 12px 32px rgba(56, 56, 116, 0.14);
  }
  /* Corners concentric with the card's. */
  .wp-tile {
    background: var(--surface);
    border: 1px solid var(--border); border-radius: calc(var(--r-xl) - var(--wp-gap));
    padding: 8px 10px 6px;
    box-shadow: var(--shadow-sm);
  }
  /* The two bottom tiles stretch to one height, so their edges line up. */
  .wp-bottom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--wp-gap); margin-top: var(--wp-gap); }
  .wp-intraday { display: block; width: 100%; border: 0; background: transparent; }
  .wp-card .custom-lines-chart { margin-top: 0; overflow: visible; }
  .wp-note { padding: 18px 2px; font-size: 12px; color: var(--text-muted); }
  .wp-error { margin-top: 6px; font-size: 12px; color: var(--red-text); }
</style>
</head>
<body class="widget-page">
<main class="wp-card" id="wp-card">
  <section class="wp-tile"><div id="wp-portfolio"></div></section>
  <div class="wp-bottom">
    <section class="wp-tile"><iframe class="wp-intraday" id="wp-intraday" title="TQQQ intraday"></iframe></section>
    <section class="wp-tile"><div id="wp-signal"></div></section>
  </div>
  <div class="wp-error" id="wp-error" hidden></div>
</main>
<script>
  // A local copy of this page (the desktop widget's) reads the live site's
  // data files: ?data=<site root>.
  window.TQQQ_DATA_BASE = new URLSearchParams(location.search).get('data') || '';
</script>
<script src="js/data.js?v=408"></script>
<script src="js/utils.js?v=408"></script>
<script src="js/simulate.js?v=408"></script>
<script src="js/chart.js?v=408"></script>
<script src="js/transactions.js?v=408"></script>
<script src="js/signal-chart.js?v=408"></script>
<script src="js/saved-configs.js?v=408"></script>
<script src="js/strategy-library-code.js?v=408"></script>
<script src="js/strategy-library.js?v=408"></script>
<script src="js/widget-page.js?v=408"></script>
</body>
</html>
