<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>TQQQ widget</title>
<!-- The desktop widget page (js/widget-page.js). Keep the ?v= counter in step
     with index.html: both load the same assets. -->
<link rel="stylesheet" href="styles.css?v=393">
<style>
  html, body { background: transparent; }
  body.widget-page { margin: 0; padding: 6px; min-height: 0; }
  .wp-card {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px 10px;
    box-shadow: 0 10px 30px rgba(56, 56, 116, 0.16);
  }
  .wp-head { margin-bottom: 6px; }
  .wp-title { font-weight: 600; font-size: 13px; }
  .wp-stamp { font-size: 10.5px; color: var(--text-muted); margin-top: 1px; }
  .wp-note { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  /* Intraday beside the signal chart; one column below 700px. */
  .wp-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 12px; }
  @media (max-width: 700px) { .wp-grid { grid-template-columns: minmax(0, 1fr); } }
  .wp-intraday { display: block; width: 100%; height: 300px; border: 0; margin-top: 6px; background: transparent; }
  /* The panel's line chips, wrapping several to a row in the narrower column. */
  #wp-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  #wp-chips .legend-chip { flex: 1 1 170px; padding: 3px 8px; }
  .wp-error { margin-top: 8px; font-size: 12px; color: var(--red-text); }
</style>
</head>
<body class="widget-page">
<main class="wp-card" id="wp-card">
  <div class="wp-head">
    <div class="wp-title" id="wp-title">TQQQ</div>
    <div class="wp-stamp" id="wp-stamp"></div>
  </div>
  <div class="strategy-panel-section-label">My portfolio</div>
  <div id="wp-portfolio"><div class="wp-note">Loading…</div></div>
  <div class="wp-grid">
    <section>
      <div class="strategy-panel-section-label">TQQQ intraday</div>
      <iframe class="wp-intraday" id="wp-intraday" src="experiments/tqqq-intraday.html?embed=widget" title="TQQQ intraday"></iframe>
    </section>
    <section>
      <div class="strategy-panel-section-label">Signal chart</div>
      <div class="legend-chip-group" id="wp-chips"></div>
      <div id="wp-signal"></div>
    </section>
  </div>
  <div class="wp-error" id="wp-error" hidden></div>
</main>
<script src="js/data.js?v=393"></script>
<script src="js/utils.js?v=393"></script>
<script src="js/simulate.js?v=393"></script>
<script src="js/chart.js?v=393"></script>
<script src="js/transactions.js?v=393"></script>
<script src="js/signal-chart.js?v=393"></script>
<script src="js/saved-configs.js?v=393"></script>
<script src="js/strategy-library-code.js?v=393"></script>
<script src="js/strategy-library.js?v=393"></script>
<script src="js/widget-page.js?v=393"></script>
</body>
</html>
