<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#000">
  <!-- The comparison grid: a block of cells, some hotter than others. -->
  <rect x="3" y="3" width="5" height="5" rx="1"/>
  <rect x="9.5" y="3" width="5" height="5" rx="1" fill-opacity="0.55"/>
  <rect x="16" y="3" width="5" height="5" rx="1" fill-opacity="0.3"/>
  <rect x="3" y="9.5" width="5" height="5" rx="1" fill-opacity="0.55"/>
  <rect x="9.5" y="9.5" width="5" height="5" rx="1" fill-opacity="0.3"/>
  <rect x="16" y="9.5" width="5" height="5" rx="1"/>
  <rect x="3" y="16" width="5" height="5" rx="1" fill-opacity="0.3"/>
  <rect x="9.5" y="16" width="5" height="5" rx="1"/>
  <rect x="16" y="16" width="5" height="5" rx="1" fill-opacity="0.55"/>
</svg>
