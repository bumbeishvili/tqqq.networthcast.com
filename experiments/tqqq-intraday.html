<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TQQQ intraday — every day's % path from the open</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
<style>
  /* Same Orion light theme as the main page (see styles.css): Open Sans for
     UI text, JetBrains Mono for figures, purple accent, night-blue type. */
  @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --bg:#fafafd; --panel:#ffffff; --border:#dbdff1; --border2:#c5c1ec;
    --text:#383874; --muted:#8484a0; --faint:#9292c1;
    --accent:#8676ff; --orange:#e8890b; --violet:#c64eff;
    --mean:#0a9fbe;   /* teal: clearly apart from today's purple and the orange median */
    --hover:#c2185b;  /* Orion pink, darkened for text: the hovered day, again apart from today */
    --green:#067d21; --red:#c81e1f;
    --shadow:0 3px 2px rgba(108,73,172,.02), 0 7px 5px rgba(108,73,172,.03), 0 13px 10px rgba(108,73,172,.04), 0 22px 18px rgba(108,73,172,.04), 0 42px 33px rgba(108,73,172,.05);
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:16px}
  .back-link{display:inline-block;margin:0 0 10px;font-size:12.5px;color:var(--muted);text-decoration:none}
  .back-link:hover{color:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px}
  .legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--muted)}
  .period{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:280px}
  .coverage{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .coverage b{color:var(--muted);font-weight:500}
  /* Two native sliders stacked on one track; only the thumbs take pointer events. */
  .range{position:relative;width:100%;height:16px}
  .range-track{position:absolute;left:0;right:0;top:6px;height:4px;border-radius:2px;background:var(--border2)}
  .range-fill{position:absolute;top:6px;height:4px;border-radius:2px;background:var(--accent)}
  .range input{position:absolute;left:0;top:0;width:100%;height:16px;margin:0;appearance:none;-webkit-appearance:none;background:none;pointer-events:none}
  .range input::-webkit-slider-runnable-track{background:none;height:16px}
  .range input::-moz-range-track{background:none;height:16px}
  .range input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:14px;height:14px;margin-top:1px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);cursor:grab}
  .range input::-moz-range-thumb{pointer-events:auto;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);cursor:grab}
  .range input:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
  .switch{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .track{position:relative;width:32px;height:18px;border-radius:9px;background:var(--border2);transition:background .15s;flex:none}
  .switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:transform .15s}
  .switch input:checked+.track{background:var(--accent)}
  .switch input:checked+.track::after{transform:translateX(14px)}
  .switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
  .legend span::before{content:"";display:inline-block;width:18px;height:0;border-top:2px solid var(--c);vertical-align:middle;margin-right:6px}
  .legend .mean{--c:var(--mean)} .legend .median{--c:var(--orange)}
  .filters{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:0 0 8px;font-size:12.5px;color:var(--muted)}
  .match-window{fill:var(--violet);fill-opacity:.05;pointer-events:none}
  #chart{position:relative;min-height:520px}
  #chart svg{display:block}
  .axis text{fill:var(--muted);font-family:var(--mono);font-size:11px}
  .axis line,.axis path{stroke:var(--border2)}
  .grid line{stroke:var(--border);stroke-dasharray:2 3}
  .zero{stroke:var(--faint);stroke-width:1}
  .day-path{fill:none;stroke:var(--text);stroke-width:1;opacity:.05}
  .day-path.hover{opacity:1;stroke:var(--hover);stroke-width:1.5}
  .day-path.reference{opacity:1;stroke:var(--violet);stroke-width:2}
  /* Today's path: on top of every other layer, glowing, with a live pulse at
     its last bar while the session is open. */
  .today{pointer-events:none}
  .today-glow{fill:none;stroke:var(--violet);stroke-width:9;stroke-linejoin:round;stroke-linecap:round;opacity:.14}
  .today-path{fill:none;stroke:var(--violet);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
  .today-dot{fill:var(--violet);stroke:var(--panel);stroke-width:2}
  .today-ring{fill:none;stroke:var(--violet);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:live-pulse 1.8s ease-out infinite}
  .today-ring.second{animation-delay:.9s}
  @keyframes live-pulse{0%{transform:scale(.5);opacity:.8}100%{transform:scale(3.2);opacity:0}}
  .today-label{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--violet)}
  .mean-path{fill:none;stroke:var(--mean);stroke-width:2.5}
  .median-path{fill:none;stroke:var(--orange);stroke-width:2;stroke-dasharray:6 4}
  .hover-rule{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
  .now-line{stroke:var(--faint);stroke-width:1;stroke-dasharray:2 4;pointer-events:none}
  .now-label{font-family:var(--mono);font-size:10.5px;fill:var(--faint);pointer-events:none}
  .annotations{pointer-events:none}
  .annotation path{fill:none;stroke:var(--c);stroke-width:1;stroke-opacity:.6}
  .annotation .annotation-subject path{stroke-width:2;fill:var(--panel)}
  .annotation .annotation-note-bg{fill:var(--panel);fill-opacity:.9;stroke:var(--border2);stroke-width:1;rx:5}
  .annotation text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
  .annotation .annotation-note-title{font-weight:600;fill:var(--c)}
  .annotation.buy{--c:var(--green)} .annotation.sell{--c:var(--red)}
  .readout{position:absolute;top:8px;right:8px;background:var(--panel);border:1px solid var(--border2);border-radius:8px;
    padding:8px 10px;font-family:var(--mono);font-size:12px;pointer-events:none;line-height:1.6;min-width:180px}
  .readout .t{color:var(--text);font-weight:600}
  .readout .s{color:var(--faint);font-size:11px;margin-bottom:4px}
  .readout .r{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}
  .readout .r b{color:var(--text);font-weight:500}
  .readout .r span::before{content:"";display:inline-block;width:10px;height:0;border-top:2px solid var(--c, transparent);vertical-align:middle;margin-right:6px}
  .readout .r.mean{--c:var(--mean)} .readout .r.median{--c:var(--orange)} .readout .r.median span::before{border-top-style:dashed}
  .readout .r.day{--c:var(--hover);margin-top:4px;padding-top:4px;border-top:1px solid var(--border)}
  .readout .r.day span{color:var(--hover)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="../">← Back to the backtesting platform</a>
  <div class="panel">
    <div class="toolbar">
      <div class="legend"><span class="mean">Mean of all days</span><span class="median">Median of all days</span></div>
      <div class="period">
        <div class="coverage" id="coverage"></div>
        <div class="range" id="period-range">
          <div class="range-track"></div>
          <div class="range-fill" id="range-fill"></div>
          <input type="range" id="range-start" min="0" value="0" step="1" aria-label="Period start">
          <input type="range" id="range-end" min="0" value="0" step="1" aria-label="Period end">
        </div>
      </div>
      <label class="switch" id="tz-switch">
        <input type="checkbox" id="toggle-local-tz">
        <span class="track"></span>
        <span class="switch-label" id="tz-switch-label"></span>
      </label>
    </div>
    <div class="filters">
      <label class="switch" id="similar-switch">
        <input type="checkbox" id="toggle-similar">
        <span class="track"></span>
        <span class="switch-label">Similar days only</span>
      </label>
    </div>
    <div id="chart"></div>
  </div>
</div>

<script>
const DATA_URL = '../data/intraday/tqqq-5m.tsv';
const SESSION_OPEN_MIN = 9 * 60 + 30;
const SESSION_CLOSE_MIN = 16 * 60;
const BAR_MINUTES = 5;
const DAY_OPACITY = 0.05;
// Symlog is linear inside a band around zero and logarithmic beyond it, so the
// crowded region gets room while big days still fit. A plain log scale cannot
// hold zero or negative moves. Ticks come from this ladder, starting at the
// band edge where the log part begins.
const NICE_PCT_LADDER = [0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50];

const MARKET_TZ = 'America/New_York';
const LOCAL_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const MINUTES_PER_DAY = 24 * 60;

const parseStamp = d3.timeParse('%m/%d/%Y %H:%M:%S');
const fmtPct = (d, decimals = 2) => (d > 0 ? '+' : '') + d.toFixed(decimals) + '%';
const fmtAxisPct = d => (d > 0 ? '+' : '') + parseFloat(d.toFixed(2)) + '%';
const fmtClock = minutes => {
  const wrapped = ((minutes % MINUTES_PER_DAY) + MINUTES_PER_DAY) % MINUTES_PER_DAY;
  const h = Math.floor(wrapped / 60), m = wrapped % 60;
  return `${h}:${String(m).padStart(2, '0')}`;
};

// Wall-clock minutes since midnight for an instant in a given zone.
function minutesOfDayIn(timeZone, date) {
  const parts = new Intl.DateTimeFormat('en-US', { timeZone, hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(date);
  const get = type => +parts.find(p => p.type === type).value;
  return (get('hour') % 24) * 60 + get('minute');
}

// Minutes to add to a New York time to get the viewer's local time, measured
// today so daylight-saving rules on both sides are the current ones.
function localOffsetFromMarket() {
  const now = new Date();
  let diff = minutesOfDayIn(LOCAL_TZ, now) - minutesOfDayIn(MARKET_TZ, now);
  if (diff > MINUTES_PER_DAY / 2) diff -= MINUTES_PER_DAY;
  if (diff <= -MINUTES_PER_DAY / 2) diff += MINUTES_PER_DAY;
  return diff;
}

// The current New York minute of day, or null outside a weekday session.
// Exchange holidays are not known here, so a holiday shows as open.
function marketMinuteNow() {
  const now = new Date();
  const weekday = new Intl.DateTimeFormat('en-US', { timeZone: MARKET_TZ, weekday: 'short' }).format(now);
  if (weekday === 'Sat' || weekday === 'Sun') return null;
  const minute = minutesOfDayIn(MARKET_TZ, now);
  return minute >= SESSION_OPEN_MIN && minute <= SESSION_CLOSE_MIN ? minute : null;
}

const NOW_REFRESH_MS = 30 * 1000;
const NOW_TICK_SHARE = 0.05;             // the "now" tick spans this share of the plot height, from the top

// Calendar date in New York, as the data's day timestamps are midnight ET.
const marketDateNow = () => new Intl.DateTimeFormat('en-CA', { timeZone: MARKET_TZ }).format(new Date());

const shortZoneName = timeZone =>
  new Intl.DateTimeFormat('en-US', { timeZone, timeZoneName: 'short' }).formatToParts(new Date())
    .find(p => p.type === 'timeZoneName').value;

// One row per 5-minute bar -> one series per trading day, each point the
// % change of the bar's close vs the day's first open, placed at bar end time.
function buildDays(rows) {
  const byDay = d3.groups(rows, r => d3.timeDay.floor(parseStamp(r.Date)).getTime());
  return byDay.map(([dayMs, bars]) => {
    const sorted = d3.sort(bars, r => parseStamp(r.Date));
    const open = +sorted[0].Open;
    const points = [{ minute: SESSION_OPEN_MIN, pct: 0 }].concat(sorted.map(r => {
      const t = parseStamp(r.Date);
      return { minute: t.getHours() * 60 + t.getMinutes() + BAR_MINUTES, pct: (+r.Close / open - 1) * 100 };
    }));
    const last = points[points.length - 1];
    return {
      id: dayMs,
      date: new Date(dayMs),
      points,
      closePct: last.pct,
      complete: last.minute === SESSION_CLOSE_MIN,
    };
  });
}

// Mean and median of every day's % at each minute of the session.
function buildAggregates(days) {
  const minutes = d3.range(SESSION_OPEN_MIN, SESSION_CLOSE_MIN + 1, BAR_MINUTES);
  const byMinute = days.map(d => new Map(d.points.map(p => [p.minute, p.pct])));
  return minutes.map(minute => {
    const values = byMinute.map(m => m.get(minute)).filter(v => v !== undefined);
    return {
      minute,
      mean: d3.mean(values),
      median: d3.median(values),
      positiveShare: d3.mean(values, v => v > 0 ? 1 : 0),
      n: values.length,
    };
  });
}

// Each rule picks one minute of the session for its own reason. Rules of the
// same kind that land on the same minute merge into one label. The 9:30 point
// is excluded because every day is 0% there by construction.
// Label text is two tokens per rule: what was measured and its value. The
// Buy/Sell title already says which extreme it is.
const ANNOTATION_RULES = [
  { kind: 'buy',  anchor: 'mean',   pick: a => d3.least(a, d => d.mean),              label: d => `mean ${fmtPct(d.mean)}` },
  { kind: 'buy',  anchor: 'median', pick: a => d3.least(a, d => d.median),            label: d => `median ${fmtPct(d.median)}` },
  { kind: 'buy',  anchor: 'mean',   pick: a => d3.least(a, d => d.positiveShare),     label: d => `${Math.round(d.positiveShare * 100)}% up` },
  { kind: 'sell', anchor: 'mean',   pick: a => d3.greatest(a, d => d.mean),           label: d => `mean ${fmtPct(d.mean)}` },
  { kind: 'sell', anchor: 'median', pick: a => d3.greatest(a, d => d.median),         label: d => `median ${fmtPct(d.median)}` },
  { kind: 'sell', anchor: 'mean',   pick: a => d3.greatest(a, d => d.positiveShare),  label: d => `${Math.round(d.positiveShare * 100)}% up` },
];

// Label geometry. Labels are LABEL_WIDTH wide and sit LABEL_PADDING past the
// connector's horizontal leg ("gutter"). GUTTER_BASE is the first level's
// distance from the point; each further level is one label height further
// out. Levels are limited so a label never wanders far from its dot.
const LABEL_WIDTH = 120, LABEL_LEAD = 24, LABEL_PADDING = 6, LABEL_EST_HEIGHT = 36;
const GUTTER_BASE = 40, LEVEL_STEP = LABEL_EST_HEIGHT + LABEL_PADDING * 2 + 6, MAX_LEVELS = 4, LABEL_CLEARANCE = 6;

// Places one side's labels as close to their points as possible. Each label
// wants to sit just right of its point (left of it near the right edge) on
// the first level. Candidates are every level crossed with a few horizontal
// spots: the preferred one, the near side of the point, and just past each
// placed box. They are tried cheapest first, where cost is levels out plus
// pixels sideways, so a cluster of nearby points stacks vertically and only
// slides along a row when stacking has run out. A spot is free when no
// placed label shares its row within reach and no connector, this one's or a
// placed one's, would cross a label box.
function layoutLabels(items, x, chartWidth) {
  const placed = [];
  const spansX = (o, a, b) => o.left < b + LABEL_CLEARANCE && a - LABEL_CLEARANCE < o.right;
  return items.map(p => {
    const px = x(p.minute);
    const preferred = px + LABEL_LEAD + LABEL_WIDTH <= chartWidth ? px + LABEL_LEAD : px - LABEL_LEAD - LABEL_WIDTH;
    const lefts = [preferred, px - LABEL_LEAD - LABEL_WIDTH]
      .concat(placed.map(o => o.right + LABEL_CLEARANCE))
      .filter(l => l >= 0 && l + LABEL_WIDTH <= chartWidth);
    const free = (level, left) => {
      const right = left + LABEL_WIDTH;
      return placed.every(o => {
        if (o.level === level && spansX(o, left, right)) return false;        // same row, side by side
        if (o.level < level && spansX(o, px, px)) return false;                // my drop passes its box
        if (o.level > level && o.px >= left - LABEL_CLEARANCE && o.px <= right + LABEL_CLEARANCE) return false; // its drop passes my box
        return true;
      });
    };
    const candidates = d3.range(MAX_LEVELS).flatMap(level => lefts.map(left => ({ level, left, cost: level * LEVEL_STEP + Math.abs(left - preferred) })));
    const spot = d3.sort(candidates, c => c.cost).find(c => free(c.level, c.left)) || { level: 0, left: preferred };
    placed.push({ px, left: spot.left, right: spot.left + LABEL_WIDTH, level: spot.level });
    return { p, left: spot.left, gutter: GUTTER_BASE + spot.level * LEVEL_STEP };
  });
}

function buildAnnotationPoints(aggregates) {
  const candidates = aggregates.filter(a => a.minute > SESSION_OPEN_MIN);
  const picks = ANNOTATION_RULES.map(rule => ({ rule, agg: rule.pick(candidates) }));
  return d3.groups(picks, p => `${p.rule.kind}@${p.agg.minute}`).map(([id, group]) => ({
    id,
    minute: group[0].agg.minute,
    kind: group[0].rule.kind,
    anchor: group[0].rule.anchor,
    agg: group[0].agg,
    reasons: group.map(p => p.rule.label(p.agg)),
  }));
}

// Weighted Pearson correlation of two equal-length series. Shape only: a day
// that made the same moves at twice the size scores 1, a mirror image scores
// -1, a flat series has no shape to compare and scores 0. Weights ramp
// linearly so the latest bar counts RECENCY_WEIGHT times the first: how the
// day is going now matters more than how it opened.
const RECENCY_WEIGHT = 3;
function correlation(a, b) {
  const n = a.length;
  const w = a.map((_, i) => 1 + (n > 1 ? i / (n - 1) : 0) * (RECENCY_WEIGHT - 1));
  const wsum = d3.sum(w);
  const ma = d3.sum(a, (v, i) => w[i] * v) / wsum, mb = d3.sum(b, (v, i) => w[i] * v) / wsum;
  const cov = d3.sum(a, (v, i) => w[i] * (v - ma) * (b[i] - mb));
  const va = d3.sum(a, (v, i) => w[i] * (v - ma) ** 2), vb = d3.sum(b, (v, i) => w[i] * (v - mb) ** 2);
  return va === 0 || vb === 0 ? 0 : cov / Math.sqrt(va * vb);
}

// Similar-days filter. The reference is the latest day, which during a
// session is today so far. Its path is compared with every other day's over
// the same minutes by recency-weighted correlation and the best-correlated
// KEEP_SHARE of them is kept (at least one day), so the match is about shape,
// not level, with the latest bars counting most. A day missing any of those
// minutes (a half session shorter than the reference) is left out.
const KEEP_SHARE = 0.02;
function similarDays(days, reference) {
  const refByMinute = new Map(reference.points.map(p => [p.minute, p.pct]));
  const cutoff = reference.points[reference.points.length - 1].minute;
  const minutes = d3.range(SESSION_OPEN_MIN + BAR_MINUTES, cutoff + 1, BAR_MINUTES);
  const refSeries = minutes.map(m => refByMinute.get(m));
  const scored = days
    .filter(d => d !== reference)
    .map(d => {
      const byMinute = new Map(d.points.map(p => [p.minute, p.pct]));
      if (!minutes.every(m => byMinute.has(m))) return null;
      return { day: d, r: correlation(refSeries, minutes.map(m => byMinute.get(m))) };
    })
    .filter(Boolean);
  const keepCount = Math.max(1, Math.round(scored.length * KEEP_SHARE));
  const kept = d3.sort(scored, d => -d.r).slice(0, keepCount).map(d => d.day);
  return { days: d3.sort([reference, ...kept], d => d.date), cutoff };
}

class IntradayOverlayChart {
  constructor() {
    const attrs = {
      id: 'ID' + Math.floor(Math.random() * 1000000),
      svgWidth: 400,
      svgHeight: 600,
      marginTop: 12,
      marginBottom: 32,
      marginRight: 16,
      marginLeft: 52,
      container: 'body',
      defaultFont: 'inherit',
      data: null,
      aggregates: null,
      chartWidth: null,
      chartHeight: null,
      firstRender: true,
      yScaleType: 'symlog',
      symlogLinearPct: 0.1,
      minuteOffset: 0,          // added to New York minutes for axis and readout labels
      zoneLabel: 'ET',
      referenceId: null,        // day drawn as the reference when the similar-days filter is on
      matchCutoff: null,        // last matched minute; shades the window when set
      todayId: null,            // the latest day in the file, drawn on its own layer on top
    };
    this.getState = () => attrs;
    this.setState = d => Object.assign(attrs, d);
    Object.keys(attrs).forEach(key => {
      this[key] = function (_) {
        if (!arguments.length) return attrs[key];
        attrs[key] = _;
        return this;
      };
    });
    this.initializeEnterExitUpdatePattern();
  }

  render() {
    this.setDynamicContainer();
    this.calculateProperties();
    this.drawSvgAndWrappers();
    this.drawScales();
    this.drawAxes();
    this.drawDays();
    this.drawAggregates();
    this.drawNow();
    this.drawAnnotations();
    this.drawToday();
    this.drawHover();
    this.setState({ firstRender: false });
    return this;
  }

  calculateProperties() {
    const { marginLeft, marginTop, marginRight, marginBottom, svgWidth, svgHeight } = this.getState();
    const calc = { chartLeftMargin: marginLeft, chartTopMargin: marginTop };
    const chartWidth = svgWidth - marginRight - marginLeft;
    const chartHeight = svgHeight - marginBottom - marginTop;
    this.setState({ calc, chartWidth, chartHeight });
  }

  drawScales() {
    const { data, chartWidth, chartHeight, yScaleType, symlogLinearPct } = this.getState();
    const allPct = data.flatMap(d => d.points.map(p => p.pct));
    const x = d3.scaleLinear().domain([SESSION_OPEN_MIN, SESSION_CLOSE_MIN]).range([0, chartWidth]);
    const [lo, hi] = d3.extent(allPct);
    const limit = Math.ceil(Math.max(-lo, hi));
    const y = (yScaleType === 'symlog'
      ? d3.scaleSymlog().constant(symlogLinearPct)
      : d3.scaleLinear()).domain([-limit, limit]).range([chartHeight, 0]);
    const yTicks = yScaleType === 'symlog'
      ? [0].concat(NICE_PCT_LADDER.filter(t => t >= symlogLinearPct && t <= limit).flatMap(t => [t, -t]))
      : y.ticks(8);
    const line = d3.line().x(p => x(p.minute)).y(p => y(p.pct));
    this.setState({ x, y, yTicks, line });
  }

  drawAxes() {
    const { chart, x, y, yTicks, chartWidth, chartHeight, minuteOffset } = this.getState();
    const isWholeHour = m => ((m + minuteOffset) % 60 + 60) % 60 === 0;
    const hourTicks = [SESSION_OPEN_MIN, SESSION_CLOSE_MIN]
      .concat(d3.range(SESSION_OPEN_MIN + 1, SESSION_CLOSE_MIN).filter(isWholeHour));
    const fmtTick = m => fmtClock(m + minuteOffset);

    chart._add('g.grid')
      .call(d3.axisLeft(y).tickValues(yTicks).tickSize(-chartWidth).tickFormat(''))
      .call(g => g.select('.domain').remove());

    chart._add('g.x-axis').classed('axis', true)
      .attr('transform', `translate(0,${chartHeight})`)
      .call(d3.axisBottom(x).tickValues(hourTicks).tickFormat(fmtTick).tickSizeOuter(0));

    chart._add('g.y-axis').classed('axis', true)
      .call(d3.axisLeft(y).tickValues(yTicks).tickFormat(fmtAxisPct).tickSizeOuter(0));

    chart._add('line.zero')
      .attr('x1', 0).attr('x2', chartWidth)
      .attr('y1', y(0)).attr('y2', y(0));
  }

  drawDays() {
    const { chart, data, line, referenceId, matchCutoff, x, chartHeight } = this.getState();
    chart._add('g.match')._add('rect.match-window')
      .attr('x', x(SESSION_OPEN_MIN)).attr('y', 0)
      .attr('width', matchCutoff === null ? 0 : x(matchCutoff) - x(SESSION_OPEN_MIN))
      .attr('height', chartHeight);
    const { todayId } = this.getState();
    chart._add('g.days')._add('path.day-path', data.filter(d => d.id !== todayId))
      .attr('d', d => line(d.points))
      .classed('reference', d => d.id === referenceId)
      .style('opacity', d => d.id === referenceId ? 1 : DAY_OPACITY);
  }

  // Today's path on its own layer above the aggregates and labels. The line
  // draws itself in on the first render; the ring pulses while the session
  // is open, and rests as a plain dot after the close.
  drawToday() {
    const { chart, data, line, x, y, chartWidth, todayId, firstRender } = this.getState();
    const today = data.find(d => d.id === todayId);
    const g = chart._add('g.today').style('display', today ? null : 'none');
    if (!today) return;
    const last = today.points[today.points.length - 1];
    const live = marketMinuteNow() !== null && fmtIsoDay(today.date) === marketDateNow();
    const d = line(today.points);
    g._add('path.today-glow').attr('d', d);
    const path = g._add('path.today-path').attr('d', d);
    if (firstRender) {
      const length = path.node().getTotalLength();
      path.attr('stroke-dasharray', `${length} ${length}`).attr('stroke-dashoffset', length)
        .transition().duration(900).ease(d3.easeCubicOut).attr('stroke-dashoffset', 0)
        .on('end', () => path.attr('stroke-dasharray', null).attr('stroke-dashoffset', null));
    }
    const cx = x(last.minute), cy = y(last.pct);
    g._add('g.today-rings', live ? [0, 1] : []).attr('transform', `translate(${cx},${cy})`)
      ._add('circle.today-ring', k => [k]).attr('r', 5).classed('second', k => k === 1);
    g._add('circle.today-dot').attr('cx', cx).attr('cy', cy).attr('r', 4);
    const nearRightEdge = cx > chartWidth - 110;
    // "today" beside the dot, below it so sell labels above the line stay
    // clear. The pulsing rings, not the word, say whether the session is open.
    g._add('text.today-label')
      .attr('x', cx + (nearRightEdge ? -10 : 10)).attr('y', cy + 18)
      .attr('text-anchor', nearRightEdge ? 'end' : 'start')
      .text('today');
  }

  drawAggregates() {
    const { chart, aggregates, x, y } = this.getState();
    const meanLine = d3.line().x(a => x(a.minute)).y(a => y(a.mean));
    const medianLine = d3.line().x(a => x(a.minute)).y(a => y(a.median));
    const g = chart._add('g.aggregates');
    g._add('path.median-path').attr('d', medianLine(aggregates));
    g._add('path.mean-path').attr('d', meanLine(aggregates));
  }

  drawAnnotations() {
    const { chart, aggregates, x, y, chartWidth, minuteOffset, zoneLabel } = this.getState();
    const KIND_TITLE = { buy: 'Buy', sell: 'Sell' };
    const points = d3.sort(buildAnnotationPoints(aggregates), p => p.minute);
    // Buys go below the line, sells above, except that a label whose row
    // would leave the plot (a sell near the top edge, a buy near the bottom)
    // takes the other side. Sides are settled before packing so a flipped
    // label shares its new row's layout instead of landing on top of it.
    const { chartHeight } = this.getState();
    const sideOf = p => {
      const py = y(p.agg[p.anchor]);
      const sign = p.kind === 'buy' ? 1 : -1;
      if (sign < 0 && py - GUTTER_BASE - LABEL_EST_HEIGHT < 0) return 1;
      if (sign > 0 && py + GUTTER_BASE + LABEL_EST_HEIGHT > chartHeight) return -1;
      return sign;
    };
    const sides = [1, -1].map(sign => ({ sign, items: points.filter(p => sideOf(p) === sign) }));
    const annotations = sides.flatMap(({ sign, items }) => layoutLabels(items, x, chartWidth).map(({ p, left, gutter }) => {
      const px = x(p.minute), py = y(p.agg[p.anchor]);
      const dy = sign * gutter;
      return {
        x: px, y: py, dx: left - px, dy,
        className: p.kind,
        subject: { radius: 5 },
        // Vertical drop from the point to the gutter, then horizontal to the
        // label's left edge. No diagonal legs.
        connector: { type: 'curve', curve: d3.curveLinear, points: [[0, dy]] },
        note: {
          // The zone suffix only when times are New York's; in the viewer's
          // own time the clock needs no qualifier.
          title: `${KIND_TITLE[p.kind]} ${fmtClock(p.minute + minuteOffset)}${minuteOffset === 0 ? ` ${zoneLabel}` : ''}`,
          label: p.reasons.join(', '),
          align: 'left',
          lineType: 'none',
          wrap: LABEL_WIDTH,
          bgPadding: { top: 3, left: 5, right: 5, bottom: 3 },
        },
      };
    }));
    this.keepLabelsOffToday(annotations);
    const g = chart._add('g.annotations');
    g.selectAll('*').remove();          // d3-annotation owns this subtree; rebuild it each render
    g.call(d3.annotation().type(d3.annotationCalloutCircle).notePadding(LABEL_PADDING).annotations(annotations));
  }

  // Today's line is the thing to read, so no label may sit on it. Each label
  // box is tested against today's points (a 5-minute bar is ~14px wide, so
  // the box is padded by that much). A box on the line is pushed outward in
  // steps; if it runs out of plot it flips to the other side and tries again
  // from there. A flip that would land on another label is not taken.
  keepLabelsOffToday(annotations) {
    const { data, x, y, chartHeight, todayId } = this.getState();
    const today = data.find(d => d.id === todayId);
    if (!today) return;
    const PAD = 8, STEP = 24, MAX_TRIES = 6;
    const todayPts = today.points.map(p => ({ x: x(p.minute), y: y(p.pct) }));
    const boxOf = a => {
      const left = a.x + a.dx, right = left + LABEL_WIDTH;
      const top = a.dy > 0 ? a.y + a.dy + LABEL_PADDING : a.y + a.dy - LABEL_PADDING - LABEL_EST_HEIGHT;
      return { left, right, top, bottom: top + LABEL_EST_HEIGHT };
    };
    const touchesToday = b => todayPts.some(p =>
      p.x > b.left - PAD && p.x < b.right + PAD && p.y > b.top - PAD && p.y < b.bottom + PAD);
    const boxesOverlap = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
    const insidePlot = b => b.top >= 0 && b.bottom <= chartHeight;
    const clearOfOthers = (a, b) => annotations.every(o => o === a || !boxesOverlap(b, boxOf(o)));

    annotations.forEach(a => {
      if (!touchesToday(boxOf(a))) return;
      const startDy = a.dy;
      for (const sign of [Math.sign(startDy), -Math.sign(startDy)]) {
        let dy = sign === Math.sign(startDy) ? startDy : -startDy;
        for (let i = 0; i < MAX_TRIES; i++) {
          const candidate = { ...a, dy };
          const b = boxOf(candidate);
          if (!insidePlot(b)) break;
          if (!touchesToday(b) && clearOfOthers(a, b)) {
            a.dy = dy;
            a.connector.points = [[0, dy]];
            return;
          }
          dy += sign * STEP;
        }
      }
    });
  }

  // Vertical marker at the current time while the session is open. Called
  // from render() and again on a timer so it walks across the chart.
  drawNow() {
    const { chart, x, chartHeight, minuteOffset, zoneLabel } = this.getState();
    const minute = marketMinuteNow();
    const g = chart._add('g.now').style('display', minute === null ? 'none' : null);
    if (minute === null) return;
    const px = x(minute);
    const nearRightEdge = px > x(SESSION_CLOSE_MIN) - 90;
    // A short tick at the top rather than a full-height rule: enough to
    // place "now" without cutting across the paths.
    g._add('line.now-line').attr('x1', px).attr('x2', px).attr('y1', 0).attr('y2', chartHeight * NOW_TICK_SHARE);
    g._add('text.now-label')
      .attr('x', px + (nearRightEdge ? -6 : 6)).attr('y', 12)
      .attr('text-anchor', nearRightEdge ? 'end' : 'start')
      .text(`now ${fmtClock(minute + minuteOffset)} ${zoneLabel}`);
  }

  drawHover() {
    const { chart, d3Container, aggregates, data, x, chartWidth, chartHeight, minuteOffset, zoneLabel, referenceId } = this.getState();
    const restOpacity = d => d.id === referenceId ? 1 : DAY_OPACITY;
    const rule = chart._add('line.hover-rule')
      .attr('y1', 0).attr('y2', chartHeight)
      .style('display', 'none');
    const readout = d3Container._add('div.readout').style('display', 'none');
    const dayPaths = chart.selectAll('path.day-path');
    const bisectMinute = d3.bisector(a => a.minute).center;
    const bisectPoint = d3.bisector(p => p.minute).center;

    chart._add('rect.hover-target')
      .attr('width', chartWidth).attr('height', chartHeight)
      .attr('fill', 'transparent')
      .on('mousemove', (event) => {
        const minute = x.invert(d3.pointer(event)[0]);
        const agg = aggregates[bisectMinute(aggregates, minute)];
        rule.style('display', null).attr('x1', x(agg.minute)).attr('x2', x(agg.minute));

        // The day whose path is nearest the cursor gets highlighted.
        const cursorPct = this.getState().y.invert(d3.pointer(event)[1]);
        const nearest = d3.least(data, d => {
          const p = d.points[bisectPoint(d.points, agg.minute)];
          return p.minute === agg.minute ? Math.abs(p.pct - cursorPct) : Infinity;
        });
        dayPaths.classed('hover', d => d === nearest).style('opacity', d => d === nearest ? 1 : restOpacity(d));
        const nearestPct = nearest.points[bisectPoint(nearest.points, agg.minute)].pct;

        readout.style('display', null).html(`
          <div class="t">${fmtClock(agg.minute + minuteOffset)} ${zoneLabel}</div>
          <div class="s">change vs 9:30 open, ${agg.n} days</div>
          <div class="r mean"><span>mean day</span><b>${fmtPct(agg.mean)}</b></div>
          <div class="r median"><span>median day</span><b>${fmtPct(agg.median)}</b></div>
          <div class="r"><span>days above open</span><b>${Math.round(agg.positiveShare * 100)}%</b></div>
          <div class="r day"><span>${d3.timeFormat('%b %-d, %Y')(nearest.date)}</span><b>${fmtPct(nearestPct)}</b></div>`);
      })
      .on('mouseleave', () => {
        rule.style('display', 'none');
        readout.style('display', 'none');
        dayPaths.classed('hover', false).style('opacity', restOpacity);
      });
  }

  drawSvgAndWrappers() {
    const { d3Container, svgWidth, svgHeight, defaultFont, calc } = this.getState();
    const svg = d3Container._add('svg.svg-container')
      .attr('width', svgWidth)
      .attr('height', svgHeight)
      .attr('font-family', defaultFont);
    const chart = svg._add('g.chart')
      .attr('transform', `translate(${calc.chartLeftMargin},${calc.chartTopMargin})`);
    this.setState({ chart, svg });
  }

  initializeEnterExitUpdatePattern() {
    d3.selection.prototype._add = function (classSelector, data, params) {
      const container = this;
      const split = classSelector.split('.');
      const elementTag = split[0];
      const className = split[1] || 'not-good';
      const exitTransition = params?.exitTransition;
      const enterTransition = params?.enterTransition;

      let bindData = data;
      if (typeof data === 'function') bindData = data(container.datum());
      if (bindData && !Array.isArray(bindData)) bindData = [bindData];
      if (!bindData) bindData = container.datum() ? d => [d] : [className];

      let selection = container.selectAll(elementTag + '.' + className).data(bindData, (d, i) => {
        if (typeof d === 'object' && d.id) return d.id;
        return i;
      });
      if (exitTransition) exitTransition(selection); else selection.exit().remove();
      const enterSelection = selection.enter().append(elementTag);
      if (enterTransition) enterTransition(enterSelection);
      selection = enterSelection.merge(selection);
      selection.attr('class', className);
      if (className === 'not-good') {
        selection.attr('stroke', 'red').attr('stroke-width', 10);
        selection.selectAll('title').data(['not-good']).join('title').text("You don't have a class set for this element!");
      }
      return selection;
    };
  }

  setDynamicContainer() {
    const attrs = this.getState();
    const d3Container = d3.select(attrs.container);
    const containerRect = d3Container.node().getBoundingClientRect();
    if (containerRect.width > 0) attrs.svgWidth = containerRect.width;
    const self = this;
    d3.select(window).on('resize.' + attrs.id, function () {
      const rect = d3Container.node().getBoundingClientRect();
      if (rect.width > 0) attrs.svgWidth = rect.width;
      self.render();
    });
    this.setState({ d3Container });
  }
}

function renderCoverage(days) {
  const fmtDate = d3.timeFormat('%b %-d, %Y');
  d3.select('#coverage').html(
    `TQQQ ${BAR_MINUTES}-min bars, <b>${days.length}</b> trading days, ` +
    `<b>${fmtDate(days[0].date)}</b> to <b>${fmtDate(days[days.length - 1].date)}</b>`);
}

// The slider position survives reloads. A thumb resting on an edge is saved
// as 'edge' so it keeps following the data as days are appended; a thumb in
// the middle is saved as its date so it lands on the same day next time.
const PERIOD_STORAGE_KEY = 'tqqq-intraday-period';
const fmtIsoDay = d3.timeFormat('%Y-%m-%d');

// localStorage can be missing or throw (private mode, blocked storage);
// the slider then just starts at the edges.
function readSavedPeriod() {
  try { return JSON.parse(localStorage.getItem(PERIOD_STORAGE_KEY)) || {}; } catch { return {}; }
}
function writeSavedPeriod(period) {
  try { localStorage.setItem(PERIOD_STORAGE_KEY, JSON.stringify(period)); } catch { /* storage unavailable */ }
}

// Index of the saved thumb in allDays. 'edge' or a date outside the data
// falls back to that thumb's own edge; a date with no exact match (a
// holiday, or a day filtered out later) snaps inward to the nearest day.
function restoreThumb(saved, allDays, edgeIndex, isStart) {
  if (!saved || saved === 'edge') return edgeIndex;
  const days = allDays.map(d => fmtIsoDay(d.date));
  const exact = days.indexOf(saved);
  if (exact >= 0) return exact;
  const inward = isStart ? days.findIndex(d => d > saved) : days.findLastIndex(d => d < saved);
  return inward >= 0 ? inward : edgeIndex;
}

// Two-thumb period slider over the loaded trading days. Each thumb is an
// index into allDays; the thumbs cannot cross. Every move re-filters the
// days, recomputes the aggregates and rules, and re-renders the chart.
function setupPeriodSlider(allDays, onChange) {
  const start = d3.select('#range-start'), end = d3.select('#range-end'), fill = d3.select('#range-fill');
  const last = allDays.length - 1;
  const saved = readSavedPeriod();
  start.attr('max', last).property('value', restoreThumb(saved.start, allDays, 0, true));
  end.attr('max', last).property('value', restoreThumb(saved.end, allDays, last, false));

  const apply = () => {
    let lo = +start.property('value'), hi = +end.property('value');
    if (lo > hi) [lo, hi] = [hi, lo];
    start.property('value', lo);
    end.property('value', hi);
    fill.style('left', `${lo / last * 100}%`).style('width', `${(hi - lo) / last * 100}%`);
    writeSavedPeriod({
      start: lo === 0 ? 'edge' : fmtIsoDay(allDays[lo].date),
      end: hi === last ? 'edge' : fmtIsoDay(allDays[hi].date),
    });
    onChange(allDays.slice(lo, hi + 1));
  };
  start.on('input', apply);
  end.on('input', apply);
  apply();
}

// On/off switches whose state survives reloads, one localStorage key each.
// localStorage can be missing or throw (private mode, blocked storage); the
// switch then just starts off.
const SIMILAR_STORAGE_KEY = 'tqqq-intraday-similar';
const LOCAL_TZ_STORAGE_KEY = 'tqqq-intraday-local-time';
function readSavedSwitch(key) {
  try { return localStorage.getItem(key) === '1'; } catch { return false; }
}
function writeSavedSwitch(key, on) {
  try { localStorage.setItem(key, on ? '1' : '0'); } catch { /* storage unavailable */ }
}

// Similar-days control: just the toggle.
function setupSimilarFilter(onChange) {
  const state = { on: readSavedSwitch(SIMILAR_STORAGE_KEY) };
  d3.select('#toggle-similar').property('checked', state.on).on('change', function () {
    state.on = this.checked;
    writeSavedSwitch(SIMILAR_STORAGE_KEY, state.on);
    onChange();
  });
  return state;
}

d3.tsv(DATA_URL).then(rows => {
  const allDays = d3.sort(buildDays(rows), d => d.date);
  const chart = new IntradayOverlayChart().container('#chart');
  let periodDays = allDays;

  const refresh = () => {
    let days = periodDays, cutoff = null, reference = null;
    if (similar.on) {
      reference = periodDays[periodDays.length - 1];
      ({ days, cutoff } = similarDays(periodDays, reference));
    }
    renderCoverage(days);
    chart.data(days).aggregates(buildAggregates(days))
      .referenceId(reference ? reference.id : null).matchCutoff(cutoff)
      .todayId(allDays[allDays.length - 1].id)
      .render();
  };
  const similar = setupSimilarFilter(refresh);

  // Timezone switch. Applied before the first render so a saved "on" state
  // draws local times from the start.
  const localOffset = localOffsetFromMarket();
  const localLabel = shortZoneName(LOCAL_TZ);
  d3.select('#tz-switch-label').text(`Show in my time (${localLabel})`);
  const applyLocalTime = on => chart.minuteOffset(on ? localOffset : 0).zoneLabel(on ? localLabel : 'ET');
  const localTimeOn = readSavedSwitch(LOCAL_TZ_STORAGE_KEY);
  applyLocalTime(localTimeOn);
  d3.select('#toggle-local-tz').property('checked', localTimeOn).on('change', function () {
    writeSavedSwitch(LOCAL_TZ_STORAGE_KEY, this.checked);
    applyLocalTime(this.checked).render();
  });

  setupPeriodSlider(allDays, days => { periodDays = days; refresh(); });

  setInterval(() => chart.drawNow(), NOW_REFRESH_MS);
});
</script>
</body>
