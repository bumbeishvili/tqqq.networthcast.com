    return { lo: Math.min(a, b), hi: Math.max(a, b) };
  };
  let drawn = null;       // the thumbs' days the charts were last given
  let current = true;     // false once newer data has a slider of its own: nothing of this one draws any more

  // `moved`: a thumb was dragged. Only then is the period saved: a setup on a
  // fund with a shorter history snaps a thumb to its edge, and saving that
  // would lose the day another fund's view had.
  const apply = (moved) => {
    const { lo, hi } = read();
    start.property('value', lo);
    end.property('value', hi);
    fill.style('left', `${lo / last * 100}%`).style('width', `${(hi - lo) / last * 100}%`);
    if (moved) writeSavedPeriod({
      start: lo === 0 ? 'edge' : fmtIsoDay(allDays[lo].date),
      end: hi === last ? 'edge' : fmtIsoDay(allDays[hi].date),
    });
    drawn = { lo, hi };
    onChange(allDays.slice(lo, hi + 1), { first: lo, days: hi - lo + 1 });
  };
  start.on('input', () => apply(true));
  end.on('input', () => apply(true));

  // A drag on the stretch between the thumbs moves both by the same number of
  // days, so the period keeps its length and stops at either end of the data
  // (the user, 2026-11-23: "make sure I can drag the range"). The pointer is
  // captured, so the drag goes on outside the slider. The charts follow a
  // frame at most.
  let drag = null, frame = 0;
  fill.on('pointerdown', (event) => {
    if (event.button !== 0) return;
    const { lo, hi } = read();
    drag = { x: event.clientX, lo, length: hi - lo, daysPerPx: last / d3.select('#period-range').node().getBoundingClientRect().width };
    fill.classed('dragging', true).node().setPointerCapture(event.pointerId);
    event.preventDefault();   // no text selection while dragging
  }).on('pointermove', (event) => {
    if (!drag) return;
    const lo = Math.max(0, Math.min(last - drag.length, drag.lo + Math.round((event.clientX - drag.x) * drag.daysPerPx)));
    start.property('value', lo);
    end.property('value', lo + drag.length);
    if (!frame) frame = requestAnimationFrame(() => {
      frame = 0;
      if (!current) return;
      const now = read();
      if (now.lo !== drawn.lo || now.hi !== drawn.hi) apply(true);
    });
  }).on('pointerup pointercancel', () => {
    if (!drag) return;
    drag = null;
    fill.classed('dragging', false);
  });
  apply(false);
  const stop = () => { current = false; };
  // Reset filters: the whole file, saved as both edges.
  const reset = () => {
    start.property('value', 0);
    end.property('value', last);
    apply(true);
  };
  return { stop, reset };
}

// The daily bars' own window (the user, 2026-11-27: "when zooming in it
// should not affect other filters, but other filtes should affect it"):
// ⌘/Ctrl + wheel zooms it and ⌘/Ctrl + drag slides it inside the period the
// slider sets, and the slider, the other charts and every filter stay as they
// are. The filters still reach the bars: a day they leave out is pale, and a
// new period, the slider's, is the window again (follow). `view` is { first,
// days } in days from the first loaded day: whole days at rest, fractions of
// a day while a zoom or a slide is under way, so the bars move evenly with the
// pointer (the user, 2026-11-23: "it's jumpy, can you fix jumpiness when
// zooming in"); when the gesture is over the window glides onto whole days.
// onView(): the window moved, the daily bars are drawn again, a frame at most.
// The page builds everything again when new data comes in (each minute in the
// session), so a zoomed window is handed on by its first and last dates
// (carried(), the next one's `kept`) and taken back when the new period still
// holds both.
const DAILY_ZOOM_MIN_DAYS = 5;          // a zoom stops at a week of trading days, or at the period's length when it is shorter
const DAILY_SETTLE_AFTER_MS = 250;      // a wheel still this long has ended its zoom (the main chart's settleMs)
const DAILY_SETTLE_MS = 160;            // the glide of the window onto whole days
function setupDailyZoom(allDays, onView, kept) {
  let bounds = null, view = null;       // the period's window, and the one shown inside it
  let current = true, frame = 0, settleTimer = 0, settling = null;
  const draw = () => {
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; if (current) onView(); });
  };
  const stopSettling = () => {
    clearTimeout(settleTimer);
    if (settling) settling.stop();
    settling = null;
  };
  // A window of `days` inside the period, its first day moved in from either end.
  const inside = (first, days) => ({ first: Math.max(bounds.first, Math.min(bounds.first + bounds.days - days, first)), days });
  const settle = () => {
    stopSettling();
    const from = view, days = Math.min(bounds.days, Math.max(1, Math.round(from.days)));
    const to = inside(Math.round(from.first + (from.days - days) / 2), days);
    if (from.first === to.first && from.days === to.days) return;
    settling = d3.timer((elapsed) => {
      const t = Math.min(1, elapsed / DAILY_SETTLE_MS), k = d3.easeCubicOut(t);
      view = t === 1 ? to : { first: from.first + (to.first - from.first) * k, days: from.days + (to.days - from.days) * k };
      if (current) onView();
      if (t === 1) stopSettling();
    });
  };
  // The window scaled to `factor` times its days around a pivot: `at` runs
  // from 0, the window's left edge, to 1, its right, and the day there stays
  // where it is. Never under DAILY_ZOOM_MIN_DAYS and never past the period.
  // The window settles once the wheel has been still for DAILY_SETTLE_AFTER_MS.
  const zoom = (factor, at) => {
    stopSettling();
    const days = Math.max(Math.min(DAILY_ZOOM_MIN_DAYS, bounds.days), Math.min(bounds.days, view.days * factor));
    view = inside(view.first + at * (view.days - days), days);
    draw();
    settleTimer = setTimeout(settle, DAILY_SETTLE_AFTER_MS);
  };
  // A hold on the window as it stands: slide(days) puts it that many days from
  // where it was taken hold of, its length kept, stopped at either end of the
  // period. From the hold and not from the last step, so a drag past an end
  // and back returns to the same days.
  const grip = () => {
    stopSettling();
    const held = view;
    return days => { view = inside(held.first + days, held.days); draw(); };
  };
  // The period's window: the bars' window too, but on the first period of this
  // data, the window handed on from the data before when the period holds it.
  const follow = (period) => {
    stopSettling();
    bounds = period;
    const isoDays = kept ? allDays.map(day => fmtIsoDay(day.date)) : null;
    const from = kept ? isoDays.indexOf(kept.first) : -1, to = kept ? isoDays.indexOf(kept.last) : -1;
    kept = null;
    view = from >= period.first && to >= from && to < period.first + period.days ? { first: from, days: to - from + 1 } : period;
  };
  // The window's whole days by date while it is narrower than the period; null when it is the period.
  const carried = () => {
    if (!view || (view.first === bounds.first && view.days === bounds.days)) return null;
    const first = Math.max(0, Math.round(view.first)), last = Math.min(allDays.length - 1, first + Math.max(1, Math.round(view.days)) - 1);
    return { first: fmtIsoDay(allDays[first].date), last: fmtIsoDay(allDays[last].date) };
  };
  const stop = () => {
    current = false;
    stopSettling();
  };
  return { zoom, grip, settle, follow, carried, stop, view: () => view };
}

// On/off switches whose state survives reloads, one localStorage key each.
// With nothing saved, or when localStorage is missing or throws (private
// mode, blocked storage), the switch takes its default.
const SIMILAR_STORAGE_KEY = 'tqqq-intraday-similar';
const TREND_STORAGE_KEY = 'tqqq-intraday-trend';
const LOG_SCALE_STORAGE_KEY = 'tqqq-intraday-log-scale';
const WEEKDAY_STAT_STORAGE_KEY = 'tqqq-intraday-weekday-stat';
const WEEKDAY_MEDIAN_STORAGE_KEY = 'tqqq-intraday-weekday-median';   // the Median switch the choice replaced on 23 November 2026: its saved "on" still means the median
function readSavedSwitch(key, fallback = false) {
  if (key === SIMILAR_STORAGE_KEY && EMBED_SIMILAR !== null) return EMBED_SIMILAR;
  if (key === TREND_STORAGE_KEY && EMBED_TREND !== null) return EMBED_TREND;
  if (key === LOG_SCALE_STORAGE_KEY && EMBED_LOG !== null) return EMBED_LOG;
  try {
    const saved = localStorage.getItem(key);
    return saved === null ? fallback : saved === '1';
  } catch { return fallback; }
}
function writeSavedSwitch(key, on) {
  if (EMBED) return;
  try { localStorage.setItem(key, on ? '1' : '0'); } catch { /* storage unavailable */ }
}

// Metric filters: keep days whose open and whose close, both vs the previous
// session's close, fall inside brushed ranges. Each metric is a
// small histogram over all days with the same number of bins, spanning the
// metric's full extent rounded to 0.1%. The brush starts at the full extent,
// handles showing, so the control reads as a range from the first look; at
// the full extent nothing is filtered. The latest day is never filtered out:
// it is the reference the similar-days filter compares against. Each brush
// is saved; a bound at an extreme is saved as 'edge' so it keeps following
// the data.
const METRICS = {
  open: { value: d => d.openVsPrevPct },
  close: { value: d => d.closeVsPrevPct },
};
const METRIC_STEP = 0.1;
const METRIC_BINS = 30;
const HANDLE_LABEL_GAP = 6;              // px kept between a histogram's two bound labels
// A fund's own ranges, since the moves differ in size; TQQQ keeps the keys it had. The fund is the one the
// histogram was set up for, so a brush moved while another fund is loading is still saved under its own.
const metricStorageKey = (key, fund) => `tqqq-intraday-metric-${key}${fund === DEFAULT_TICKER ? '' : '-' + fund}`;
function readSavedRange(key, fund) {
  try { return JSON.parse(localStorage.getItem(metricStorageKey(key, fund))) || {}; } catch { return {}; }
}
function writeSavedRange(key, fund, range) {
  try { localStorage.setItem(metricStorageKey(key, fund), JSON.stringify(range)); } catch { /* storage unavailable */ }
}

// One brushable histogram. Returns { pass(day) } for the current range.
function setupMetricHistogram(key, fund, allDays, onChange) {
  const block = d3.select(`.metric[data-metric="${key}"]`);
  const svg = block.select('svg.metric-hist'), rangeLabel = block.select('.metric-range');
  const round = v => +v.toFixed(1);
  const values = allDays.map(METRICS[key].value).filter(v => v !== null);
  const min = round(Math.floor(d3.min(values) / METRIC_STEP) * METRIC_STEP);
  const max = round(Math.ceil(d3.max(values) / METRIC_STEP) * METRIC_STEP);
  const state = { lo: min, hi: max };

  // Measured after layout, then pinned, so the brush extent and the bars
  // always agree with the box even if the row later reflows.
  svg.selectAll('*').remove();                       // a data refresh rebuilds the histogram
  const width = svg.node().clientWidth, height = svg.node().clientHeight;   // inside the frame
  svg.style('width', `${width + 2}px`).style('flex', 'none');
  const x = d3.scaleLinear().domain([min, max]).range([0, width]);
  const bins = d3.bin().domain([min, max]).thresholds(d3.range(1, METRIC_BINS).map(i => min + (max - min) * i / METRIC_BINS))(values);
  const y = d3.scaleLinear().domain([0, d3.max(bins, b => b.length)]).range([height, 2]);
  const bars = svg.append('g').attr('class', 'bars').selectAll('rect.bar').data(bins).join('rect').attr('class', 'bar')
    .attr('x', b => x(b.x0) + 0.5).attr('width', b => Math.max(1, x(b.x1) - x(b.x0) - 1))
    .attr('y', b => y(b.length)).attr('height', b => height - y(b.length));
  svg.append('line').attr('class', 'zero').attr('x1', x(0)).attr('x2', x(0)).attr('y1', 0).attr('y2', height);
  const brush = d3.brushX().extent([[0, 0], [width, height]]).handleSize(6);
  const brushG = svg.append('g').attr('class', 'brush').call(brush);
  const handleLabels = svg.append('g').attr('class', 'handle-labels');
  const fullRange = () => [x(min), x(max)];
  svg.on('dblclick', () => brushG.call(brush.move, fullRange()));

  const apply = selection => {
    // A cleared brush (dragging it away) means the full range again.
    if (!selection) { brushG.call(brush.move, fullRange()); return; }
    const [a, b] = selection.map(v => round(x.invert(v)));
    state.lo = a; state.hi = b;
    const active = a > min || b < max;
    bars.classed('in', bin => !active || (bin.x1 > a && bin.x0 < b));
    rangeLabel.text(active ? '' : 'any');
    // The bounds sit under their handles, centred, then clamped by their
    // measured width so neither leaves the box and the two never touch: the
    // lower label yields leftwards, the upper rightwards.
    const labels = [{ v: a, px: x(a) }, { v: b, px: x(b) }];
    const texts = handleLabels.selectAll('text.handle-label').data(labels).join('text').attr('class', 'handle-label')
      .attr('y', height + 3).attr('text-anchor', 'start').text(d => fmtPct(d.v, 1));
    const widths = texts.nodes().map(n => n.getComputedTextLength());
    let left0 = Math.max(0, Math.min(width - widths[0], labels[0].px - widths[0] / 2));
    let left1 = Math.max(0, Math.min(width - widths[1], labels[1].px - widths[1] / 2));
    const overlap = left0 + widths[0] + HANDLE_LABEL_GAP - left1;
    if (overlap > 0) {
      left0 = Math.max(0, left0 - overlap / 2);
      left1 = Math.min(width - widths[1], left0 + widths[0] + HANDLE_LABEL_GAP);
      left0 = Math.max(0, Math.min(left0, left1 - widths[0] - HANDLE_LABEL_GAP));   // the upper may have hit the edge
    }
    texts.attr('x', (d, i) => i === 0 ? left0 : left1);
    writeSavedRange(key, fund, { lo: a > min ? a : 'edge', hi: b < max ? b : 'edge' });
    onChange();
  };
  brush.on('brush end', event => { if (event.sourceEvent || event.type === 'end') apply(event.selection); });

  const saved = readSavedRange(key, fund);
  brushG.call(brush.move, [x(typeof saved.lo === 'number' ? Math.max(min, saved.lo) : min), x(typeof saved.hi === 'number' ? Math.min(max, saved.hi) : max)]);

  state.pass = d => { const v = METRICS[key].value(d); return v !== null && v >= state.lo && v <= state.hi; };
  state.narrowed = () => state.lo > min || state.hi < max;   // the range is less than the whole
  state.reset = () => brushG.call(brush.move, fullRange());
  return state;
}

function setupMetricFilters(fund, allDays, latestId, onChange) {
  const filters = Object.keys(METRICS).map(key => setupMetricHistogram(key, fund, allDays, onChange));
  return { filter: days => days.filter(d => d.id === latestId || filters.every(f => f.pass(d))), active: () => filters.filter(f => f.narrowed()).length,
    reset: () => { for (const f of filters) f.reset(); } };
}

// Calendar filter (the user, 2026-11-25: "an option to filter out data, like
// specific months, or specific days (like november fridays for example) so two
// dropdowns"): a month of the year and a weekday, each a dropdown whose first
// choice, its own name, keeps them all. Both together keep, say, the Fridays of every
// November. It runs first, on the period's days, and unlike the histograms it
// can leave the latest day out: a Wednesday is no Friday. Each pick is saved.
// The desktop widget shows the chart alone, with no dropdowns: nothing is
// filtered there. The day stamps are the file's calendar dates at local
// midnight, so getMonth() and getDay() are New York's.
// The names are short ("Month", "Nov"; "Day", "Fri"): the two dropdowns share
// a row with the ticker and the switches, and wider ones pushed the period
// slider onto a row of its own, which the chart paid for in height.
const CALENDAR_PICKS = [
  { select: '#select-month', all: 'Month', storageKey: 'tqqq-intraday-month',
    names: d3.range(12).map(month => d3.timeFormat('%b')(new Date(2000, month, 1))), of: day => day.date.getMonth() },
  { select: '#select-weekday', all: 'Day', storageKey: 'tqqq-intraday-weekday',
    names: WEEKDAYS, of: day => day.date.getDay() - 1 },   // getDay(): 1 is Monday
];
// A pick as it is kept: '' for all, else the choice's place in its names.
function readSavedPick(pick) {
  if (EMBED) return '';
  try {
    const saved = localStorage.getItem(pick.storageKey);
    return saved !== null && pick.names[+saved] !== undefined && saved !== '' ? saved : '';
  } catch { return ''; }
}
function writeSavedPick(pick, value) {
  try { localStorage.setItem(pick.storageKey, value); } catch { /* storage unavailable */ }
}
function setupCalendarFilter(onChange) {
  const picked = CALENDAR_PICKS.map((pick) => {
    const state = { pick, value: readSavedPick(pick) };
    d3.select(pick.select).on('change', function () {
      state.value = this.value;
      writeSavedPick(pick, state.value);
      onChange();
    }).selectAll('option').data([{ value: '', text: pick.all }].concat(pick.names.map((text, k) => ({ value: String(k), text }))))
      .join('option').attr('value', d => d.value).text(d => d.text);
    d3.select(pick.select).property('value', state.value);
    return state;
  });
  const reset = () => {
    for (const state of picked) {
      state.value = '';
      writeSavedPick(state.pick, '');
      d3.select(state.pick.select).property('value', '');
    }
  };
  return { filter: days => days.filter(day => picked.every(state => state.value === '' || state.pick.of(day) === +state.value)), active: () => picked.filter(state => state.value !== '').length, reset };
}

// The filters' panel: shut until its button is pressed, and as it was left on
// the next visit. Shut, it is inert: out of the tab order and the pointer's reach.
const FILTERS_OPEN_STORAGE_KEY = 'tqqq-intraday-filters-open';
function setupFiltersPanel() {
  const button = d3.select('#filters-toggle'), panel = d3.select('#filters');
  const show = (open) => { button.attr('aria-expanded', String(open)); panel.property('inert', !open); };
  show(readSavedSwitch(FILTERS_OPEN_STORAGE_KEY, false));
  button.on('click', () => {
    const open = button.attr('aria-expanded') !== 'true';
    writeSavedSwitch(FILTERS_OPEN_STORAGE_KEY, open);
    show(open);
  });
}
// How many filters are on, beside the button's name; nothing while none is.
const showFilterCount = (count) => {
  d3.select('#filters-count').text(count || '');
  d3.select('#filters-reset').property('disabled', !count);
};

// Trend rules (the user, 2026-11-25: "I want to be able to filter based on
// the trend. So for example, all days where median/mean/rsi were (more than,
// or less than, or less value than) x days"). A rule keeps the days on which
// a reading of the trend was more, or less, than a value. A reading is taken
// at the close BEFORE the day, from that close and the closes before it, so
// it is what was known at the day's open:
//   mean, median   that close against the mean, or the median, of the last N
//                  closes (itself among them), in percent: +5 is 5% over it;
//   change         that close against the close N days before it, in percent:
//                  over 1 day, the day before's own move, so "less than -1"
//                  keeps the days after a fall of more than 1% (the user,
//                  2026-11-27: "in downtrend, where previous day was down 1%,
//                  how fridays changed on average between open and close");
//   rsi            Wilder's RSI over N days, 0 to 100.
// Every rule must hold. A day with too few days before it for a rule has no
// reading and is left out, the latest day like any other. The rules are kept
// (localStorage); the desktop widget shows the chart alone and applies none.
const rollingGap = of => (closes, n) => closes.map((close, k) => (k < n - 1 ? null : (close / of(closes.slice(k - n + 1, k + 1)) - 1) * 100));
const changeSeries = (closes, n) => closes.map((close, k) => (k < n ? null : (close / closes[k - n] - 1) * 100));
// Wilder's RSI at each close: the first n changes averaged, each later one smoothed in at 1/n.
function rsiSeries(closes, n) {
  let gain = 0, loss = 0;
  return closes.map((close, k) => {
    if (k === 0) return null;
    const change = close - closes[k - 1], up = Math.max(change, 0), down = Math.max(-change, 0);
    gain = k <= n ? gain + up / n : (gain * (n - 1) + up) / n;
    loss = k <= n ? loss + down / n : (loss * (n - 1) + down) / n;
    return k < n ? null : loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
  });
}
// fewest: the fewest days the reading can be over (a mean of one close is the close itself).
const TREND_RULE_MEASURES = {
  mean: { name: 'Price vs mean', unit: '%', days: 50, fewest: 2, value: 0, series: rollingGap(d3.mean) },
  median: { name: 'Price vs median', unit: '%', days: 50, fewest: 2, value: 0, series: rollingGap(d3.median) },
  change: { name: 'Price change', unit: '%', days: 1, fewest: 1, value: 0, series: changeSeries },
  rsi: { name: 'RSI', unit: '', days: 14, fewest: 2, value: 30, series: rsiSeries },
};
const TREND_RULE_SIDES = {
  more: { name: 'more than', holds: (reading, value) => reading > value },
  less: { name: 'less than', holds: (reading, value) => reading < value },
};
const TREND_RULE_MOST_DAYS = 400;        // the most days a rule reads over
const TREND_RULE_DEFAULT = { measure: 'mean', side: 'more' };
const TREND_RULES_STORAGE_KEY = 'tqqq-intraday-trend-rules';
const newTrendRule = (measure, side) => ({ measure, side, days: TREND_RULE_MEASURES[measure].days, value: TREND_RULE_MEASURES[measure].value });
const validRuleDays = (measure, days) => Number.isInteger(days) && days >= TREND_RULE_MEASURES[measure].fewest && days <= TREND_RULE_MOST_DAYS;
const validTrendRule = rule => !!rule && rule.measure in TREND_RULE_MEASURES && rule.side in TREND_RULE_SIDES
  && validRuleDays(rule.measure, rule.days) && Number.isFinite(rule.value);
function readSavedTrendRules() {
  if (EMBED) return [];
  try {
    const saved = JSON.parse(localStorage.getItem(TREND_RULES_STORAGE_KEY));
    return Array.isArray(saved) ? saved.filter(validTrendRule) : [];
  } catch { return []; }
}
function writeSavedTrendRules(rules) {
  try { localStorage.setItem(TREND_RULES_STORAGE_KEY, JSON.stringify(rules)); } catch { /* storage unavailable */ }
}
// The rules' line in the panel and the filter they make. Each rule is a
// sentence: what is read, of how many days, more or less than what, and a
// button that takes it out; "Add" puts in one more. A number typed that is no
// number, or a count of days out of range, goes back to what it was.
function setupTrendRules(allDays, onChange) {
  const state = { rules: readSavedTrendRules() };
  const place = new Map(allDays.map((day, k) => [day.id, k])), closes = allDays.map(day => day.close);
  const series = new Map();   // a rule's reading at every close, worked out once for its measure and days
  const readingsOf = (rule) => {
    const key = `${rule.measure}|${rule.days}`;
    if (!series.has(key)) series.set(key, TREND_RULE_MEASURES[rule.measure].series(closes, rule.days));
    return series.get(key);
  };
  const holds = (rule, day) => {
    const before = place.get(day.id) - 1, reading = before < 0 ? null : readingsOf(rule)[before];
    return reading !== null && TREND_RULE_SIDES[rule.side].holds(reading, rule.value);
  };
  const changed = () => { writeSavedTrendRules(state.rules); draw(false); onChange(); };
  const options = (select, names) => select.selectAll('option').data(Object.keys(names)).join('option').attr('value', key => key).text(key => names[key].name);
  // A number's field: it shows the rule's own, takes a valid number typed into it, and goes back on any other.
  // typing: the rules are drawn for a data refresh, which must not reset a field under the cursor.
  const numberField = (inputs, typing, read, isValid, write) => {
    inputs.filter(function () { return !typing || this !== document.activeElement; }).property('value', read);
    inputs.on('change', function (event, rule) {
      const typed = this.value.trim() === '' ? NaN : +this.value;
      if (!isValid(typed, rule)) { this.value = read(rule); return; }
      write(rule, typed);
      changed();
    });
  };
  function draw(typing) {
    const lines = d3.select('#trend-rule-list').selectAll('span.trend-rule').data(state.rules).join(enter => {
      const line = enter.append('span').attr('class', 'trend-rule');
      line.append('select').attr('class', 'rule-measure').attr('aria-label', 'What is read');
      line.append('span').text('of');
      line.append('input').attr('class', 'rule-days').attr('type', 'number').attr('max', TREND_RULE_MOST_DAYS).attr('step', 1).attr('aria-label', 'Days');
      line.append('span').attr('class', 'rule-days-word');
      line.append('select').attr('class', 'rule-side').attr('aria-label', 'More or less');
      line.append('input').attr('class', 'rule-value').attr('type', 'number').attr('step', 'any').attr('aria-label', 'Value');
      line.append('span').attr('class', 'rule-unit');
      line.append('button').attr('type', 'button').attr('class', 'rule-remove').attr('aria-label', 'Remove this rule').text('×');
      return line;
    });
    options(lines.select('.rule-measure'), TREND_RULE_MEASURES);
    options(lines.select('.rule-side'), TREND_RULE_SIDES);
    lines.select('.rule-measure').property('value', rule => rule.measure).on('change', function (event, rule) {
      Object.assign(rule, newTrendRule(this.value, rule.side));   // another reading: its own usual days and value
      changed();
    });
    lines.select('.rule-side').property('value', rule => rule.side).on('change', function (event, rule) { rule.side = this.value; changed(); });
    lines.select('.rule-days').attr('min', rule => TREND_RULE_MEASURES[rule.measure].fewest);
    numberField(lines.select('.rule-days'), typing, rule => rule.days, (days, rule) => validRuleDays(rule.measure, days), (rule, days) => { rule.days = days; });
    lines.select('.rule-days-word').text(rule => (rule.days === 1 ? 'day is' : 'days is'));
    numberField(lines.select('.rule-value'), typing, rule => rule.value, Number.isFinite, (rule, value) => { rule.value = value; });
    lines.select('.rule-unit').text(rule => TREND_RULE_MEASURES[rule.measure].unit);
    lines.select('.rule-remove').on('click', (event, rule) => { state.rules = state.rules.filter(other => other !== rule); changed(); });
  }
  d3.select('#trend-add').on('click', () => { state.rules = state.rules.concat(newTrendRule(TREND_RULE_DEFAULT.measure, TREND_RULE_DEFAULT.side)); changed(); });
  draw(true);
  const reset = () => { state.rules = []; writeSavedTrendRules(state.rules); draw(false); };
  return { filter: days => (state.rules.length ? days.filter(day => state.rules.every(rule => holds(rule, day))) : days), active: () => state.rules.length, reset };
}

// Similar-days control: just the toggle. With nothing saved it starts on
// while a session is open, when "days like today so far" is the question,
// and off outside market hours, when the reference would be a finished day.
function setupSimilarFilter(onChange) {
  const state = { on: readSavedSwitch(SIMILAR_STORAGE_KEY, marketMinuteNow() !== null) };
  d3.select('#toggle-similar').property('checked', state.on).on('change', function () {
    state.on = this.checked;
    writeSavedSwitch(SIMILAR_STORAGE_KEY, state.on);
    onChange();
  });
  state.reset = () => { state.on = false; writeSavedSwitch(SIMILAR_STORAGE_KEY, false); d3.select('#toggle-similar').property('checked', false); };
  return state;
}

// Same-trend control: the toggle, off until switched on. Its tooltip says
// what counts as the same trend and names the latest day's. A latest day
// with too little history before it has no state to match, so the toggle is
// switched off and greyed.
function setupTrendFilter(latest, onChange) {
  const marketState = latest.marketState;
  const state = { on: !!marketState && readSavedSwitch(TREND_STORAGE_KEY, false) };
  d3.select('#trend-switch').classed('unavailable', !marketState).attr('title', marketState
    ? `Days that opened like today: ${ticker} ${marketState.trend === 'up' ? 'above' : 'below'} its ${TREND_DAYS}-day average, ${marketState.volatility} volatility over the ${VOLATILITY_DAYS} days before.`
    : `Needs ${TREND_DAYS + 1} days of history.`);
  d3.select('#toggle-trend').property('checked', state.on).property('disabled', !marketState).on('change', function () {
    state.on = this.checked;
    writeSavedSwitch(TREND_STORAGE_KEY, state.on);
    onChange();
  });
  state.reset = () => { state.on = false; writeSavedSwitch(TREND_STORAGE_KEY, false); d3.select('#toggle-trend').property('checked', false); };
  return state;
}

// What the weekday bars show: a button for each of WEEKDAY_STATS, the one
// in use pressed (the block's name, which says it with the measure, is set
// at each refresh: showBarNames). The choice is saved; with
// nothing saved, or storage blocked, it is the one the buttons show: the
// default at first, and their own state on the page's later data refreshes.
function readSavedWeekdayStat(fallback) {
  let saved = null;
  try { saved = localStorage.getItem(WEEKDAY_STAT_STORAGE_KEY); } catch { return fallback; }
  if (saved !== null && saved in WEEKDAY_STATS) return saved;
  return readSavedSwitch(WEEKDAY_MEDIAN_STORAGE_KEY, false) ? 'median' : fallback;
}
function writeSavedWeekdayStat(key) {
  if (EMBED) return;
  try { localStorage.setItem(WEEKDAY_STAT_STORAGE_KEY, key); } catch { /* storage unavailable */ }
}
function setupWeekdayStat(onChange) {
  const buttons = d3.select('#weekday-stat').selectAll('button').data(Object.keys(WEEKDAY_STATS)).join('button')
    .attr('type', 'button').attr('data-stat', key => key).text(key => WEEKDAY_STATS[key].button);
  const pressed = buttons.filter('[aria-pressed="true"]');
  const state = { stat: readSavedWeekdayStat(pressed.empty() ? WEEKDAY_DEFAULT_STAT : pressed.datum()) };
  const show = () => buttons.attr('aria-pressed', key => String(key === state.stat));
  buttons.on('click', (event, key) => {
    state.stat = key;
    writeSavedWeekdayStat(key);
    show();
    onChange();
  });
  show();
  return state;
}

// The measure the bars under the chart show (DAY_MEASURES), a dropdown in the
// toolbar. The pick is saved; with nothing saved, or storage blocked, it is
// the one the dropdown shows: prev close vs close at first, and its own on the
// page's later data refreshes. The desktop widget has no bars: nothing is read there.
function readSavedMeasure(fallback) {
  if (EMBED) return fallback;
  let saved = null;
  try { saved = localStorage.getItem(DAY_MEASURE_STORAGE_KEY); } catch { return fallback; }
  return DAY_MEASURES.find(measure => measure.id === saved) || fallback;
}
function setupDayMeasure(onChange) {
  const select = d3.select('#select-measure');
  const shown = DAY_MEASURES.find(measure => measure.id === select.property('value'));
  const state = { measure: readSavedMeasure(shown || DAY_MEASURE_DEFAULT) };
  select.on('change', function () {
    state.measure = DAY_MEASURES.find(measure => measure.id === this.value);
    if (!EMBED) try { localStorage.setItem(DAY_MEASURE_STORAGE_KEY, this.value); } catch { /* storage unavailable */ }
    onChange();
  }).selectAll('option').data(DAY_MEASURES).join('option').attr('value', measure => measure.id).text(measure => measure.label);
  select.property('value', state.measure.id);
  return state;
}
// The two blocks' names say what they show: "Average open vs high by weekday", "Open vs high by day".
function showBarNames(stat, measure) {
  d3.select('#weekday-name').text(stat.name(measure));
  d3.select('#daily-name').text(`${measure.label} by day`);
}

// One chart for the page's life; every load, first or refresh, rebuilds the
// controls and data around it. The controls read their saved state on each
// setup, so a refresh keeps the period, the brushes and the toggle as they
// were, with edge-pinned thumbs following the new data.
const chart = new IntradayOverlayChart().container('#chart')
  .minuteOffset(localOffsetFromMarket()).zoneLabel(shortZoneName(LOCAL_TZ));
// The weekday bars under it, over the days it draws. The desktop widget
// shows the chart alone, so embedded the bars under it are neither shown nor drawn.
const weekdayChart = new WeekdayBarChart().container('#weekday-chart');
// And beside them the daily bars, over the period's days.
const dailyChart = new DailyChangeChart().container('#daily-chart');
let period = null;      // the period slider of the data on screen (setupPeriodSlider)
let dailyZoom = null;   // the daily bars' own window inside its period (setupDailyZoom), which their gestures move
// Embedded, the chart is as tall as its frame (the width already follows the
// container through setDynamicContainer), with no row under the axis for the
// hidden scale button, a label gutter on the right just wide enough for the
// mean / median names at the embed's 9.5px type, and its plot top level with
// the signal chart's beside it in the widget.
if (EMBED) {
  chart.marginTop(12).marginBottom(20).labelGutter(null).marginRight(44).marginLeft(44);
  chart.svgHeight(window.innerHeight);
  window.addEventListener('resize', () => { chart.svgHeight(window.innerHeight); if (chart.data()) chart.render(); });
}

// On its own the page fits the window with no vertical scroll where it can
// (the user, 2026-11-22: "make sure it fits 14 inch macbook vertically"), and
// the chart shares the window's height with the bars under it (the user,
// 2026-11-23, of the daily bars: "make this chart bigger in height, there is
// space"). The chart stands between its least and its full height, the bars
// between theirs, both the same part of the way up, in the height the rest
// of the page leaves: the link, the toolbar, the bars' headings and the
// paddings. In a window too short for the least heights the page scrolls the
// rest. The bars grow only side by side: one over the other, in a narrow
// window, they keep their least height and the chart takes what is left, as
// it does when they are hidden. Side by side the daily bars also rise by
// DAILY_LIFT into the row under the chart's time axis, which holds only the
// scale button at its left end (the user, same day, an arrow at that row:
// "there is still a space, I want this space utilized"); their foot stays
// level with the weekday bars'. On a phone or a tablet (a touch-first screen)
// the chart keeps its full height, the bars their least, and the page
// scrolls, as it always did: a short chart that narrow crowds its notes. The
// window's size is the layout viewport's, which a pinch zoom leaves alone.
const CHART_FULL_HEIGHT = chart.svgHeight();
const CHART_MIN_HEIGHT = 360;
const TOUCH_FIRST = window.matchMedia('(pointer: coarse)').matches;
const UNDER_CHARTS = [weekdayChart, dailyChart];
function fitChartsToWindow() {
  const chartBox = document.getElementById('chart');
  const heightOf = element => element.getBoundingClientRect().height;
  const [weekdayBox, dailyBox] = UNDER_CHARTS.map(bars => document.querySelector(bars.container()));
  const weekdayBlock = weekdayBox.parentNode.getBoundingClientRect(), dailyBlock = dailyBox.parentNode.getBoundingClientRect();
  // The rows the bars take: none while hidden (no history yet), one side by side, two one over the other.
  // Told by the blocks' sides: the daily bars' rise moves their top, never their left.
  const rows = dailyBlock.height === 0 ? 0 : dailyBlock.left >= weekdayBlock.right ? 1 : 2;
  const grow = rows === 1 && !TOUCH_FIRST;
  const lift = rows === 1 ? DAILY_LIFT : 0;
  const rest = heightOf(document.querySelector('.wrap')) - heightOf(chartBox) - rows * heightOf(weekdayBox);
  const spare = document.documentElement.clientHeight - rest - CHART_MIN_HEIGHT - rows * UNDER_CHART_HEIGHT;
  const chartRange = CHART_FULL_HEIGHT - CHART_MIN_HEIGHT, underRange = grow ? UNDER_CHART_FULL_HEIGHT - UNDER_CHART_HEIGHT : 0;
  const part = Math.max(0, Math.min(1, spare / (chartRange + underRange)));   // of the way from the least heights to the full ones
  const chartHeight = TOUCH_FIRST ? CHART_FULL_HEIGHT : Math.floor(CHART_MIN_HEIGHT + part * chartRange);
  const underHeight = Math.floor(UNDER_CHART_HEIGHT + part * underRange);
  // The heights are held on the boxes too, before the first draw, so the page does not jump when the charts arrive.
  chartBox.style.minHeight = `${chartHeight}px`;
  chart.svgHeight(chartHeight);
  d3.select(dailyBox.parentNode).style('--daily-lift', `${lift}px`);
  [[weekdayBox, weekdayChart, underHeight], [dailyBox, dailyChart, underHeight + lift]].map(([box, bars, height]) => {
    d3.select(box).style('min-height', `${height}px`);
    return bars.svgHeight(height);
  });
}
if (!EMBED) {
  fitChartsToWindow();
  // Refit when the window changes, and when the toolbar or the filters' panel
  // does: the panel opens and shuts, and its controls wrap onto another row in
  // a narrow window or once the web fonts land.
  const refit = () => {
    fitChartsToWindow();
    [chart, ...UNDER_CHARTS].filter(drawn => drawn.data()).map(drawn => drawn.render());
  };
  window.addEventListener('resize', refit);
  // The toolbar's row and the filters' panel: either changing height changes what is left for the charts.
  const rows = new ResizeObserver(refit);
  ['.toolbar', '.filters'].map(selector => rows.observe(document.querySelector(selector)));
}

// Log / linear toggle for the y-axis. Log (symmetric, linear inside ±0.1%)
// is the default; the choice is remembered.
const scaleToggle = d3.select('#scale-toggle');
const applyScale = log => {
  scaleToggle.attr('aria-pressed', log ? 'true' : 'false');
  chart.yScaleType(log ? 'symlog' : 'linear');
};
applyScale(readSavedSwitch(LOG_SCALE_STORAGE_KEY, true));
scaleToggle.on('click', () => {
  const log = scaleToggle.attr('aria-pressed') !== 'true';
  writeSavedSwitch(LOG_SCALE_STORAGE_KEY, log);
  applyScale(log);
  chart.render();
});
const DATA_REFRESH_MS = QUOTES_PROXY ? 60 * 1000 : 10 * 60 * 1000;   // the proxy's answer is a minute old at most; the pipeline's file, an hour

// Today's 1-minute rows replace that day's 5-minute rows when the file holds
// the current session, or a day the history has not reached yet. A stale
// file (last session, on a weekend) is ignored so history stays uniform at
// 5 minutes. Days are compared on the Date column's own "M/D/YYYY" prefix
// rather than parsing every one of ~90k history rows.
const dayOf = r => r.Date.split(' ')[0];
function mergeTodayRows(history, today) {
  if (!today.length) return history;
  const todayDay = dayOf(today[0]);
  const todayDate = parseStamp(today[0].Date);
  const lastHistoryDate = parseStamp(history[history.length - 1].Date);
  const isCurrentSession = fmtIsoDay(todayDate) === marketDateNow();
  if (!isCurrentSession && d3.timeDay.floor(todayDate) <= d3.timeDay.floor(lastHistoryDate)) return history;
  return history
    .filter(r => dayOf(r) !== todayDay)
    .concat(today.map(r => ({ ...r, barMinutes: TODAY_BAR_MINUTES })));
}

// Outside the regular session the proxy's quote for the ticker carries `extended`, the latest
// pre-market, after-hours or overnight print with its change against the close
// (cloudflare/quotes/README.md): the chart pulses it at its start (drawExtended).
// Nothing while the session runs, when the chart itself is live, or when the
// proxy is not configured.
// Inside the desktop widget (?embed=widget) the page around this one fetches the
// quotes and hands them over (its tqqq-widget-quotes message, js/widget-page.js),
// so this chart's print is the one its signal chart and its badge show, from
// the same moment (the user, 2026-11-06: "they should be the same"); this page
// then fetches none itself.
const EXTENDED_SESSION_NAMES = { pre: 'pre-market', post: 'after hours', overnight: 'overnight' };
let parentQuotes = null;
if (EMBED) window.addEventListener('message', e => {
  if (e.source !== window.parent || !e.data) return;
  // The page around this one holds the keyboard (a press on a chart moves no
  // focus): its Escape, relayed, clears a kept range here as it does on its own chart.
  if (e.data.type === 'tqqq-widget-escape') { window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' })); return; }
  if (e.data.type !== 'tqqq-widget-quotes') return;
  parentQuotes = e.data.quotes;
  chart.extended(extendedPrint(parentQuotes));
  if (chart.getState().data) chart.render();   // drawn already: redraw with the print; else loadData's first render takes it
});
function loadLiveQuote() {
  if (EMBED) return Promise.resolve(parentQuotes);
  if (!QUOTES_PROXY) return Promise.resolve(null);
  return fetch(`${QUOTES_PROXY}/quotes?symbols=${ticker}`, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('The quotes proxy answered HTTP ' + r.status); return r.json(); })
    .catch(err => { console.warn('Live quote unavailable:', err); return null; });
}
function extendedPrint(quotes) {
  const q = quotes && quotes.quotes && quotes.quotes[ticker], x = q && q.extended;
  if (!x || !(x.price > 0) || typeof x.changePct !== 'number' || !x.time || !(x.session in EXTENDED_SESSION_NAMES)) return null;
  return { session: x.session, price: x.price, time: x.time, changePct: x.changePct };
}

// The ticker's name where the page shows it: the tab's title, the dropdown,
// and the address, so a copied link opens on the same fund.
const PAGE_TITLE = document.title.replace(DEFAULT_TICKER, '').trim();   // "intraday — every day's % path from the open"
function showTicker() {
  document.title = `${ticker} ${PAGE_TITLE}`;
  d3.select('#select-ticker').property('value', ticker);
  if (EMBED) return;
  const address = new URL(location.href);
  if (ticker === DEFAULT_TICKER) address.searchParams.delete('ticker'); else address.searchParams.set('ticker', ticker);
  window.history.replaceState(null, '', address);
}
// The dropdown: every fund of the site. A pick is named in the address and
// loads that fund's days; the axis extent and a kept range belong to the fund
// left, so both are dropped.
function setupTickerPick() {
  d3.select('#select-ticker').on('change', function () {
    ticker = this.value;
    showTicker();
    chart.yLimit(null).rangePinned(null);
    loadData();
  }).selectAll('option').data(TICKERS).join('option').attr('value', d => d).text(d => d);
  showTicker();
}
// A fund whose history file the data does not hold, or could not be read:
// said in the chart's place, with the charts and filters of the fund before
// it out of sight (null: the history is in, show the page).
function showHistoryNote(text) {
  d3.select('.panel').classed('no-history', text !== null);
  d3.select('#no-data').property('hidden', text === null).text(text || '');
  if (text !== null) d3.select('#coverage').text('');
  if (!EMBED) fitChartsToWindow();   // the bars' room goes and comes back with the note
}

// The filters left no day (a month the period does not reach): said in the
// chart's place, the chart itself out of sight until a day is back. The
// toolbar and the bars under the chart stay: the way back is in them.
function showNoDaysNote(none) {
  d3.select('.panel').classed('no-days', none);
  d3.select('#no-data').property('hidden', !none).text(none ? 'No day matches the filters.' : '');
}

// What the page last drew from: the fund, its history file's text with the
// rows read from it, and a stamp of everything else a load reads. The page
// asks for the data every minute. A history file that came back unchanged is
// not parsed again, and a load with nothing new at all (the same file, no new
// bar today, the same print, the same day and session state) leaves the page
// as it stands: on ten years a rebuild is a visible hitch.
let loaded = null;
function loadData() {
  const asked = ticker;   // a pick made while these load wins over them
  return Promise.all([
    d3.text(historyUrl(asked), { cache: 'no-cache' }),
    // 404 until the day's first pipeline run has written it.
    d3.text(todayUrl(asked), { cache: 'no-cache' }).catch(() => ''),
    loadLiveQuote(),
  ]).then(([historyText, todayText, quotes]) => {
    if (asked !== ticker) return;
    const print = extendedPrint(quotes);
    const sameHistory = !!loaded && loaded.fund === asked && loaded.historyText === historyText;
    // The day and whether a session is open decide how today's rows merge and where "Similar days only" starts.
    const stamp = JSON.stringify([todayText, print, marketDateNow(), marketMinuteNow() !== null]);
    if (sameHistory && loaded.stamp === stamp && drawnTicker === asked) return;
    const history = sameHistory ? loaded.history : d3.tsvParse(historyText);
    const today = d3.tsvParse(todayText);
    loaded = { fund: asked, historyText, history, stamp };
    drawnTicker = asked;
    showHistoryNote(null);
    chart.extended(print);
    const allDays = withMarketState(buildDays(mergeTodayRows(history, today)));
    const allPct = allDays.flatMap(d => d.points.map(p => p.pct));
    // The y extent only ever grows, so a refresh never rescales the plot.
    chart.yLimit(Math.max(chart.yLimit() || 0, Math.ceil(Math.max(-d3.min(allPct), d3.max(allPct)))));
    const latestId = allDays[allDays.length - 1].id;
    let periodDays = allDays;
    let shownDays = [];           // the days the chart drew last
    const drawDaily = () => {
      const { bars, view } = buildDailyBars(allDays, daily.view(), shownDays, printMeasured(measure.measure) ? print : null, measure.measure);
      dailyChart.data(bars).view(view).render();
    };

    const refresh = () => {
      // The button's number: every filter that is on, the period among them when it is less than the whole file.
      showFilterCount(calendar.active() + rules.active() + metric.active() + (trend.on ? 1 : 0) + (similar.on ? 1 : 0) + (periodDays.length < allDays.length ? 1 : 0));
      const inRange = metric.filter(rules.filter(calendar.filter(periodDays)));
      // The state to match is the latest day's, whatever the period and the histograms keep.
      const filtered = trend.on ? sameTrendDays(inRange, allDays[allDays.length - 1]) : inRange;
      let days = filtered, cutoff = null, reference = null;
      if (similar.on && filtered.length) {   // no day left (a month the period lacks): none to compare with
        reference = filtered[filtered.length - 1];
        ({ days, cutoff } = similarDays(filtered, reference));
      }
      renderCoverage(days);
      // The chart needs a day to draw: with none it steps aside for a note, and the filters stay in reach.
      showNoDaysNote(days.length === 0);
      if (days.length) {
        chart.data(days).aggregates(buildAggregates(days))
          .referenceId(reference ? reference.id : null).matchCutoff(cutoff)
          .todayId(latestId)
          .opacityCount(filtered.filter(d => d.id !== latestId).length)
          .render();
      }
      if (!EMBED) {
        const stat = WEEKDAY_STATS[weekday.stat];
        showBarNames(stat, measure.measure);
        weekdayChart.leastExtent(stat.leastExtent).data(buildWeekdayBars(days, stat, measure.measure)).render();
        shownDays = days;
        drawDaily();
      }
    };
    let ready = false;                                 // one render once every control is wired
    const guarded = () => { if (ready) refresh(); };
    const calendar = setupCalendarFilter(guarded);
    const rules = setupTrendRules(allDays, guarded);
    const metric = setupMetricFilters(asked, allDays, latestId, guarded);
    const similar = setupSimilarFilter(guarded);
    const trend = setupTrendFilter(allDays[allDays.length - 1], guarded);
    const weekday = setupWeekdayStat(guarded);
    const measure = setupDayMeasure(guarded);
    // A gesture on the data just replaced must not draw over the new; its zoomed window carries over.
    if (period) period.stop();
    const kept = dailyZoom ? dailyZoom.carried() : null;
    if (dailyZoom) dailyZoom.stop();
    const daily = dailyZoom = setupDailyZoom(allDays, () => { if (!EMBED) drawDaily(); }, kept);
    period = setupPeriodSlider(allDays, (days, window) => { periodDays = days; daily.follow(window); guarded(); });
    dailyChart.domain(dailyDomain(asked)).onZoom(daily.zoom).onPanStart(daily.grip).onPanEnd(daily.settle);   // its gestures move its own window
    // Reset filters (the user, 2026-11-27: "make sure intraday has one reset filters option"): every filter that
    // the Filters button counts goes back to keeping all days, held from redrawing until the last, then one draw.
    d3.select('#filters-reset').on('click', () => {
      ready = false;
      for (const filter of [calendar, rules, metric, similar, trend, period]) filter.reset();
      ready = true;
      refresh();
    });
    ready = true;
    refresh();
  }, error => {
    if (asked !== ticker) return;
    // A refresh of the fund on screen that failed (a dropped connection) leaves its chart up; the next one asks again.
    if (drawnTicker === asked) { console.warn(`${asked}'s 5-minute history did not refresh:`, error); return; }
    // A fund the data refresh has not written a file for yet answers 404; the page's timer asks again each refresh.
    showHistoryNote(/^404\b/.test(error.message)
      ? `No 5-minute history for ${asked} in the data yet. It arrives with the next data refresh.`
      : `${asked}'s 5-minute history did not load: ${error.message}`);
  });
}

setupTickerPick();
setupFiltersPanel();
loadData().then(() => {
  setInterval(() => { if (chart.data()) chart.drawNow(); }, NOW_REFRESH_MS);   // nothing to mark until a first load has drawn the chart
  setInterval(loadData, DATA_REFRESH_MS);            // the pipeline appends bars through the day
});
</script>
</body>
</html>
