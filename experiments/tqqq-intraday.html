<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TQQQ intraday — every day's % path from the open</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
<style>
  /* Same Orion light theme as the main page (see styles.css): Open Sans for
     UI text, JetBrains Mono for figures, purple accent, night-blue type. */
  @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --bg:#fafafd; --panel:#ffffff; --border:#dbdff1; --border2:#c5c1ec;
    --text:#383874; --muted:#8484a0; --faint:#9292c1;
    --accent:#8676ff; --orange:#e8890b; --violet:#c64eff;
    --mean:#0a9fbe;   /* teal: clearly apart from today's purple and the orange median */
    --hover:#c2185b;  /* Orion pink, darkened for text: the hovered day, again apart from today */
    --green:#067d21; --red:#c81e1f;
    --shadow:0 3px 2px rgba(108,73,172,.02), 0 7px 5px rgba(108,73,172,.03), 0 13px 10px rgba(108,73,172,.04), 0 22px 18px rgba(108,73,172,.04), 0 42px 33px rgba(108,73,172,.05);
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:16px}
  .back-link{display:inline-block;margin:0 0 10px;font-size:12.5px;color:var(--muted);text-decoration:none}
  .back-link:hover{color:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 16px 8px}
  /* One row: the ticker and the button that opens the filters. */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin:0 0 4px}
  /* The filters, under one button (the user, 2026-11-25: "all of these
     existing filter under one button, when clicked it will expand filter
     panel"). The button carries the number of filters that are on, so a shut
     panel still says the days are a part of the whole. */
  .filters-toggle{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--sans);color:var(--text);background:var(--panel);border:1px solid var(--border2);border-radius:6px;padding:3px 10px;cursor:pointer}
  .filters-toggle:hover,.filters-toggle[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
  .filters-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .filters-count{min-width:16px;padding:0 5px;border-radius:8px;font:600 10.5px/16px var(--mono);text-align:center;color:var(--panel);background:var(--accent)}
  .filters-count:empty{display:none}
  .filters{display:flex;flex-direction:column;gap:10px;margin:6px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
  /* Shut, the panel takes no room but is still laid out (not display:none),
     so the histograms inside it measure their real width when they draw. */
  .filters[inert]{height:0;margin:0;padding-top:0;padding-bottom:0;border-width:0;overflow:hidden;visibility:hidden}
  .filters-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
  /* A rule on the trend reads as a line: what is read, over how many days, more or less than what. */
  .trend-rule-list{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;min-width:0}
  .trend-rule{display:inline-flex;flex-wrap:wrap;align-items:center;gap:5px;max-width:100%;font-size:12.5px;color:var(--muted)}   /* it wraps inside a phone's panel */
  .trend-rule select,.trend-rule input{font:600 12.5px var(--mono);color:var(--text);background:var(--panel);border:1px solid var(--border2);border-radius:6px;padding:3px 6px}
  .trend-rule select{field-sizing:content}   /* as wide as its choice, where the browser can */
  .trend-rule input{width:6.5ch;text-align:right}
  .trend-rule select:focus-visible,.trend-rule input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .trend-add,.trend-rule button,.filters-reset{font:600 12.5px var(--sans);color:var(--muted);background:var(--panel);border:1px solid var(--border2);border-radius:6px;padding:3px 9px;cursor:pointer}
  .trend-add:hover,.trend-rule button:hover,.filters-reset:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
  .filters-reset{margin-left:auto}   /* the row's right end */
  .filters-reset:disabled{opacity:.45;cursor:default}
  /* Metric filters: one block per day statistic, each a labelled brushable
     histogram. Fixed sizes so the row never moves. */
  /* The two histograms share the room between the toggle and the period
     block equally; each is measured once, after layout, so bars and brush
     match the width it got. */
  .metric{display:flex;flex-direction:column;gap:3px;flex:1 1 0;min-width:110px;max-width:420px;padding-bottom:12px;font-family:var(--mono);font-size:11.5px}
  .metric-head{display:flex;align-items:center;justify-content:space-between;gap:8px;height:18px;white-space:nowrap}
  .metric-name{font-family:var(--sans);font-size:12.5px;color:var(--muted)}
  .metric-range{color:var(--faint)}
  .metric-hist{display:block;width:100%;overflow:visible;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:4px}
  .metric-hist .bar{fill:var(--border2)}
  .metric-hist .bar.in{fill:var(--accent)}
  .metric-hist .zero{stroke:var(--faint);stroke-width:1}
  .metric-hist .selection{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:1}
  .metric-hist .handle{fill:var(--panel);stroke:var(--accent);stroke-width:1.5}
  .metric-hist .overlay{cursor:crosshair}
  .metric-hist .handle-label{font-family:var(--mono);font-size:10px;font-weight:600;fill:var(--accent);dominant-baseline:hanging}
  /* The period: its slider, and over it what every filter leaves (how many
     days, from when to when). The block's own width starts from the longest
     such line in mono characters and never from the line itself, so the
     slider does not resize as the dates and the day count change. */
  .period{display:flex;flex-direction:column;align-items:stretch;gap:3px;flex:1 1 42ch;min-width:0;max-width:520px;padding-bottom:12px;font-family:var(--mono);font-size:11.5px}
  /* Where the name and the line do not fit side by side, the line goes under the name. */
  .period .metric-head{flex-wrap:wrap;height:auto;min-height:18px;white-space:normal}
  .coverage{margin-left:auto;color:var(--faint);text-align:right}
  .coverage b{color:var(--muted);font-weight:500}
  /* Two native sliders stacked on one track; only the thumbs take pointer events. */
  .range{position:relative;width:100%;height:16px}
  .range-track{position:absolute;left:0;right:0;top:6px;height:4px;border-radius:2px;background:var(--border2)}
  /* The stretch between the thumbs can be dragged to move the whole period. Its
     hit area is the slider's full height, under the thumbs, which stay on top. */
  .range-fill{position:absolute;top:6px;height:4px;border-radius:2px;background:var(--accent);cursor:grab;touch-action:pan-y}
  .range-fill::before{content:"";position:absolute;left:0;right:0;top:-6px;height:16px}
  .range-fill.dragging{cursor:grabbing}
  .range input{position:absolute;left:0;top:0;width:100%;height:16px;margin:0;appearance:none;-webkit-appearance:none;background:none;pointer-events:none}
  .range input::-webkit-slider-runnable-track{background:none;height:16px}
  .range input::-moz-range-track{background:none;height:16px}
  .range input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:14px;height:14px;margin-top:1px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);cursor:grab}
  .range input::-moz-range-thumb{pointer-events:auto;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);cursor:grab}
  .range input:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
  .switch{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .track{position:relative;width:32px;height:18px;border-radius:9px;background:var(--border2);transition:background .15s;flex:none}
  .switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:transform .15s}
  .switch input:checked+.track{background:var(--accent)}
  .switch input:checked+.track::after{transform:translateX(14px)}
  .switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
  .switch.unavailable{opacity:.5;cursor:default}
  .switches{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
  /* The ticker choice, first in the toolbar. */
  .ticker-pick select{font:600 12.5px var(--mono);color:var(--text);background:var(--panel);border:1px solid var(--border2);border-radius:6px;padding:3px 6px;cursor:pointer}
  .ticker-pick select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* A ticker whose history is not in the data: the note in the chart's place,
     the chart, the bars and the filters of the ticker before it out of sight. */
  .no-data{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 24px;text-align:center;font-size:13px;color:var(--muted)}
  .no-data[hidden]{display:none}
  .panel.no-history #chart svg,.panel.no-history .scale-toggle,.panel.no-history .weekday,.panel.no-history .daily{display:none}
  .panel.no-days #chart svg,.panel.no-days .scale-toggle{display:none}
  .panel.no-history .filters-toggle,.panel.no-history .filters{visibility:hidden}
  /* Out of reach too: a brush's own rects take the pointer whatever their visibility. */
  .panel.no-history .filters *{pointer-events:none}
  /* Embedded, the chart's box has no height of its own once the chart is hidden. */
  .embed .no-data{position:static;height:100vh}
  .match-window{fill:var(--violet);fill-opacity:.05;pointer-events:none}
  #chart{position:relative}   /* its height is set to fit the window (fitChartsToWindow) */
  /* Under the chart, side by side: the weekday bars, a small block of five
     bars, one per weekday, over the same days the chart draws; and the daily
     bars, one a day of the period, in the room that is left. With less room
     than both want the weekday bars give way first, down to their least
     width; in a window narrower still the daily bars go under them. Both may
     shrink under the width of the svg they hold, which is then redrawn to fit. */
  .under-chart{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0 28px}
  .weekday,.daily{display:flex;flex-direction:column;gap:2px;min-width:0;margin:8px 0 6px;font-family:var(--mono);font-size:11.5px}
  .weekday{flex:1000 1 300px;max-width:460px}   /* takes the spare room first, up to its full width */
  .daily{flex:1 1 320px;margin-top:calc(8px - var(--daily-lift,0px))}   /* --daily-lift: set by fitChartsToWindow beside the weekday bars */
  .weekday-head,.daily-head{display:flex;align-items:center;justify-content:space-between;gap:12px;height:20px}
  /* A choice of one among a few, in the look of the chart's log pill. */
  .segmented{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .segmented button{padding:2px 8px;font:600 10px var(--sans);text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:rgba(219,223,241,.45);border:0;border-left:1px solid var(--border);cursor:pointer;user-select:none}
  .segmented button:first-child{border-left:0}
  .segmented button:hover{color:var(--text)}
  .segmented button[aria-pressed="true"]{color:var(--accent);background:var(--panel)}
  .segmented button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  #weekday-chart svg,#daily-chart svg{display:block}
  .weekday-zero{stroke:var(--faint);stroke-width:1}
  .weekday-bar{fill:var(--faint);fill-opacity:.8}
  .weekday-bar.up{fill:var(--green)} .weekday-bar.down{fill:var(--red)}
  .weekday-value{font-family:var(--mono);font-size:10.5px;font-weight:600;text-anchor:middle;fill:var(--muted)}
  .weekday-value.up{fill:var(--green)} .weekday-value.down{fill:var(--red)}
  .weekday-day{font-family:var(--mono);font-size:11px;text-anchor:middle;fill:var(--muted)}
  .weekday-count{font-family:var(--mono);font-size:10px;text-anchor:middle;fill:var(--faint)}
  .daily-week{fill:var(--text);fill-opacity:.07}   /* every other week's band, behind the bars */
  .daily-zero{stroke:var(--faint);stroke-width:1}
  .daily-grid{stroke:var(--border);stroke-dasharray:2 3}
  .daily-pct,.daily-date{font-family:var(--mono);font-size:10px;fill:var(--muted)}
  .daily-pct{text-anchor:end;dominant-baseline:middle}
  .daily-price{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-opacity:.6;stroke-linejoin:round}   /* the fund's price, behind the bars */
  .daily-price-kept{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}   /* in bold over it: the days the filters keep */
  .daily-price-tick{font-family:var(--mono);font-size:10px;fill:var(--accent);dominant-baseline:middle}   /* its scale, at the plot's right, in the line's colour */
  .daily-bar{fill:var(--faint);fill-opacity:.8}
  .daily-bar.up{fill:var(--green)} .daily-bar.down{fill:var(--red)}
  /* Not a close yet (today so far, or a pre-market or after-hours print): hollow. */
  .daily-bar.unclosed{fill-opacity:.25;stroke:var(--faint);stroke-width:1}
  .daily-bar.up.unclosed{stroke:var(--green)} .daily-bar.down.unclosed{stroke:var(--red)}
  .daily-bar.out{fill-opacity:.16}   /* a day of the period the other filters leave out of the chart */
  .daily-hover{pointer-events:none}
  .daily-hover-band{fill:var(--accent);fill-opacity:.16}
  .daily-hover-label{font-family:var(--mono);font-size:10.5px;font-weight:600;text-anchor:middle;fill:var(--text)}
  .daily-hover-label .up{fill:var(--green)} .daily-hover-label .down{fill:var(--red)}
  .daily-overlay{fill:none;pointer-events:all}
  .daily-overlay.panning{cursor:grabbing}
  /* A finger moved sideways over the bars reads the days; up and down it still scrolls the page. On the svg:
     Chromium takes a finger's drag away from a shape inside one whatever touch-action the shape has. */
  #daily-chart svg{touch-action:pan-y;overflow:visible}   /* visible: a bar past the fixed scale runs out of the svg's box */
  /* ?embed=widget (the desktop widget page, widget.html): the chart alone,
     filling its frame. The filters and the period slider stay wired but
     hidden, so the chart shows every loaded day as it does by default. */
  .embed body{display:block;min-height:0;background:transparent;overflow:hidden}
  .embed .wrap{max-width:none;padding:0}
  .embed .back-link{display:none}
  /* Laid out off screen rather than display:none, so the hidden histograms
     still measure their real size when they draw. */
  .embed .toolbar,.embed .filters{position:absolute;left:-10000px;top:0;width:900px;visibility:hidden}
  .embed .scale-toggle,.embed .weekday,.embed .daily{display:none}
  /* The widget's other two charts label at 8-9px; the embedded chart matches. */
  .embed .axis text,.embed .now-label,.embed .annotation text{font-size:9px}
  .embed .line-label,.embed .today-label,.embed .extended-label{font-size:9.5px}
  .embed .panel{background:transparent;border:0;box-shadow:none;padding:0}
  .embed #chart{min-height:0}
  .embed *{font-weight:400 !important}   /* the desktop widget sets no bold anywhere */
  /* Same pill as the main chart's log toggle: dim when off, purple when on. */
  .scale-toggle{position:absolute;left:0;bottom:4px;padding:3px 7px;font:600 10px var(--sans);text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);background:rgba(219,223,241,.45);border:1px solid var(--border);border-radius:6px;cursor:pointer;user-select:none;opacity:.6;
    transition:color .15s,background .15s,border-color .15s,opacity .15s}
  .scale-toggle:hover{opacity:1}
  .scale-toggle[aria-pressed="true"]{opacity:1;color:var(--accent);background:var(--panel);border-color:var(--accent)}
  #chart svg{display:block}
  .axis text{fill:var(--muted);font-family:var(--mono);font-size:11px}
  .axis line,.axis path{stroke:var(--border2)}
  .grid line{stroke:var(--border);stroke-dasharray:2 3}
  .zero{stroke:var(--faint);stroke-width:1}
  .day-path{fill:none;stroke:var(--text);stroke-width:1;opacity:.05}
  .day-path.hover{opacity:1;stroke:var(--hover);stroke-width:1.5}
  .day-path.reference{opacity:1;stroke:var(--violet);stroke-width:2}
  /* Today's path: on top of every other layer, glowing, with a live pulse at
     its last bar while the session is open. Outside the session the same
     pulse marks the latest pre-market or after-hours print at the start. */
  .today,.extended{pointer-events:none}
  .today-glow{fill:none;stroke:var(--violet);stroke-width:9;stroke-linejoin:round;stroke-linecap:round;opacity:.14}
  .today-path{fill:none;stroke:var(--violet);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
  .pulse-dot{fill:var(--violet);stroke:var(--panel);stroke-width:2}
  .pulse-ring{fill:none;stroke:var(--violet);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:live-pulse 1.8s ease-out infinite}
  .pulse-ring.second{animation-delay:.9s}
  @keyframes live-pulse{0%{transform:scale(.5);opacity:.8}100%{transform:scale(3.2);opacity:0}}
  .today-label,.extended-label{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--violet)}
  .today-label .up,.extended-label .up{fill:var(--green)} .today-label .down,.extended-label .down{fill:var(--red)}
  .mean-path{fill:none;stroke:var(--mean);stroke-width:2.5}
  .median-path{fill:none;stroke:var(--orange);stroke-width:2;stroke-dasharray:6 4}
  .line-label{font-family:var(--mono);font-size:10.5px;font-weight:600;dominant-baseline:middle;pointer-events:none}
  .line-label.mean{fill:var(--mean)} .line-label.median{fill:var(--orange)}
  .hover-rule{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
  .now-line{stroke:var(--faint);stroke-width:1;stroke-dasharray:2 4;pointer-events:none}
  .now-label{font-family:var(--mono);font-size:10.5px;fill:var(--faint);pointer-events:none}
  .annotations{pointer-events:none}
  .annotation path{fill:none;stroke:var(--c);stroke-width:1;stroke-opacity:.6}
  .annotation .annotation-subject path{stroke-width:2;fill:var(--panel)}
  .annotation .annotation-note-bg{fill:var(--panel);fill-opacity:.9;stroke:var(--border2);stroke-width:1;rx:5}
  .annotation text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
  .annotation .annotation-note-title{font-weight:600;fill:var(--c)}
  .annotation.buy{--c:var(--green)} .annotation.sell{--c:var(--red)}
  /* Hover marks, drawn in the plot: a time chip on the axis, values where the
     crosshair crosses the mean, median and hovered day, and the hovered day's
     end. Text carries a panel-coloured halo so it reads over the fan. */
  .hover-marks{pointer-events:none}
  .hover-marks text{font-family:var(--mono);font-size:10.5px;font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
  .hover-time-bg{fill:var(--panel);stroke:var(--faint);stroke-width:1;rx:4}
  .hover-time{fill:var(--text);text-anchor:middle;dominant-baseline:middle;stroke:none}
  .hover-cross circle{stroke-width:2;fill:var(--panel)}
  .hover-cross.mean circle{stroke:var(--mean)} .hover-cross.mean text{fill:var(--mean)}
  .hover-cross.median circle{stroke:var(--orange)} .hover-cross.median text{fill:var(--orange)}
  .hover-cross.day circle{stroke:var(--hover)} .hover-cross.day text{fill:var(--hover)}
  .hover-cross text{dominant-baseline:middle}
  text.hover-end{fill:var(--hover)}
  text.hover-end .dim{font-weight:400;fill:var(--muted)}
  /* A dragged range, as on the site's charts: the span shaded between two
     dashed edges, a chord across it for today, the mean, the median and the
     hovered day, each with a badge naming its move over the span, and a time
     chip at each end. */
  .range-marks{pointer-events:none}
  .range-marks text{font-family:var(--mono);font-size:10.5px;font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
  .range-span{fill:rgba(134,118,255,.1)}
  .range-edge{stroke:rgba(56,56,116,.35);stroke-width:1;stroke-dasharray:3 3}
  .range-chord{fill:none;stroke-width:1.5;stroke-dasharray:4 3}
  .range-chord.today{stroke:var(--violet)} .range-chord.mean{stroke:var(--mean)} .range-chord.median{stroke:var(--orange)} .range-chord.day{stroke:var(--hover)}
  .range-end{stroke:var(--panel);stroke-width:1.5}
  .range-end.today{fill:var(--violet)} .range-end.mean{fill:var(--mean)} .range-end.median{fill:var(--orange)} .range-end.day{fill:var(--hover)}
  .range-badge rect{fill:var(--panel);stroke-width:1;rx:4}
  .range-badge text{text-anchor:middle;dominant-baseline:middle}
  .range-badge .name{fill:var(--muted)}
  .range-badge.up rect{stroke:var(--green)} .range-badge.up .move{fill:var(--green)}
  .range-badge.down rect{stroke:var(--red)} .range-badge.down .move{fill:var(--red)}
  .range-badge.flat rect{stroke:var(--faint)} .range-badge.flat .move{fill:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="../">← Back to the backtesting platform</a>
  <div class="panel">
    <div class="toolbar">
      <div class="switches">
        <label class="ticker-pick" title="The fund whose days the chart draws.">
          <select id="select-ticker" aria-label="Ticker"></select>
        </label>
        <label class="ticker-pick" title="What the bars under the chart show for each day.">
          <select id="select-measure" aria-label="What the bars show"></select>
        </label>
        <button type="button" class="filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filters" title="Which days the charts show: month, weekday, trend, open and close, period. The number is how many filters are on.">Filters<span class="filters-count" id="filters-count"></span></button>
      </div>
    </div>
    <div class="filters" id="filters" inert>
      <div class="filters-row">
        <label class="ticker-pick" title="Keep the days of one month, in every year. &quot;Month&quot; keeps them all.">

        </label>
        <label class="ticker-pick" title="Keep the days of one weekday. &quot;Day&quot; keeps them all.">

          <span class="track"></span>

      </div>
      <div class="filters-row trend-rules" title="Keep the days on which a reading of the trend was more, or less, than a value. Each reading is taken at the close before the day: that close against the mean or the median of the last N closes, or against the close N days before it, in percent, or the RSI over N days. Every rule must hold.">
        <span class="metric-name">Trend</span>

      </div>
      <div class="filters-row">
        <div class="metric" data-metric="open" title="Open vs the previous session's close. Drag across the bars to keep only days in that range. Double-click to clear.">
          <div class="metric-head"><span class="metric-name">Open</span><span class="metric-range"></span></div>
          <svg class="metric-hist" height="28"></svg>
        </div>
        <div class="metric" data-metric="close" title="Close vs the previous session's close. Drag across the bars to keep only days in that range. Double-click to clear.">
          <div class="metric-head"><span class="metric-name">Close</span><span class="metric-range"></span></div>
          <svg class="metric-hist" height="28"></svg>
        </div>
        <div class="period" title="The days between the two thumbs. Drag a thumb, or the stretch between them.">
          <div class="metric-head"><span class="metric-name">Period</span><div class="coverage" id="coverage"></div></div>
          <div class="range" id="period-range">
            <div class="range-track"></div>
            <div class="range-fill" id="range-fill"></div>
            <input type="range" id="range-start" min="0" value="0" step="1" aria-label="Period start">
            <input type="range" id="range-end" min="0" value="0" step="1" aria-label="Period end">
