<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TQQQ intraday — every day's % path from the open</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
<style>
  /* Same Orion light theme as the main page (see styles.css): Open Sans for
     UI text, JetBrains Mono for figures, purple accent, night-blue type. */
  @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --bg:#fafafd; --panel:#ffffff; --border:#dbdff1; --border2:#c5c1ec;
    --text:#383874; --muted:#8484a0; --faint:#9292c1;
    --accent:#8676ff; --orange:#e8890b; --violet:#c64eff;
    --mean:#0a9fbe;   /* teal: clearly apart from today's purple and the orange median */
    --hover:#c2185b;  /* Orion pink, darkened for text: the hovered day, again apart from today */
    --green:#067d21; --red:#c81e1f;
    --shadow:0 3px 2px rgba(108,73,172,.02), 0 7px 5px rgba(108,73,172,.03), 0 13px 10px rgba(108,73,172,.04), 0 22px 18px rgba(108,73,172,.04), 0 42px 33px rgba(108,73,172,.05);
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:16px}
  .back-link{display:inline-block;margin:0 0 10px;font-size:12.5px;color:var(--muted);text-decoration:none}
  .back-link:hover{color:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 16px 8px}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;margin:0 0 4px}
  /* Metric filters: one block per day statistic, each a labelled brushable
     histogram. Fixed sizes so the row never moves. */
  /* The two histograms share the room between the toggle and the period
     block equally; each is measured once, after layout, so bars and brush
     match the width it got. */
  .metric{display:flex;flex-direction:column;gap:3px;flex:1 1 0;min-width:160px;max-width:420px;padding-bottom:12px;font-family:var(--mono);font-size:11.5px}
  .metric-head{display:flex;align-items:center;justify-content:space-between;gap:8px;height:18px;white-space:nowrap}
  .metric-name{font-family:var(--sans);font-size:12.5px;color:var(--muted)}
  .metric-range{color:var(--faint)}
  .metric-hist{display:block;width:100%;overflow:visible;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:4px}
  .metric-hist .bar{fill:var(--border2)}
  .metric-hist .bar.in{fill:var(--accent)}
  .metric-hist .zero{stroke:var(--faint);stroke-width:1}
  .metric-hist .selection{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:1}
  .metric-hist .handle{fill:var(--panel);stroke:var(--accent);stroke-width:1.5}
  .metric-hist .overlay{cursor:crosshair}
  .metric-hist .handle-label{font-family:var(--mono);font-size:10px;font-weight:600;fill:var(--accent);dominant-baseline:hanging}
  /* Fixed width in mono characters, enough for the longest coverage line, so
     the block and its slider never resize as the dates and day count change. */
  .period{margin-left:auto;display:flex;flex-direction:column;align-items:stretch;gap:3px;flex:0 0 auto;width:42ch;font-family:var(--mono);font-size:11.5px}
  .coverage{color:var(--faint);white-space:nowrap;text-align:right}
  .coverage b{color:var(--muted);font-weight:500}
  /* Two native sliders stacked on one track; only the thumbs take pointer events. */
  .range{position:relative;width:100%;height:16px}
  .range-track{position:absolute;left:0;right:0;top:6px;height:4px;border-radius:2px;background:var(--border2)}
  .range-fill{position:absolute;top:6px;height:4px;border-radius:2px;background:var(--accent)}
  .range input{position:absolute;left:0;top:0;width:100%;height:16px;margin:0;appearance:none;-webkit-appearance:none;background:none;pointer-events:none}
  .range input::-webkit-slider-runnable-track{background:none;height:16px}
  .range input::-moz-range-track{background:none;height:16px}
  .range input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:14px;height:14px;margin-top:1px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);cursor:grab}
  .range input::-moz-range-thumb{pointer-events:auto;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);cursor:grab}
  .range input:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
  .switch{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .track{position:relative;width:32px;height:18px;border-radius:9px;background:var(--border2);transition:background .15s;flex:none}
  .switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:transform .15s}
  .switch input:checked+.track{background:var(--accent)}
  .switch input:checked+.track::after{transform:translateX(14px)}
  .switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
  .match-window{fill:var(--violet);fill-opacity:.05;pointer-events:none}
  #chart{position:relative;min-height:520px}
  #chart svg{display:block}
  .axis text{fill:var(--muted);font-family:var(--mono);font-size:11px}
  .axis line,.axis path{stroke:var(--border2)}
  .grid line{stroke:var(--border);stroke-dasharray:2 3}
  .zero{stroke:var(--faint);stroke-width:1}
  .day-path{fill:none;stroke:var(--text);stroke-width:1;opacity:.05}
  .day-path.hover{opacity:1;stroke:var(--hover);stroke-width:1.5}
  .day-path.reference{opacity:1;stroke:var(--violet);stroke-width:2}
  /* Today's path: on top of every other layer, glowing, with a live pulse at
     its last bar while the session is open. */
  .today{pointer-events:none}
  .today-glow{fill:none;stroke:var(--violet);stroke-width:9;stroke-linejoin:round;stroke-linecap:round;opacity:.14}
  .today-path{fill:none;stroke:var(--violet);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
  .today-dot{fill:var(--violet);stroke:var(--panel);stroke-width:2}
  .today-ring{fill:none;stroke:var(--violet);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:live-pulse 1.8s ease-out infinite}
  .today-ring.second{animation-delay:.9s}
  @keyframes live-pulse{0%{transform:scale(.5);opacity:.8}100%{transform:scale(3.2);opacity:0}}
  .today-label{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--violet)}
  .today-label .up{fill:var(--green)} .today-label .down{fill:var(--red)}
  .mean-path{fill:none;stroke:var(--mean);stroke-width:2.5}
  .median-path{fill:none;stroke:var(--orange);stroke-width:2;stroke-dasharray:6 4}
  .line-label{font-family:var(--mono);font-size:10.5px;font-weight:600;dominant-baseline:middle;pointer-events:none}
  .line-label.mean{fill:var(--mean)} .line-label.median{fill:var(--orange)}
  .hover-rule{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
  .now-line{stroke:var(--faint);stroke-width:1;stroke-dasharray:2 4;pointer-events:none}
  .now-label{font-family:var(--mono);font-size:10.5px;fill:var(--faint);pointer-events:none}
  .annotations{pointer-events:none}
  .annotation path{fill:none;stroke:var(--c);stroke-width:1;stroke-opacity:.6}
  .annotation .annotation-subject path{stroke-width:2;fill:var(--panel)}
  .annotation .annotation-note-bg{fill:var(--panel);fill-opacity:.9;stroke:var(--border2);stroke-width:1;rx:5}
  .annotation text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
  .annotation .annotation-note-title{font-weight:600;fill:var(--c)}
  .annotation.buy{--c:var(--green)} .annotation.sell{--c:var(--red)}
  /* Hover marks, drawn in the plot: a time chip on the axis, values where the
     crosshair crosses the mean, median and hovered day, and the hovered day's
     end. Text carries a panel-coloured halo so it reads over the fan. */
  .hover-marks{pointer-events:none}
  .hover-marks text{font-family:var(--mono);font-size:10.5px;font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
  .hover-time-bg{fill:var(--panel);stroke:var(--faint);stroke-width:1;rx:4}
  .hover-time{fill:var(--text);text-anchor:middle;dominant-baseline:middle;stroke:none}
  .hover-cross circle{stroke-width:2;fill:var(--panel)}
  .hover-cross.mean circle{stroke:var(--mean)} .hover-cross.mean text{fill:var(--mean)}
  .hover-cross.median circle{stroke:var(--orange)} .hover-cross.median text{fill:var(--orange)}
  .hover-cross.day circle{stroke:var(--hover)} .hover-cross.day text{fill:var(--hover)}
  .hover-cross text{dominant-baseline:middle}
  text.hover-end{fill:var(--hover)}
  text.hover-end .dim{font-weight:400;fill:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="../">← Back to the backtesting platform</a>
  <div class="panel">
    <div class="toolbar">
      <label class="switch" id="similar-switch">
        <input type="checkbox" id="toggle-similar">
        <span class="track"></span>
        <span class="switch-label">Similar days only</span>
      </label>
      <div class="metric" data-metric="open" title="Open vs the previous session's close. Drag across the bars to keep only days in that range. Double-click to clear.">
        <div class="metric-head"><span class="metric-name">Open</span><span class="metric-range"></span></div>
        <svg class="metric-hist" height="28"></svg>
      </div>
      <div class="metric" data-metric="close" title="Close vs the previous session's close. Drag across the bars to keep only days in that range. Double-click to clear.">
        <div class="metric-head"><span class="metric-name">Close</span><span class="metric-range"></span></div>
        <svg class="metric-hist" height="28"></svg>
      </div>
      <div class="period">
        <div class="coverage" id="coverage"></div>
        <div class="range" id="period-range">
          <div class="range-track"></div>
          <div class="range-fill" id="range-fill"></div>
          <input type="range" id="range-start" min="0" value="0" step="1" aria-label="Period start">
          <input type="range" id="range-end" min="0" value="0" step="1" aria-label="Period end">
        </div>
      </div>
    </div>
    <div id="chart"></div>
  </div>
</div>

<script>
const DATA_URL = '../data/intraday/tqqq-5m.tsv';
const SESSION_OPEN_MIN = 9 * 60 + 30;
const SESSION_CLOSE_MIN = 16 * 60;
const BAR_MINUTES = 5;
// Day lines are faint so 750 of them read as a fan; with few days shown the
// same opacity vanishes, so it scales up: 5% for hundreds of days, 35% for
// a dozen. The count is the days that pass the period and histogram filters,
// before the similar-days pick, so switching that pick on does not recolour
// the lines.
const DAY_OPACITY_MIN = 0.05, DAY_OPACITY_MAX = 0.35, DAY_OPACITY_SCALE = 4;
const dayOpacity = count => Math.min(DAY_OPACITY_MAX, Math.max(DAY_OPACITY_MIN, DAY_OPACITY_SCALE / Math.max(1, count)));
// Symlog is linear inside a band around zero and logarithmic beyond it, so the
// crowded region gets room while big days still fit. A plain log scale cannot
// hold zero or negative moves. Ticks come from this ladder, starting at the
// band edge where the log part begins.
const NICE_PCT_LADDER = [0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50];

const MARKET_TZ = 'America/New_York';
const LOCAL_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const MINUTES_PER_DAY = 24 * 60;

const parseStamp = d3.timeParse('%m/%d/%Y %H:%M:%S');
const fmtPct = (d, decimals = 2) => (d > 0 ? '+' : '') + d.toFixed(decimals) + '%';
const fmtAxisPct = d => (d > 0 ? '+' : '') + parseFloat(d.toFixed(2)) + '%';
const fmtClock = minutes => {
  const wrapped = ((minutes % MINUTES_PER_DAY) + MINUTES_PER_DAY) % MINUTES_PER_DAY;
  const h = Math.floor(wrapped / 60), m = wrapped % 60;
  return `${h}:${String(m).padStart(2, '0')}`;
};

// Wall-clock minutes since midnight for an instant in a given zone.
function minutesOfDayIn(timeZone, date) {
  const parts = new Intl.DateTimeFormat('en-US', { timeZone, hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(date);
  const get = type => +parts.find(p => p.type === type).value;
  return (get('hour') % 24) * 60 + get('minute');
}

// Minutes to add to a New York time to get the viewer's local time, measured
// today so daylight-saving rules on both sides are the current ones.
function localOffsetFromMarket() {
  const now = new Date();
  let diff = minutesOfDayIn(LOCAL_TZ, now) - minutesOfDayIn(MARKET_TZ, now);
  if (diff > MINUTES_PER_DAY / 2) diff -= MINUTES_PER_DAY;
  if (diff <= -MINUTES_PER_DAY / 2) diff += MINUTES_PER_DAY;
  return diff;
}

// The current New York minute of day, or null outside a weekday session.
// Exchange holidays are not known here, so a holiday shows as open.
function marketMinuteNow() {
  const now = new Date();
  const weekday = new Intl.DateTimeFormat('en-US', { timeZone: MARKET_TZ, weekday: 'short' }).format(now);
  if (weekday === 'Sat' || weekday === 'Sun') return null;
  const minute = minutesOfDayIn(MARKET_TZ, now);
  return minute >= SESSION_OPEN_MIN && minute <= SESSION_CLOSE_MIN ? minute : null;
}

const NOW_REFRESH_MS = 30 * 1000;
const NOW_TICK_SHARE = 0.05;             // the "now" tick spans this share of the plot height, from the top
const LINE_LABEL_MIN_GAP = 13;           // px between the mean and median end labels
const HOVER_LABEL_GAP = 14;              // px between stacked crosshair value labels
const HOVER_LABEL_ROOM = 150;            // px from the right edge inside which hover labels flip to the left
const HOVER_END_HEIGHT = 26;             // px the two-line end label needs
const HOVER_END_CLEARANCE = 20;          // px the end label keeps from the mean / median names

// Calendar date in New York, as the data's day timestamps are midnight ET.
const marketDateNow = () => new Intl.DateTimeFormat('en-CA', { timeZone: MARKET_TZ }).format(new Date());

const shortZoneName = timeZone =>
  new Intl.DateTimeFormat('en-US', { timeZone, timeZoneName: 'short' }).formatToParts(new Date())
    .find(p => p.type === 'timeZoneName').value;

// One row per 5-minute bar -> one series per trading day. Every point is the
// % change of that bar's close against the PREVIOUS session's close, the
// basis a quote screen uses, so a day starts at its opening gap rather than
// at zero and the 0% line is where yesterday closed. The first day in the
// file has no previous close and is dropped.
function buildDays(rows) {
  const byDay = d3.groups(rows, r => d3.timeDay.floor(parseStamp(r.Date)).getTime());
  const sessions = d3.sort(byDay.map(([dayMs, bars]) => {
    const sorted = d3.sort(bars, r => parseStamp(r.Date));
    return {
      id: dayMs,
      date: new Date(dayMs),
      open: +sorted[0].Open,
      bars: sorted.map(r => { const t = parseStamp(r.Date); return { minute: t.getHours() * 60 + t.getMinutes() + BAR_MINUTES, close: +r.Close }; }),
    };
  }), d => d.date);
  return sessions.slice(1).map((day, i) => {
    const prevClose = sessions[i].bars[sessions[i].bars.length - 1].close;
    const pct = price => (price / prevClose - 1) * 100;
    const points = [{ minute: SESSION_OPEN_MIN, pct: pct(day.open) }].concat(day.bars.map(b => ({ minute: b.minute, pct: pct(b.close) })));
    const last = points[points.length - 1];
    return {
      id: day.id,
      date: day.date,
      points,
      openVsPrevPct: points[0].pct,
      closeVsPrevPct: last.pct,
      complete: last.minute === SESSION_CLOSE_MIN,
    };
  });
}

// Mean and median of every day's % at each minute of the session.
function buildAggregates(days) {
  const minutes = d3.range(SESSION_OPEN_MIN, SESSION_CLOSE_MIN + 1, BAR_MINUTES);
  const byMinute = days.map(d => new Map(d.points.map(p => [p.minute, p.pct])));
  return minutes.map(minute => {
    const values = byMinute.map(m => m.get(minute)).filter(v => v !== undefined);
    return {
      minute,
      mean: d3.mean(values),
      median: d3.median(values),
      positiveShare: d3.mean(values, v => v > 0 ? 1 : 0),
      n: values.length,
    };
  });
}

// Each rule picks one minute of the session for its own reason. Rules of the
// same kind that land on the same minute merge into one label.
// Label text is two tokens per rule: what was measured and its value. The
// Buy/Sell title already says which extreme it is.
const ANNOTATION_RULES = [
  { kind: 'buy',  anchor: 'mean',   pick: a => d3.least(a, d => d.mean),              label: d => `mean ${fmtPct(d.mean)}` },
  { kind: 'buy',  anchor: 'median', pick: a => d3.least(a, d => d.median),            label: d => `median ${fmtPct(d.median)}` },
  { kind: 'sell', anchor: 'mean',   pick: a => d3.greatest(a, d => d.mean),           label: d => `mean ${fmtPct(d.mean)}` },
  { kind: 'sell', anchor: 'median', pick: a => d3.greatest(a, d => d.median),         label: d => `median ${fmtPct(d.median)}` },
];

// Label geometry. Labels are LABEL_WIDTH wide; their height depends on how
// many lines the text wraps to. A stacked label sits LABEL_PADDING past the
// connector's horizontal leg ("gutter"), GUTTER_BASE from the point on the
// first level and one label step further out per level. A side label sits
// beside its point, centred on it, with only a horizontal leg.
const LABEL_WIDTH = 120, LABEL_LEAD = 24, LABEL_PADDING = 6, LABEL_CLEARANCE = 6;
const LABEL_LINE_HEIGHT = 12, LABEL_CHROME = 9, LABEL_CHARS_PER_LINE = 17;
const GUTTER_BASE = 40, LEVEL_STEP = 60, MAX_LEVELS = 4;
const SIDE_COST = 1.5 * LEVEL_STEP;       // beside the point: after the first stacked level, before the second
const SIDE_FLIP_COST = 2 * LEVEL_STEP;    // the wrong side of the line costs two levels
const ROUTE_BEND_COST = 10;               // slight preference for dropping first
const SEARCH_CANDIDATES = 24, SEARCH_BUDGET = 20000;   // per-label spots kept for the search, and how many steps it may take

// Title line plus however many lines the reasons wrap to.
const labelHeight = p => LABEL_CHROME + LABEL_LINE_HEIGHT * (1 + Math.ceil(p.reasons.join(', ').length / LABEL_CHARS_PER_LINE));

// Places every label as close to its point as it can, all at once. Each
// label wants to sit just past its point on the first stacked level of its
// preferred side. Candidates are: every stacked level on either side, crossed
// with a few horizontal spots (the preferred one, the near side of the point,
// just past each placed box); plus a side spot on either side of the point.
// They are ranked cheapest first: levels out, then pixels sideways, then the
// side spot, then the wrong side of the line. A spot is valid when its box
// stays inside the plot, does not sit on the highlighted line, and neither
// its box nor its connector touches any other label's box or connector.
//
// A bounded depth-first search assigns every label a valid spot, trying
// cheaper spots first and backing up when a later label is boxed in by an
// earlier choice. If the search runs out of budget, a greedy pass places the
// labels one by one, relaxing the constraints in order (off the line, then
// clear of others, then inside the plot) and taking the cheapest spot as a
// last resort.
function layoutLabels(points, x, yOf, sideOf, chartWidth, chartHeight, lineHits) {
  const C = LABEL_CLEARANCE;
  const overlaps = (a, b) => a.left < b.right + C && b.left < a.right + C && a.top < b.bottom + C && b.top < a.bottom + C;
  const segHits = (seg, box) => seg.x1 < box.right + C && box.left - C < seg.x2 && seg.y1 < box.bottom + C && box.top - C < seg.y2;
  // Two ways to route the L from the point to the box's near corner: drop
  // first (down from the point, then across at the gutter) or leg first
  // (across at the point's height, then down at the box's edge). The second
  // gets past a box that sits directly under the point.
  const stacked = (px, py, h, sign, level, left, route) => {
    const gutterY = py + sign * (GUTTER_BASE + level * LEVEL_STEP);
    const top = sign > 0 ? gutterY + LABEL_PADDING : gutterY - LABEL_PADDING - h;
    const dropX = route === 'dropFirst' ? px : left;
    const legY = route === 'dropFirst' ? gutterY : py;
    return {
      mode: 'stacked', route, dx: left - px, dy: gutterY - py,
      box: { left, right: left + LABEL_WIDTH, top, bottom: top + h },
      drop: { x1: dropX, x2: dropX, y1: Math.min(py, gutterY), y2: Math.max(py, gutterY) },
      leg: { x1: Math.min(px, left), x2: Math.max(px, left), y1: legY, y2: legY },
    };
  };
  const beside = (px, py, h, dir) => {
    const left = dir > 0 ? px + LABEL_LEAD + LABEL_PADDING : px - LABEL_LEAD - LABEL_PADDING - LABEL_WIDTH;
    return {
      mode: 'side', dx: dir * LABEL_LEAD, dy: 0,
      box: { left, right: left + LABEL_WIDTH, top: py - h / 2, bottom: py + h / 2 },
      drop: { x1: px, x2: px, y1: py, y2: py },
      leg: { x1: Math.min(px, px + dir * LABEL_LEAD), x2: Math.max(px, px + dir * LABEL_LEAD), y1: py, y2: py },
    };
  };
  const clearOf = (g, others) => others.every(o =>
    !overlaps(g.box, o.box) && !segHits(g.drop, o.box) && !segHits(g.leg, o.box) && !segHits(o.drop, g.box) && !segHits(o.leg, g.box));
  const inside = g => g.box.top >= 0 && g.box.bottom <= chartHeight && g.box.left >= 0 && g.box.right <= chartWidth;
  const offLine = g => !lineHits(g.box);

  // Every candidate spot for a point, cheapest first. extraLefts lets the
  // greedy pass add spots just past boxes it has already placed.
  const candidatesFor = (p, extraLefts = []) => {
    const px = x(p.minute), py = yOf(p), h = labelHeight(p);
    const preferredSide = sideOf(p);
    const preferredLeft = px + LABEL_LEAD + LABEL_WIDTH <= chartWidth ? px + LABEL_LEAD : px - LABEL_LEAD - LABEL_WIDTH;
    const lefts = [preferredLeft, px - LABEL_LEAD - LABEL_WIDTH]
      .concat(extraLefts)
      .concat(d3.range(1, 4).flatMap(k => [px + LABEL_LEAD + k * (LABEL_WIDTH + C), px - LABEL_LEAD - (k + 1) * LABEL_WIDTH - k * C]))
      .filter(l => l >= 0 && l + LABEL_WIDTH <= chartWidth);
    const candidates = [preferredSide, -preferredSide].flatMap(sign =>
      d3.range(MAX_LEVELS).flatMap(level => lefts.flatMap(left => ['dropFirst', 'legFirst'].map(route => ({
        g: stacked(px, py, h, sign, level, left, route),
        cost: level * LEVEL_STEP + Math.abs(left - preferredLeft) + (sign === preferredSide ? 0 : SIDE_FLIP_COST) + (route === 'legFirst' ? ROUTE_BEND_COST : 0),
      })))))
      .concat([1, -1].map(dir => ({ g: beside(px, py, h, dir), cost: SIDE_COST + (dir > 0 ? 0 : LABEL_WIDTH) })));
    return d3.sort(candidates, c => c.cost).map(c => c.g);
  };

  // Search: valid spots only, cheapest first, backing up when stuck.
  const valid = points.map(p => candidatesFor(p).filter(g => inside(g) && offLine(g)).slice(0, SEARCH_CANDIDATES));
  const chosen = [];
  let budget = SEARCH_BUDGET;
  const search = i => {
    if (i === points.length) return true;
    for (const g of valid[i]) {
      if (--budget < 0) return false;
      if (!clearOf(g, chosen)) continue;
      chosen.push(g);
      if (search(i + 1)) return true;
      chosen.pop();
    }
    return false;
  };
  if (search(0)) return points.map((p, i) => ({ p, ...chosen[i] }));

  // Greedy fallback with relaxed constraints.
  const placed = [];
  return points.map(p => {
    const ordered = candidatesFor(p, placed.map(o => o.box.right + C));
    const pick = ordered.find(g => inside(g) && clearOf(g, placed) && offLine(g))
      || ordered.find(g => inside(g) && clearOf(g, placed))
      || ordered.find(g => inside(g))
      || ordered[0];
    placed.push(pick);
    return { p, ...pick };
  });
}

// Does the segment from a to b pass through the box? Liang–Barsky clipping
// of the segment against the box's four edges.
function segmentHitsBox(a, b, box) {
  const dx = b.x - a.x, dy = b.y - a.y;
  let t0 = 0, t1 = 1;
  const edges = [[-dx, a.x - box.left], [dx, box.right - a.x], [-dy, a.y - box.top], [dy, box.bottom - a.y]];
  for (const [p, q] of edges) {
    if (p === 0) { if (q < 0) return false; continue; }
    const t = q / p;
    if (p < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
    else { if (t < t0) return false; if (t < t1) t1 = t; }
  }
  return true;
}

function buildAnnotationPoints(aggregates) {
  const picks = ANNOTATION_RULES.map(rule => ({ rule, agg: rule.pick(aggregates) }));
  return d3.groups(picks, p => `${p.rule.kind}@${p.agg.minute}`).map(([id, group]) => ({
    id,
    minute: group[0].agg.minute,
    kind: group[0].rule.kind,
    anchor: group[0].rule.anchor,
    agg: group[0].agg,
    reasons: group.map(p => p.rule.label(p.agg)),
  }));
}

// Recency-weighted distance between two equal-length % paths: the root mean
// square gap, with weights ramping linearly so the latest bar counts
// RECENCY_WEIGHT times the first. Small means the lines sit on top of each
// other, which is what "looks like today" means on this chart: same level
// above or below the open, same size of moves, same timing. Shape-only
// measures (correlation of levels or of 5-minute changes) were tried and
// ranked days ending 2% away from today near the top.
const RECENCY_WEIGHT = 3;
function weightedDistance(a, b) {
  const n = a.length;
  const w = a.map((_, i) => 1 + (n > 1 ? i / (n - 1) : 0) * (RECENCY_WEIGHT - 1));
  return Math.sqrt(d3.sum(a, (v, i) => w[i] * (v - b[i]) ** 2) / d3.sum(w));
}

// Similar-days filter. The reference is the latest day, which during a
// session is today so far. Its path is compared with every other day's over
// the same minutes by weighted distance and the closest KEEP_SHARE of them
// is kept (at least one day). A day missing any of those minutes (a half
// session shorter than the reference) is left out.
const KEEP_SHARE = 0.08;
function similarDays(days, reference) {
  const refByMinute = new Map(reference.points.map(p => [p.minute, p.pct]));
  const cutoff = reference.points[reference.points.length - 1].minute;
  const minutes = d3.range(SESSION_OPEN_MIN, cutoff + 1, BAR_MINUTES);   // the open, now a real value, takes part
  const refSeries = minutes.map(m => refByMinute.get(m));
  const scored = days
    .filter(d => d !== reference)
    .map(d => {
      const byMinute = new Map(d.points.map(p => [p.minute, p.pct]));
      if (!minutes.every(m => byMinute.has(m))) return null;
      return { day: d, distance: weightedDistance(refSeries, minutes.map(m => byMinute.get(m))) };
    })
    .filter(Boolean);
  const keepCount = Math.max(1, Math.round(scored.length * KEEP_SHARE));
  const kept = d3.sort(scored, d => d.distance).slice(0, keepCount).map(d => d.day);
  return { days: d3.sort([reference, ...kept], d => d.date), cutoff };
}

class IntradayOverlayChart {
  constructor() {
    const attrs = {
      id: 'ID' + Math.floor(Math.random() * 1000000),
      svgWidth: 400,
      svgHeight: 600,
      marginTop: 8,
      marginBottom: 32,
      marginRight: 108,         // room for the mean / median labels and the hovered day's date at the line ends
      marginLeft: 52,
      container: 'body',
      defaultFont: 'inherit',
      data: null,
      aggregates: null,
      chartWidth: null,
      chartHeight: null,
      firstRender: true,
      yScaleType: 'symlog',
      symlogLinearPct: 0.1,
      yLimit: null,             // fixed |%| extent of the y-axis, set once from all days so filtering never rescales
      minuteOffset: 0,          // added to New York minutes for axis and readout labels
      zoneLabel: 'ET',
      referenceId: null,        // day drawn as the reference when the similar-days filter is on
      matchCutoff: null,        // last matched minute; shades the window when set
      todayId: null,            // the latest day in the file, drawn on its own layer on top
      opacityCount: null,       // days the opacity is tuned for; defaults to the days drawn
    };
    this.getState = () => attrs;
    this.setState = d => Object.assign(attrs, d);
    Object.keys(attrs).forEach(key => {
      this[key] = function (_) {
        if (!arguments.length) return attrs[key];
        attrs[key] = _;
        return this;
      };
    });
    this.initializeEnterExitUpdatePattern();
  }

  render() {
    this.setDynamicContainer();
    this.calculateProperties();
    this.drawSvgAndWrappers();
    this.drawScales();
    this.drawAxes();
    this.drawDays();
    this.drawAggregates();
    this.drawNow();
    this.drawAnnotations();
    this.drawToday();
    this.drawHover();
    this.setState({ firstRender: false });
    return this;
  }

  calculateProperties() {
    const { marginLeft, marginTop, marginRight, marginBottom, svgWidth, svgHeight } = this.getState();
    const calc = { chartLeftMargin: marginLeft, chartTopMargin: marginTop };
    const chartWidth = svgWidth - marginRight - marginLeft;
    const chartHeight = svgHeight - marginBottom - marginTop;
    this.setState({ calc, chartWidth, chartHeight });
  }

  drawScales() {
    const { data, chartWidth, chartHeight, yScaleType, symlogLinearPct } = this.getState();
    const allPct = data.flatMap(d => d.points.map(p => p.pct));
    const x = d3.scaleLinear().domain([SESSION_OPEN_MIN, SESSION_CLOSE_MIN]).range([0, chartWidth]);
    const [lo, hi] = d3.extent(allPct);
    const limit = this.getState().yLimit || Math.ceil(Math.max(-lo, hi));
    const y = (yScaleType === 'symlog'
      ? d3.scaleSymlog().constant(symlogLinearPct)
      : d3.scaleLinear()).domain([-limit, limit]).range([chartHeight, 0]);
    const yTicks = yScaleType === 'symlog'
      ? [0].concat(NICE_PCT_LADDER.filter(t => t >= symlogLinearPct && t <= limit).flatMap(t => [t, -t]))
      : y.ticks(8);
    const line = d3.line().x(p => x(p.minute)).y(p => y(p.pct));
    this.setState({ x, y, yTicks, line });
  }

  drawAxes() {
    const { chart, x, y, yTicks, chartWidth, chartHeight, minuteOffset } = this.getState();
    const isWholeHour = m => ((m + minuteOffset) % 60 + 60) % 60 === 0;
    const hourTicks = [SESSION_OPEN_MIN, SESSION_CLOSE_MIN]
      .concat(d3.range(SESSION_OPEN_MIN + 1, SESSION_CLOSE_MIN).filter(isWholeHour));
    const fmtTick = m => fmtClock(m + minuteOffset);

    chart._add('g.grid')
      .call(d3.axisLeft(y).tickValues(yTicks).tickSize(-chartWidth).tickFormat(''))
      .call(g => g.select('.domain').remove());

    chart._add('g.x-axis').classed('axis', true)
      .attr('transform', `translate(0,${chartHeight})`)
      .call(d3.axisBottom(x).tickValues(hourTicks).tickFormat(fmtTick).tickSizeOuter(0));

    chart._add('g.y-axis').classed('axis', true)
      .call(d3.axisLeft(y).tickValues(yTicks).tickFormat(fmtAxisPct).tickSizeOuter(0));

    chart._add('line.zero')
      .attr('x1', 0).attr('x2', chartWidth)
      .attr('y1', y(0)).attr('y2', y(0));
  }

  drawDays() {
    const { chart, data, line, referenceId, matchCutoff, x, chartHeight } = this.getState();
    chart._add('g.match')._add('rect.match-window')
      .attr('x', x(SESSION_OPEN_MIN)).attr('y', 0)
      .attr('width', matchCutoff === null ? 0 : x(matchCutoff) - x(SESSION_OPEN_MIN))
      .attr('height', chartHeight);
    const { todayId, opacityCount } = this.getState();
    const faint = data.filter(d => d.id !== todayId);
    const opacity = dayOpacity(opacityCount ?? faint.length);
    chart._add('g.days')._add('path.day-path', faint)
      .attr('d', d => line(d.points))
      .classed('reference', d => d.id === referenceId)
      .style('opacity', d => d.id === referenceId ? 1 : opacity);
  }

  // Today's path on its own layer above the aggregates and labels. The line
  // draws itself in on the first render; the ring pulses while the session
  // is open, and rests as a plain dot after the close.
  drawToday() {
    const { chart, data, line, x, y, chartWidth, todayId, firstRender } = this.getState();
    const today = data.find(d => d.id === todayId);
    const g = chart._add('g.today').style('display', today ? null : 'none');
    if (!today) return;
    const last = today.points[today.points.length - 1];
    const live = marketMinuteNow() !== null && fmtIsoDay(today.date) === marketDateNow();
    const d = line(today.points);
    g._add('path.today-glow').attr('d', d);
    const path = g._add('path.today-path').attr('d', d);
    if (firstRender) {
      const length = path.node().getTotalLength();
      path.attr('stroke-dasharray', `${length} ${length}`).attr('stroke-dashoffset', length)
        .transition().duration(900).ease(d3.easeCubicOut).attr('stroke-dashoffset', 0)
        .on('end', () => path.attr('stroke-dasharray', null).attr('stroke-dashoffset', null));
    }
    const cx = x(last.minute), cy = y(last.pct);
    // The rings group always exists; its circles are joined to two items
    // while live and to none otherwise, so an empty join never has to chain
    // off an empty selection.
    g._add('g.today-rings').attr('transform', `translate(${cx},${cy})`)
      ._add('circle.today-ring', live ? [0, 1] : []).attr('r', 5).classed('second', k => k === 1);
    g._add('circle.today-dot').attr('cx', cx).attr('cy', cy).attr('r', 4);
    const nearRightEdge = cx > chartWidth - 110;
    // The latest day's change vs its open, beside the dot and below it so
    // sell labels above the line stay clear. While the session is open this
    // is "today" with pulsing rings; once it has closed, or on a day with no
    // session, the same line stays as the previous close.
    const tone = last.pct > 0 ? 'up' : last.pct < 0 ? 'down' : '';
    g._add('text.today-label')
      .attr('x', cx + (nearRightEdge ? -10 : 10)).attr('y', cy + 18)
      .attr('text-anchor', nearRightEdge ? 'end' : 'start')
      .html(`${live ? 'today' : 'prev close'} <tspan class="${tone}">${fmtPct(last.pct)}</tspan>`);
  }

  drawAggregates() {
    const { chart, aggregates, x, y } = this.getState();
    const meanLine = d3.line().x(a => x(a.minute)).y(a => y(a.mean));
    const medianLine = d3.line().x(a => x(a.minute)).y(a => y(a.median));
    const g = chart._add('g.aggregates');
    g._add('path.median-path').attr('d', medianLine(aggregates));
    g._add('path.mean-path').attr('d', meanLine(aggregates));

    // Name each line at its right-hand end instead of a legend. When the two
    // end within a label's height of each other, push them apart.
    const last = aggregates[aggregates.length - 1];
    const labels = [
      { id: 'mean', text: 'mean', y: y(last.mean) },
      { id: 'median', text: 'median', y: y(last.median) },
    ];
    const gap = labels[0].y - labels[1].y;
    if (Math.abs(gap) < LINE_LABEL_MIN_GAP) {
      const push = (LINE_LABEL_MIN_GAP - Math.abs(gap)) / 2;
      labels[0].y += gap >= 0 ? push : -push;
      labels[1].y += gap >= 0 ? -push : push;
    }
    g._add('text.line-label', labels)
      .attr('class', d => `line-label ${d.id}`)
      .attr('x', x(last.minute) + 6).attr('y', d => d.y)
      .text(d => d.text);
    this.setState({ lineLabelYs: labels.map(l => l.y) });   // the hover end label steers around these
  }

  drawAnnotations() {
    const { chart, aggregates, x, y, chartWidth, minuteOffset, zoneLabel } = this.getState();
    const KIND_TITLE = { buy: 'Buy', sell: 'Sell' };
    const points = d3.sort(buildAnnotationPoints(aggregates), p => p.minute);
    // Buys prefer the space below the line, sells above; layoutLabels may
    // move one across when its own side has no room.
    const { chartHeight } = this.getState();
    const yOf = p => y(p.agg[p.anchor]);
    const sideOf = p => p.kind === 'buy' ? 1 : -1;
    const lineHits = this.highlightedLineHitTest();
    const annotations = layoutLabels(points, x, yOf, sideOf, chartWidth, chartHeight, lineHits).map(({ p, mode, route, dx, dy }) => {
      const px = x(p.minute), py = yOf(p);
      const stacked = mode === 'stacked';
      return {
        x: px, y: py, dx, dy,
        className: p.kind,
        subject: { radius: 5 },
        // Stacked: an L from the point to the label's near corner, bending
        // at the gutter (drop first) or at the point's height (leg first).
        // Side: the horizontal leg only. No diagonal legs either way.
        connector: stacked
          ? { type: 'curve', curve: d3.curveLinear, points: [route === 'dropFirst' ? [0, dy] : [dx, 0]] }
          : { type: 'line' },
        note: {
          title: `${KIND_TITLE[p.kind]} ${fmtClock(p.minute + minuteOffset)}`,
          label: p.reasons.join(', '),
          orientation: stacked ? 'topBottom' : 'leftRight',
          align: stacked ? 'left' : 'middle',
          lineType: 'none',
          wrap: LABEL_WIDTH - 14,      // text + 5px padding each side stays inside the LABEL_WIDTH box the layout assumes
          bgPadding: { top: 3, left: 5, right: 5, bottom: 3 },
        },
      };
    });
    const g = chart._add('g.annotations');
    g.selectAll('*').remove();          // d3-annotation owns this subtree; rebuild it each render
    g.call(d3.annotation().type(d3.annotationCalloutCircle).notePadding(LABEL_PADDING).annotations(annotations));
  }

  // The highlighted line is the thing to read, so no label may sit on it:
  // today's path when it is in view, else the reference day of the
  // similar-days filter. Returns a test of a label box, padded a little,
  // against every segment of that line.
  highlightedLineHitTest() {
    const { data, x, y, todayId, referenceId } = this.getState();
    const line = data.find(d => d.id === todayId) || data.find(d => d.id === referenceId);
    if (!line) return () => false;
    const PAD = 8;
    const pts = line.points.map(p => ({ x: x(p.minute), y: y(p.pct) }));
    return b => {
      const box = { left: b.left - PAD, right: b.right + PAD, top: b.top - PAD, bottom: b.bottom + PAD };
      return pts.some((p, i) => i > 0 && segmentHitsBox(pts[i - 1], p, box));
    };
  }

  drawNow() {
    const { chart, x, chartHeight, minuteOffset, zoneLabel } = this.getState();
    const minute = marketMinuteNow();
    const g = chart._add('g.now').style('display', minute === null ? 'none' : null);
    if (minute === null) return;
    const px = x(minute);
    const nearRightEdge = px > x(SESSION_CLOSE_MIN) - 90;
    // A short tick at the top rather than a full-height rule: enough to
    // place "now" without cutting across the paths.
    g._add('line.now-line').attr('x1', px).attr('x2', px).attr('y1', 0).attr('y2', chartHeight * NOW_TICK_SHARE);
    g._add('text.now-label')
      .attr('x', px + (nearRightEdge ? -6 : 6)).attr('y', 12)
      .attr('text-anchor', nearRightEdge ? 'end' : 'start')
      .text(`now ${fmtClock(minute + minuteOffset)} ${zoneLabel}`);
  }

  drawHover() {
    const { chart, d3Container, aggregates, data, x, y, chartWidth, chartHeight, minuteOffset, referenceId } = this.getState();
    const { todayId, opacityCount } = this.getState();
    const opacity = dayOpacity(opacityCount ?? data.filter(d => d.id !== todayId).length);
    const restOpacity = d => d.id === referenceId ? 1 : opacity;
    const rule = chart._add('line.hover-rule')
      .attr('y1', 0).attr('y2', chartHeight)
      .style('display', 'none');
    const marks = chart._add('g.hover-marks').style('display', 'none');
    const dayPaths = chart.selectAll('path.day-path');
    const bisectMinute = d3.bisector(a => a.minute).center;
    const bisectPoint = d3.bisector(p => p.minute).center;

    chart._add('rect.hover-target')
      .attr('width', chartWidth).attr('height', chartHeight)
      .attr('fill', 'transparent')
      .on('mousemove', (event) => {
        const minute = x.invert(d3.pointer(event)[0]);
        const agg = aggregates[bisectMinute(aggregates, minute)];
        rule.style('display', null).attr('x1', x(agg.minute)).attr('x2', x(agg.minute));

        // The day whose path is nearest the cursor gets highlighted.
        const cursorPct = y.invert(d3.pointer(event)[1]);
        const nearest = d3.least(data, d => {
          const p = d.points[bisectPoint(d.points, agg.minute)];
          return p.minute === agg.minute ? Math.abs(p.pct - cursorPct) : Infinity;
        });
        dayPaths.classed('hover', d => d === nearest).style('opacity', d => d === nearest ? 1 : restOpacity(d));
        const nearestPct = nearest.points[bisectPoint(nearest.points, agg.minute)].pct;

        marks.style('display', null);
        const hx = x(agg.minute);
        const onRight = hx > chartWidth - HOVER_LABEL_ROOM;

        // Time chip on the axis under the crosshair.
        const timeText = fmtClock(agg.minute + minuteOffset);
        const chipW = timeText.length * 6.6 + 12, chipH = 16;
        const chip = marks._add('g.hover-time-chip')
          .attr('transform', `translate(${Math.max(chipW / 2, Math.min(chartWidth - chipW / 2, hx))},${chartHeight + 10})`);
        chip._add('rect.hover-time-bg').attr('x', -chipW / 2).attr('y', -chipH / 2).attr('width', chipW).attr('height', chipH);
        chip._add('text.hover-time').text(timeText);

        // Values where the crosshair crosses each line, pushed apart when
        // two would sit on top of each other.
        const crossings = [
          { id: 'mean', text: `mean ${fmtPct(agg.mean)}`, y: y(agg.mean) },
          { id: 'median', text: `median ${fmtPct(agg.median)}`, y: y(agg.median) },
          { id: 'day', text: fmtPct(nearestPct), y: y(nearestPct) },
        ];
        const ordered = d3.sort(crossings, c => c.y);
        ordered.forEach(c => { c.ly = c.y; });
        for (let i = 1; i < ordered.length; i++) ordered[i].ly = Math.max(ordered[i].ly, ordered[i - 1].ly + HOVER_LABEL_GAP);
        for (let i = ordered.length - 2; i >= 0; i--) ordered[i].ly = Math.min(ordered[i].ly, ordered[i + 1].ly - HOVER_LABEL_GAP);
        const cross = marks._add('g.hover-cross', crossings)
          .attr('class', c => `hover-cross ${c.id}`)
          .attr('transform', c => `translate(${hx},0)`);
        cross._add('circle.hover-dot').attr('cy', c => c.y).attr('r', 3.5);
        cross._add('text.hover-value')
          .attr('x', onRight ? -9 : 9).attr('y', c => c.ly)
          .attr('text-anchor', onRight ? 'end' : 'start')
          .text(c => c.text);

        // The hovered day's end, in the right margin beside the plot like the
        // mean and median names: its date, then its final change and the time
        // of that bar. Two lines, placed at the line's end unless that would
        // sit on the mean or median name, in which case it moves up or down.
        const last = nearest.points[nearest.points.length - 1];
        const ey = y(last.pct);
        const { lineLabelYs = [] } = this.getState();
        const clearOfNames = cy => lineLabelYs.every(ly => Math.abs(cy - ly) > HOVER_END_CLEARANCE);
        const inPlot = cy => cy - HOVER_END_HEIGHT / 2 >= 0 && cy + HOVER_END_HEIGHT / 2 <= chartHeight;
        const endY = [ey, ey - HOVER_END_HEIGHT, ey + HOVER_END_HEIGHT, ey - 2 * HOVER_END_HEIGHT, ey + 2 * HOVER_END_HEIGHT]
          .find(cy => inPlot(cy) && clearOfNames(cy)) ?? ey;
        const endLabel = marks._add('text.hover-end')
          .attr('x', chartWidth + 6).attr('y', endY).attr('text-anchor', 'start')
          .attr('class', 'hover-end');
        endLabel.html(`<tspan x="${chartWidth + 6}" dy="-0.35em">${d3.timeFormat('%b %-d, %Y')(nearest.date)}</tspan>` +
          `<tspan x="${chartWidth + 6}" dy="1.2em" class="dim">${fmtPct(last.pct)} at ${fmtClock(last.minute + minuteOffset)}</tspan>`);
      })
      .on('mouseleave', () => {
        rule.style('display', 'none');
        marks.style('display', 'none');
        dayPaths.classed('hover', false).style('opacity', restOpacity);
      });
  }

  drawSvgAndWrappers() {
    const { d3Container, svgWidth, svgHeight, defaultFont, calc } = this.getState();
    const svg = d3Container._add('svg.svg-container')
      .attr('width', svgWidth)
      .attr('height', svgHeight)
      .attr('font-family', defaultFont);
    const chart = svg._add('g.chart')
      .attr('transform', `translate(${calc.chartLeftMargin},${calc.chartTopMargin})`);
    this.setState({ chart, svg });
  }

  initializeEnterExitUpdatePattern() {
    d3.selection.prototype._add = function (classSelector, data, params) {
      const container = this;
      const split = classSelector.split('.');
      const elementTag = split[0];
      const className = split[1] || 'not-good';
      const exitTransition = params?.exitTransition;
      const enterTransition = params?.enterTransition;

      let bindData = data;
      if (typeof data === 'function') bindData = data(container.datum());
      if (bindData && !Array.isArray(bindData)) bindData = [bindData];
      if (!bindData) bindData = container.datum() ? d => [d] : [className];

      let selection = container.selectAll(elementTag + '.' + className).data(bindData, (d, i) => {
        if (typeof d === 'object' && d.id) return d.id;
        return i;
      });
      if (exitTransition) exitTransition(selection); else selection.exit().remove();
      const enterSelection = selection.enter().append(elementTag);
      if (enterTransition) enterTransition(enterSelection);
      selection = enterSelection.merge(selection);
      selection.attr('class', className);
      if (className === 'not-good') {
        selection.attr('stroke', 'red').attr('stroke-width', 10);
        selection.selectAll('title').data(['not-good']).join('title').text("You don't have a class set for this element!");
      }
      return selection;
    };
  }

  setDynamicContainer() {
    const attrs = this.getState();
    const d3Container = d3.select(attrs.container);
    const containerRect = d3Container.node().getBoundingClientRect();
    if (containerRect.width > 0) attrs.svgWidth = containerRect.width;
    const self = this;
    d3.select(window).on('resize.' + attrs.id, function () {
      const rect = d3Container.node().getBoundingClientRect();
      if (rect.width > 0) attrs.svgWidth = rect.width;
      self.render();
    });
    this.setState({ d3Container });
  }
}

function renderCoverage(days) {
  const fmtDate = d3.timeFormat('%b %-d, %Y');
  d3.select('#coverage').html(
    `<b>${days.length}</b> days, <b>${fmtDate(days[0].date)}</b> to <b>${fmtDate(days[days.length - 1].date)}</b>`);
}

// The slider position survives reloads. A thumb resting on an edge is saved
// as 'edge' so it keeps following the data as days are appended; a thumb in
// the middle is saved as its date so it lands on the same day next time.
const PERIOD_STORAGE_KEY = 'tqqq-intraday-period';
const fmtIsoDay = d3.timeFormat('%Y-%m-%d');

// localStorage can be missing or throw (private mode, blocked storage);
// the slider then just starts at the edges.
function readSavedPeriod() {
  try { return JSON.parse(localStorage.getItem(PERIOD_STORAGE_KEY)) || {}; } catch { return {}; }
}
function writeSavedPeriod(period) {
  try { localStorage.setItem(PERIOD_STORAGE_KEY, JSON.stringify(period)); } catch { /* storage unavailable */ }
}

// Index of the saved thumb in allDays. 'edge' or a date outside the data
// falls back to that thumb's own edge; a date with no exact match (a
// holiday, or a day filtered out later) snaps inward to the nearest day.
function restoreThumb(saved, allDays, edgeIndex, isStart) {
  if (!saved || saved === 'edge') return edgeIndex;
  const days = allDays.map(d => fmtIsoDay(d.date));
  const exact = days.indexOf(saved);
  if (exact >= 0) return exact;
  const inward = isStart ? days.findIndex(d => d > saved) : days.findLastIndex(d => d < saved);
  return inward >= 0 ? inward : edgeIndex;
}

// Two-thumb period slider over the loaded trading days. Each thumb is an
// index into allDays; the thumbs cannot cross. Every move re-filters the
// days, recomputes the aggregates and rules, and re-renders the chart.
function setupPeriodSlider(allDays, onChange) {
  const start = d3.select('#range-start'), end = d3.select('#range-end'), fill = d3.select('#range-fill');
  const last = allDays.length - 1;
  const saved = readSavedPeriod();
  start.attr('max', last).property('value', restoreThumb(saved.start, allDays, 0, true));
  end.attr('max', last).property('value', restoreThumb(saved.end, allDays, last, false));

  const apply = () => {
    let lo = +start.property('value'), hi = +end.property('value');
    if (lo > hi) [lo, hi] = [hi, lo];
    start.property('value', lo);
    end.property('value', hi);
    fill.style('left', `${lo / last * 100}%`).style('width', `${(hi - lo) / last * 100}%`);
    writeSavedPeriod({
      start: lo === 0 ? 'edge' : fmtIsoDay(allDays[lo].date),
      end: hi === last ? 'edge' : fmtIsoDay(allDays[hi].date),
    });
    onChange(allDays.slice(lo, hi + 1));
  };
  start.on('input', apply);
  end.on('input', apply);
  apply();
}

// On/off switches whose state survives reloads, one localStorage key each.
// With nothing saved, or when localStorage is missing or throws (private
// mode, blocked storage), the switch takes its default.
const SIMILAR_STORAGE_KEY = 'tqqq-intraday-similar';
function readSavedSwitch(key, fallback = false) {
  try {
    const saved = localStorage.getItem(key);
    return saved === null ? fallback : saved === '1';
  } catch { return fallback; }
}
function writeSavedSwitch(key, on) {
  try { localStorage.setItem(key, on ? '1' : '0'); } catch { /* storage unavailable */ }
}

// Metric filters: keep days whose open and whose close, both vs the previous
// session's close, fall inside brushed ranges. Each metric is a
// small histogram over all days with the same number of bins, spanning the
// metric's full extent rounded to 0.1%. The brush starts at the full extent,
// handles showing, so the control reads as a range from the first look; at
// the full extent nothing is filtered. The latest day is never filtered out:
// it is the reference the similar-days filter compares against. Each brush
// is saved; a bound at an extreme is saved as 'edge' so it keeps following
// the data.
const METRICS = {
  open: { value: d => d.openVsPrevPct },
  close: { value: d => d.closeVsPrevPct },
};
const METRIC_STEP = 0.1;
const METRIC_BINS = 30;
const HANDLE_LABEL_GAP = 6;              // px kept between a histogram's two bound labels
const metricStorageKey = key => `tqqq-intraday-metric-${key}`;
function readSavedRange(key) {
  try { return JSON.parse(localStorage.getItem(metricStorageKey(key))) || {}; } catch { return {}; }
}
function writeSavedRange(key, range) {
  try { localStorage.setItem(metricStorageKey(key), JSON.stringify(range)); } catch { /* storage unavailable */ }
}

// One brushable histogram. Returns { pass(day) } for the current range.
function setupMetricHistogram(key, allDays, onChange) {
  const block = d3.select(`.metric[data-metric="${key}"]`);
  const svg = block.select('svg.metric-hist'), rangeLabel = block.select('.metric-range');
  const round = v => +v.toFixed(1);
  const values = allDays.map(METRICS[key].value).filter(v => v !== null);
  const min = round(Math.floor(d3.min(values) / METRIC_STEP) * METRIC_STEP);
  const max = round(Math.ceil(d3.max(values) / METRIC_STEP) * METRIC_STEP);
  const state = { lo: min, hi: max };

  // Measured after layout, then pinned, so the brush extent and the bars
  // always agree with the box even if the row later reflows.
  svg.selectAll('*').remove();                       // a data refresh rebuilds the histogram
  const width = svg.node().clientWidth, height = svg.node().clientHeight;   // inside the frame
  svg.style('width', `${width + 2}px`).style('flex', 'none');
  const x = d3.scaleLinear().domain([min, max]).range([0, width]);
  const bins = d3.bin().domain([min, max]).thresholds(d3.range(1, METRIC_BINS).map(i => min + (max - min) * i / METRIC_BINS))(values);
  const y = d3.scaleLinear().domain([0, d3.max(bins, b => b.length)]).range([height, 2]);
  const bars = svg.append('g').attr('class', 'bars').selectAll('rect.bar').data(bins).join('rect').attr('class', 'bar')
    .attr('x', b => x(b.x0) + 0.5).attr('width', b => Math.max(1, x(b.x1) - x(b.x0) - 1))
    .attr('y', b => y(b.length)).attr('height', b => height - y(b.length));
  svg.append('line').attr('class', 'zero').attr('x1', x(0)).attr('x2', x(0)).attr('y1', 0).attr('y2', height);
  const brush = d3.brushX().extent([[0, 0], [width, height]]).handleSize(6);
  const brushG = svg.append('g').attr('class', 'brush').call(brush);
  const handleLabels = svg.append('g').attr('class', 'handle-labels');
  const fullRange = () => [x(min), x(max)];
  svg.on('dblclick', () => brushG.call(brush.move, fullRange()));

  const apply = selection => {
    // A cleared brush (dragging it away) means the full range again.
    if (!selection) { brushG.call(brush.move, fullRange()); return; }
    const [a, b] = selection.map(v => round(x.invert(v)));
    state.lo = a; state.hi = b;
    const active = a > min || b < max;
    bars.classed('in', bin => !active || (bin.x1 > a && bin.x0 < b));
    rangeLabel.text(active ? '' : 'any');
    // The bounds sit under their handles, centred, then clamped by their
    // measured width so neither leaves the box and the two never touch: the
    // lower label yields leftwards, the upper rightwards.
    const labels = [{ v: a, px: x(a) }, { v: b, px: x(b) }];
    const texts = handleLabels.selectAll('text.handle-label').data(labels).join('text').attr('class', 'handle-label')
      .attr('y', height + 3).attr('text-anchor', 'start').text(d => fmtPct(d.v, 1));
    const widths = texts.nodes().map(n => n.getComputedTextLength());
    let left0 = Math.max(0, Math.min(width - widths[0], labels[0].px - widths[0] / 2));
    let left1 = Math.max(0, Math.min(width - widths[1], labels[1].px - widths[1] / 2));
    const overlap = left0 + widths[0] + HANDLE_LABEL_GAP - left1;
    if (overlap > 0) {
      left0 = Math.max(0, left0 - overlap / 2);
      left1 = Math.min(width - widths[1], left0 + widths[0] + HANDLE_LABEL_GAP);
      left0 = Math.max(0, Math.min(left0, left1 - widths[0] - HANDLE_LABEL_GAP));   // the upper may have hit the edge
    }
    texts.attr('x', (d, i) => i === 0 ? left0 : left1);
    writeSavedRange(key, { lo: a > min ? a : 'edge', hi: b < max ? b : 'edge' });
    onChange();
  };
  brush.on('brush end', event => { if (event.sourceEvent || event.type === 'end') apply(event.selection); });

  const saved = readSavedRange(key);
  brushG.call(brush.move, [x(typeof saved.lo === 'number' ? Math.max(min, saved.lo) : min), x(typeof saved.hi === 'number' ? Math.min(max, saved.hi) : max)]);

  state.pass = d => { const v = METRICS[key].value(d); return v !== null && v >= state.lo && v <= state.hi; };
  return state;
}

function setupMetricFilters(allDays, latestId, onChange) {
  const filters = Object.keys(METRICS).map(key => setupMetricHistogram(key, allDays, onChange));
  return { filter: days => days.filter(d => d.id === latestId || filters.every(f => f.pass(d))) };
}

// Similar-days control: just the toggle. With nothing saved it starts on
// while a session is open, when "days like today so far" is the question,
// and off outside market hours, when the reference would be a finished day.
function setupSimilarFilter(onChange) {
  const state = { on: readSavedSwitch(SIMILAR_STORAGE_KEY, marketMinuteNow() !== null) };
  d3.select('#toggle-similar').property('checked', state.on).on('change', function () {
    state.on = this.checked;
    writeSavedSwitch(SIMILAR_STORAGE_KEY, state.on);
    onChange();
  });
  return state;
}

// One chart for the page's life; every load, first or refresh, rebuilds the
// controls and data around it. The controls read their saved state on each
// setup, so a refresh keeps the period, the brushes and the toggle as they
// were, with edge-pinned thumbs following the new data.
const chart = new IntradayOverlayChart().container('#chart')
  .minuteOffset(localOffsetFromMarket()).zoneLabel(shortZoneName(LOCAL_TZ));
const DATA_REFRESH_MS = 10 * 60 * 1000;

function loadData() {
  return d3.tsv(DATA_URL, { cache: 'no-cache' }).then(rows => {
    const allDays = buildDays(rows);
    const allPct = allDays.flatMap(d => d.points.map(p => p.pct));
    // The y extent only ever grows, so a refresh never rescales the plot.
    chart.yLimit(Math.max(chart.yLimit() || 0, Math.ceil(Math.max(-d3.min(allPct), d3.max(allPct)))));
    const latestId = allDays[allDays.length - 1].id;
    let periodDays = allDays;

    const refresh = () => {
      const filtered = metric.filter(periodDays);
      let days = filtered, cutoff = null, reference = null;
      if (similar.on) {
        reference = filtered[filtered.length - 1];
        ({ days, cutoff } = similarDays(filtered, reference));
      }
      renderCoverage(days);
      chart.data(days).aggregates(buildAggregates(days))
        .referenceId(reference ? reference.id : null).matchCutoff(cutoff)
        .todayId(latestId)
        .opacityCount(filtered.filter(d => d.id !== latestId).length)
        .render();
    };
    let ready = false;                                 // one render once every control is wired
    const guarded = () => { if (ready) refresh(); };
    const metric = setupMetricFilters(allDays, latestId, guarded);
    const similar = setupSimilarFilter(guarded);
    setupPeriodSlider(allDays, days => { periodDays = days; guarded(); });
    ready = true;
    refresh();
  });
}

loadData().then(() => {
  setInterval(() => chart.drawNow(), NOW_REFRESH_MS);
  setInterval(loadData, DATA_REFRESH_MS);            // the pipeline appends bars through the day
});
</script>
</body>
</html>
