    <div id="chart">
      <div class="no-data" id="no-data" hidden></div>
      <button type="button" class="scale-toggle" id="scale-toggle" aria-pressed="true" title="Switch the vertical axis between a symmetric log scale and a linear one">log</button>
    </div>
    <div class="under-chart">
      <div class="weekday" title="Each weekday over the days the chart shows: the average or the median of the days' values, or how many were up and down.">
        <div class="weekday-head">
          <span class="metric-name" id="weekday-name"></span>
          <div class="segmented" id="weekday-stat" role="group" aria-label="What the weekday bars show"></div>
        </div>
        <div id="weekday-chart"></div>
      </div>
      <div class="daily">
        <div class="daily-head">
          <span class="metric-name" id="daily-name" title="One bar a day, from the period's first day to its last. ⌘/Ctrl + scroll zooms this chart, ⌘/Ctrl + drag slides it; the period and the filters stay as they are. Every other week is shaded. Days the other filters leave out of the chart are pale. A hollow bar is not final yet: today so far, or the latest pre-market or after-hours price."></span>
        </div>
        <div id="daily-chart"></div>
      </div>
    </div>
  </div>
</div>

<script>
const EMBED = new URLSearchParams(location.search).get('embed') === 'widget';
if (EMBED) document.documentElement.classList.add('embed');
// Embedded, the widget's settings stand in for the saved ones (similar=1|0,
// trend=1|0, from=YYYY-MM-DD with the end at the latest day, log=1|0, linear
// unless set) and nothing is saved back, so the widget never changes how this
// page opens on its own.
const EMBED_QUERY = new URLSearchParams(location.search);
const EMBED_SIMILAR = EMBED && EMBED_QUERY.has('similar') ? EMBED_QUERY.get('similar') === '1' : null;
const EMBED_TREND = EMBED && EMBED_QUERY.has('trend') ? EMBED_QUERY.get('trend') === '1' : null;
const EMBED_FROM = EMBED ? EMBED_QUERY.get('from') : null;
const EMBED_LOG = EMBED ? EMBED_QUERY.get('log') === '1' : null;
// The desktop widget's local copy of this page reads the live site's files
// (?data=<site root>); everywhere else the data sits one folder up.
const DATA_ROOT = EMBED && EMBED_QUERY.get('data') ? EMBED_QUERY.get('data') : '../';
// The ticker the page shows, one of the site's funds (the quotes worker's
// SYMBOLS, scripts/update_intraday.py's TICKERS; tests/fund-lists.cjs holds
// the lists to each other): the one the address names (?ticker=SOXL, which is
// also how a page embedding this one asks for a fund), else TQQQ. The address
// is the only place it is kept, so a link always opens the fund it names and
// the site's "TQQQ intraday" link opens TQQQ. A name the list does not hold
// is ignored.
const TICKERS = ['TQQQ', 'QQQ', 'SPY', 'QLD', 'SSO', 'SPXL', 'SQQQ', 'GLD', 'SOXL', 'SOXX', 'SOXS'];
// How many times its index each fund moves in a day, with a minus for one that
// moves against it: the daily bars' fixed scale is sized by it (dailyDomain).
const TICKER_LEVERAGE = { TQQQ: 3, QQQ: 1, SPY: 1, QLD: 2, SSO: 2, SPXL: 3, SQQQ: -3, GLD: 1, SOXL: 3, SOXX: 1, SOXS: -3 };
const DEFAULT_TICKER = TICKERS[0];
const namedTicker = (EMBED_QUERY.get('ticker') || '').toUpperCase();
let ticker = TICKERS.includes(namedTicker) ? namedTicker : DEFAULT_TICKER;
let drawnTicker = null;   // the fund whose days the chart holds; null until a first load is in
// A fund's 5-minute history, one file a fund (scripts/update_intraday.py).
const historyUrl = fund => `${DATA_ROOT}data/intraday/${fund.toLowerCase()}-5m.tsv`;
// Today's session at 1-minute resolution from Yahoo (scripts/update_intraday_today.py).
// The 5-minute history comes from Alpaca, whose free plan holds back the
// latest 15 minutes; Yahoo serves the current minute, so today is drawn from
// this file and the history from the other. Absent until the first run of
// the day's pipeline, and stale (the last session) outside market days.
// With the quotes proxy's URL set (cloudflare/quotes, deployed to Cloudflare:
// 'https://tqqq-quotes.<account>.workers.dev'), today comes from the proxy
// instead, in the same layout, at most a minute old, polled every minute.
const QUOTES_PROXY = 'https://tqqq-quotes.infoicy.workers.dev';
// Without the proxy only TQQQ has a today file (scripts/update_intraday_today.py writes that one); another fund then draws no live session.
const todayUrl = fund => QUOTES_PROXY ? `${QUOTES_PROXY}/bars/${fund}?range=1d&interval=1m&format=tsv` : `${DATA_ROOT}data/intraday/${fund.toLowerCase()}-today-1m.tsv`;
const TODAY_BAR_MINUTES = 1;
const SESSION_OPEN_MIN = 9 * 60 + 30;
const SESSION_CLOSE_MIN = 16 * 60;
const BAR_MINUTES = 5;
// Closest two axis labels may sit, in px; only a short or narrow chart (the
// desktop widget's frame) ever drops labels for it.
const MIN_TICK_GAP_PX = 13;
const MIN_HOUR_GAP_PX = 40;
// Day lines are faint so 750 of them read as a fan; with few days shown the
// same opacity vanishes, so it scales up: 5% for hundreds of days, 35% for
// a dozen. The count is the days that pass the period and histogram filters,
// before the similar-days pick, so switching that pick on does not recolour
// the lines.
const DAY_OPACITY_MIN = 0.05, DAY_OPACITY_MAX = 0.35, DAY_OPACITY_SCALE = 4;
const dayOpacity = count => Math.min(DAY_OPACITY_MAX, Math.max(DAY_OPACITY_MIN, DAY_OPACITY_SCALE / Math.max(1, count)));
// Symlog is linear inside a band around zero and logarithmic beyond it, so the
// crowded region gets room while big days still fit. A plain log scale cannot
// hold zero or negative moves. Ticks come from this ladder, starting at the
// band edge where the log part begins.
const NICE_PCT_LADDER = [0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50];

const MARKET_TZ = 'America/New_York';
const LOCAL_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const MINUTES_PER_DAY = 24 * 60;

const parseStamp = d3.timeParse('%m/%d/%Y %H:%M:%S');
const fmtPct = (d, decimals = 2) => (d > 0 ? '+' : '') + d.toFixed(decimals) + '%';
const fmtAxisPct = d => (d > 0 ? '+' : '') + parseFloat(d.toFixed(2)) + '%';
// A move's tone. One that prints as 0.00% is flat, neither up nor down.
const FLAT_PCT = 0.005;
const toneOf = pct => pct > FLAT_PCT ? 'up' : pct < -FLAT_PCT ? 'down' : 'flat';
// A move and the price behind it, as the today and extended-hours labels read
// it: "+1.3% ($51.10)", the percent toned by its sign, at one decimal like the
// site's day-change badges and the signal chart's price rows, which show the
// same move beside this chart in the desktop widget.
const moveHtml = (pct, price) => {
  const tone = pct > 0 ? 'up' : pct < 0 ? 'down' : '';
  const priced = price > 0 ? ` ($${price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })})` : '';
  return `<tspan class="${tone}">${fmtPct(pct, 1)}</tspan>${priced}`;
};
const fmtClock = minutes => {
  const wrapped = ((minutes % MINUTES_PER_DAY) + MINUTES_PER_DAY) % MINUTES_PER_DAY;
  const h = Math.floor(wrapped / 60), m = wrapped % 60;
  return `${h}:${String(m).padStart(2, '0')}`;
};

// Wall-clock minutes since midnight for an instant in a given zone.
function minutesOfDayIn(timeZone, date) {
  const parts = new Intl.DateTimeFormat('en-US', { timeZone, hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(date);
  const get = type => +parts.find(p => p.type === type).value;
  return (get('hour') % 24) * 60 + get('minute');
}

// Minutes to add to a New York time to get the viewer's local time, measured
// today so daylight-saving rules on both sides are the current ones.
function localOffsetFromMarket() {
  const now = new Date();
  let diff = minutesOfDayIn(LOCAL_TZ, now) - minutesOfDayIn(MARKET_TZ, now);
  if (diff > MINUTES_PER_DAY / 2) diff -= MINUTES_PER_DAY;
  if (diff <= -MINUTES_PER_DAY / 2) diff += MINUTES_PER_DAY;
  return diff;
}

// The current New York minute of day, or null outside a weekday session.
// Exchange holidays are not known here, so a holiday shows as open.
function marketMinuteNow() {
  const now = new Date();
  const weekday = new Intl.DateTimeFormat('en-US', { timeZone: MARKET_TZ, weekday: 'short' }).format(now);
  if (weekday === 'Sat' || weekday === 'Sun') return null;
  const minute = minutesOfDayIn(MARKET_TZ, now);
  return minute >= SESSION_OPEN_MIN && minute <= SESSION_CLOSE_MIN ? minute : null;
}

const NOW_REFRESH_MS = 30 * 1000;

// Is this day today's session, with the market open right now? Only then is
// it drawn on its own layer; otherwise it is one line among the others.
const liveMarketDate = () => marketMinuteNow() !== null ? marketDateNow() : null;   // the date of the session open right now, or null
const isLiveDay = day => fmtIsoDay(day.date) === liveMarketDate();
const NOW_TICK_SHARE = 0.05;             // the "now" tick spans this share of the plot height, from the top
const LINE_LABEL_MIN_GAP = 13;           // px between the mean and median end labels
// A label set beside its dot (today's, an extended-hours print's): its 11px
// type above and under the baseline, for the box the callouts keep clear of.
const PLACED_LABEL_RISE = 9, PLACED_LABEL_DROP = 3;
const HOVER_LABEL_GAP = 14;              // px between stacked crosshair value labels
const HOVER_LABEL_ROOM = 150;            // px from the right edge inside which hover labels flip to the left
const HOVER_END_HEIGHT = 26;             // px the two-line end label needs
const RANGE_BADGE_H = 16;                // px a range badge's pill stands, and the gap between stacked ones
const HOVER_END_CLEARANCE = 20;          // px the end label keeps from the mean / median names

// Calendar date in New York, as the data's day timestamps are midnight ET.
const marketDateOf = date => new Intl.DateTimeFormat('en-CA', { timeZone: MARKET_TZ }).format(date);   // "2026-11-23", the day in New York
const marketDateNow = () => marketDateOf(new Date());

const shortZoneName = timeZone =>
  new Intl.DateTimeFormat('en-US', { timeZone, timeZoneName: 'short' }).formatToParts(new Date())
    .find(p => p.type === 'timeZoneName').value;

// One row per 5-minute bar -> one series per trading day. Every point is the
// % change of that bar's close against the PREVIOUS session's close, the
// basis a quote screen uses, so a day starts at its opening gap rather than
// at zero and the 0% line is where yesterday closed. The first day in the
// file has no previous close and is dropped. A day also keeps its five
// prices (`prices`: the previous close, its open, low, high and close), which
// the bars under the chart measure against each other (DAY_MEASURES); the
// low and the high are the session bars' own, from the High and Low columns.
// A ten-year file is about 195,000 rows, and the page reads the data again
// every minute: a day's rows are told by the Date column's own "M/D/YYYY"
// prefix and a bar's minute is read off its "HH:MM" text, so only one stamp a
// day goes through the date parser (parsing every row three times took half a
// second on ten years, measured 2026-11-25).
function buildDays(rows) {
  const minuteOfDay = (stamp) => { const [hours, minutes] = stamp.slice(stamp.indexOf(' ') + 1).split(':'); return +hours * 60 + +minutes; };
  const sessions = d3.sort(d3.groups(rows, dayOf).map(([, bars]) => {
    const date = d3.timeDay.floor(parseStamp(bars[0].Date));
    const sorted = d3.sort(bars.map(r => ({ row: r, opens: minuteOfDay(r.Date) })), bar => bar.opens);
    return {
      id: date.getTime(),
      date,
      open: +sorted[0].row.Open,
      low: d3.min(sorted, bar => +bar.row.Low),
      high: d3.max(sorted, bar => +bar.row.High),
      // A bar's minute is its END, so a 5-minute bar opening 09:30 lands on
      // 09:35 and a 1-minute bar opening 09:34 on the same 09:35; the two
      // resolutions share the minute grid the aggregates and matching use.
      bars: sorted.map(({ row, opens }) => ({ minute: opens + (row.barMinutes || BAR_MINUTES), close: +row.Close })),
    };
  }), d => d.date);
  return sessions.slice(1).map((day, i) => {
    const prevClose = sessions[i].bars[sessions[i].bars.length - 1].close;
    const pct = price => (price / prevClose - 1) * 100;
    const points = [{ minute: SESSION_OPEN_MIN, pct: pct(day.open), close: day.open }].concat(day.bars.map(b => ({ minute: b.minute, pct: pct(b.close), close: b.close })));   // close: the price behind the point, for today's label
    const last = points[points.length - 1];
    return {
      id: day.id,
      date: day.date,
      points,
      openVsPrevPct: points[0].pct,
      closeVsPrevPct: last.pct,
      close: last.close,
      prices: { prev: prevClose, open: day.open, low: day.low, high: day.high, close: last.close },
      complete: last.minute === SESSION_CLOSE_MIN,
    };
  });
}

// The market state a day opened in, read off the closes before it, so it is
// known before the open:
//   trend       'up' when the prior close is above the average of the
//               TREND_DAYS closes before it, else 'down';
//   volatility  the average absolute close-to-close move over the
//               VOLATILITY_DAYS sessions before, sorted into thirds of every
//               day in the file: 'low', 'mid' or 'high'.
// A day without enough days before it has no state (null).
const TREND_DAYS = 50;
const VOLATILITY_DAYS = 20;
function withMarketState(days) {
  const usualMove = days.map((_, k) => k < VOLATILITY_DAYS ? null : d3.mean(days.slice(k - VOLATILITY_DAYS, k), d => Math.abs(d.closeVsPrevPct)));
  const known = d3.sort(usualMove.filter(v => v !== null));
  const lowUnder = d3.quantileSorted(known, 1 / 3), highFrom = d3.quantileSorted(known, 2 / 3);
  return days.map((day, k) => ({
    ...day,
    marketState: k < TREND_DAYS + 1 ? null : {
      trend: days[k - 1].close > d3.mean(days.slice(k - 1 - TREND_DAYS, k - 1), d => d.close) ? 'up' : 'down',
      volatility: usualMove[k] >= highFrom ? 'high' : usualMove[k] < lowUnder ? 'low' : 'mid',
    },
  }));
}

// Same-trend filter: the days that opened in the reference day's market
// state. The reference is the latest day, as for the similar-days filter.
function sameTrendDays(days, reference) {
  const { trend, volatility } = reference.marketState;
  return days.filter(d => d === reference || (d.marketState && d.marketState.trend === trend && d.marketState.volatility === volatility));
}

// A day's % by minute, made on first use and kept on the day: every move of
// the period slider reads it for each day on the chart.
const pctByMinute = day => day.byMinute || (day.byMinute = new Map(day.points.map(p => [p.minute, p.pct])));

// Mean and median of every day's % at each minute of the session.
function buildAggregates(days) {
  const minutes = d3.range(SESSION_OPEN_MIN, SESSION_CLOSE_MIN + 1, BAR_MINUTES);
  const byMinute = days.map(pctByMinute);
  return minutes.map(minute => {
    const values = byMinute.map(m => m.get(minute)).filter(v => v !== undefined);
    return {
      minute,
      mean: d3.mean(values),
      median: d3.median(values),
      positiveShare: d3.mean(values, v => v > 0 ? 1 : 0),
      n: values.length,
    };
  });
}

// Each rule picks one minute of the session for its own reason. Rules of the
// same kind that land on the same minute merge into one label.
// Label text is two tokens per rule: what was measured and its value. The
// Buy/Sell title already says which extreme it is.
const ANNOTATION_RULES = [
  { kind: 'buy',  anchor: 'mean',   pick: a => d3.least(a, d => d.mean),              label: d => `mean ${fmtPct(d.mean)}` },
  { kind: 'buy',  anchor: 'median', pick: a => d3.least(a, d => d.median),            label: d => `median ${fmtPct(d.median)}` },
  { kind: 'sell', anchor: 'mean',   pick: a => d3.greatest(a, d => d.mean),           label: d => `mean ${fmtPct(d.mean)}` },
  { kind: 'sell', anchor: 'median', pick: a => d3.greatest(a, d => d.median),         label: d => `median ${fmtPct(d.median)}` },
];

// Label geometry. Labels are LABEL_WIDTH wide; their height depends on how
// many lines the text wraps to. A stacked label sits LABEL_PADDING past the
// connector's horizontal leg ("gutter"), GUTTER_BASE from the point on the
// first level and one label step further out per level. A side label sits
// beside its point, centred on it, with only a horizontal leg.
const LABEL_WIDTH = 120, LABEL_LEAD = 24, LABEL_PADDING = 6, LABEL_CLEARANCE = 6;
const LABEL_LINE_HEIGHT = 12, LABEL_CHROME = 9, LABEL_CHARS_PER_LINE = 17;
const GUTTER_BASE = 40, LEVEL_STEP = 60, MAX_LEVELS = 4;
const SIDE_COST = 1.5 * LEVEL_STEP;       // beside the point: after the first stacked level, before the second
const SIDE_FLIP_COST = 2 * LEVEL_STEP;    // the wrong side of the line costs two levels
const ROUTE_BEND_COST = 10;               // slight preference for dropping first
const SEARCH_CANDIDATES = 24, SEARCH_BUDGET = 20000;   // per-label spots kept for the search, and how many steps it may take

// Title line plus however many lines the reasons wrap to.
const labelHeight = p => LABEL_CHROME + LABEL_LINE_HEIGHT * (1 + Math.ceil(p.reasons.join(', ').length / LABEL_CHARS_PER_LINE));

// Places every label as close to its point as it can, all at once. Each
// label wants to sit just past its point on the first stacked level of its
// preferred side. Candidates are: every stacked level on either side, crossed
// with a few horizontal spots (the preferred one, the near side of the point,
// just past each placed box); plus a side spot on either side of the point.
// They are ranked cheapest first: levels out, then pixels sideways, then the
// side spot, then the wrong side of the line. A spot is valid when its box
// stays inside the plot, does not sit on the highlighted line, neither its
// box nor its connector touches any other label's box or connector, and
// neither touches a text already on the plot (`taken`, their boxes: today's
// label and an extended-hours print's).
//
// A bounded depth-first search assigns every label a valid spot, trying
// cheaper spots first and backing up when a later label is boxed in by an
// earlier choice. If the search runs out of budget, a greedy pass places the
// labels one by one, relaxing the constraints in order (off the texts, off
// the line, then clear of others, then inside the plot) and taking the
// cheapest spot as a last resort.
function layoutLabels(points, x, yOf, sideOf, chartWidth, chartHeight, lineHits, taken) {
  const C = LABEL_CLEARANCE;
  const overlaps = (a, b) => a.left < b.right + C && b.left < a.right + C && a.top < b.bottom + C && b.top < a.bottom + C;
  const segHits = (seg, box) => seg.x1 < box.right + C && box.left - C < seg.x2 && seg.y1 < box.bottom + C && box.top - C < seg.y2;
  // Two ways to route the L from the point to the box's near corner: drop
  // first (down from the point, then across at the gutter) or leg first
  // (across at the point's height, then down at the box's edge). The second
  // gets past a box that sits directly under the point.
  const stacked = (px, py, h, sign, level, left, route) => {
    const gutterY = py + sign * (GUTTER_BASE + level * LEVEL_STEP);
    const top = sign > 0 ? gutterY + LABEL_PADDING : gutterY - LABEL_PADDING - h;
    const dropX = route === 'dropFirst' ? px : left;
    const legY = route === 'dropFirst' ? gutterY : py;
    return {
      mode: 'stacked', route, dx: left - px, dy: gutterY - py,
      box: { left, right: left + LABEL_WIDTH, top, bottom: top + h },
      drop: { x1: dropX, x2: dropX, y1: Math.min(py, gutterY), y2: Math.max(py, gutterY) },
      leg: { x1: Math.min(px, left), x2: Math.max(px, left), y1: legY, y2: legY },
    };
  };
  const beside = (px, py, h, dir) => {
    const left = dir > 0 ? px + LABEL_LEAD + LABEL_PADDING : px - LABEL_LEAD - LABEL_PADDING - LABEL_WIDTH;
    return {
      mode: 'side', dx: dir * LABEL_LEAD, dy: 0,
      box: { left, right: left + LABEL_WIDTH, top: py - h / 2, bottom: py + h / 2 },
      drop: { x1: px, x2: px, y1: py, y2: py },
      leg: { x1: Math.min(px, px + dir * LABEL_LEAD), x2: Math.max(px, px + dir * LABEL_LEAD), y1: py, y2: py },
    };
  };
  const clearOf = (g, others) => others.every(o =>
    !overlaps(g.box, o.box) && !segHits(g.drop, o.box) && !segHits(g.leg, o.box) && !segHits(o.drop, g.box) && !segHits(o.leg, g.box));
  const inside = g => g.box.top >= 0 && g.box.bottom <= chartHeight && g.box.left >= 0 && g.box.right <= chartWidth;
  const offLine = g => !lineHits(g.box);
  const offTexts = g => taken.every(box => !overlaps(g.box, box) && !segHits(g.drop, box) && !segHits(g.leg, box));

  // Every candidate spot for a point, cheapest first. extraLefts lets the
  // greedy pass add spots just past boxes it has already placed.
  const candidatesFor = (p, extraLefts = []) => {
    const px = x(p.minute), py = yOf(p), h = labelHeight(p);
    const preferredSide = sideOf(p);
    const preferredLeft = px + LABEL_LEAD + LABEL_WIDTH <= chartWidth ? px + LABEL_LEAD : px - LABEL_LEAD - LABEL_WIDTH;
    const fits = l => l >= 0 && l + LABEL_WIDTH <= chartWidth;
    const besidePoint = [preferredLeft, px - LABEL_LEAD - LABEL_WIDTH]
      .concat(extraLefts)
      .concat(d3.range(1, 4).flatMap(k => [px + LABEL_LEAD + k * (LABEL_WIDTH + C), px - LABEL_LEAD - (k + 1) * LABEL_WIDTH - k * C]))
      .filter(fits);
    // On a plot too narrow for a label and its lead on either side of the
    // point (a phone's, under 290px), no spot beside the point is inside it:
    // the label then goes flush with an edge of the plot, over or under the point.
    const lefts = besidePoint.length ? besidePoint : [0, chartWidth - LABEL_WIDTH].filter(fits);
    const candidates = [preferredSide, -preferredSide].flatMap(sign =>
      d3.range(MAX_LEVELS).flatMap(level => lefts.flatMap(left => ['dropFirst', 'legFirst'].map(route => ({
        g: stacked(px, py, h, sign, level, left, route),
        cost: level * LEVEL_STEP + Math.abs(left - preferredLeft) + (sign === preferredSide ? 0 : SIDE_FLIP_COST) + (route === 'legFirst' ? ROUTE_BEND_COST : 0),
      })))))
      .concat([1, -1].map(dir => ({ g: beside(px, py, h, dir), cost: SIDE_COST + (dir > 0 ? 0 : LABEL_WIDTH) })));
    return d3.sort(candidates, c => c.cost).map(c => c.g);
  };

  // Search: valid spots only, cheapest first, backing up when stuck.
  const valid = points.map(p => candidatesFor(p).filter(g => inside(g) && offLine(g) && offTexts(g)).slice(0, SEARCH_CANDIDATES));
  const chosen = [];
  let budget = SEARCH_BUDGET;
  const search = i => {
    if (i === points.length) return true;
    for (const g of valid[i]) {
      if (--budget < 0) return false;
      if (!clearOf(g, chosen)) continue;
      chosen.push(g);
      if (search(i + 1)) return true;
      chosen.pop();
    }
    return false;
  };
  if (search(0)) return points.map((p, i) => ({ p, ...chosen[i] }));

  // Greedy fallback with relaxed constraints.
  const placed = [];
  return points.map(p => {
    const ordered = candidatesFor(p, placed.map(o => o.box.right + C));
    const pick = ordered.find(g => inside(g) && clearOf(g, placed) && offLine(g) && offTexts(g))
      || ordered.find(g => inside(g) && clearOf(g, placed) && offLine(g))
      || ordered.find(g => inside(g) && clearOf(g, placed))
      || ordered.find(g => inside(g))
      || ordered[0];
    placed.push(pick);
    return { p, ...pick };
  });
}

// Does the segment from a to b pass through the box? Liang–Barsky clipping
// of the segment against the box's four edges.
function segmentHitsBox(a, b, box) {
  const dx = b.x - a.x, dy = b.y - a.y;
  let t0 = 0, t1 = 1;
  const edges = [[-dx, a.x - box.left], [dx, box.right - a.x], [-dy, a.y - box.top], [dy, box.bottom - a.y]];
  for (const [p, q] of edges) {
    if (p === 0) { if (q < 0) return false; continue; }
    const t = q / p;
    if (p < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
    else { if (t < t0) return false; if (t < t1) t1 = t; }
  }
  return true;
}

function buildAnnotationPoints(aggregates) {
  const picks = ANNOTATION_RULES.map(rule => ({ rule, agg: rule.pick(aggregates) }));
  return d3.groups(picks, p => `${p.rule.kind}@${p.agg.minute}`).map(([id, group]) => ({
    id,
    minute: group[0].agg.minute,
    kind: group[0].rule.kind,
    anchor: group[0].rule.anchor,
    agg: group[0].agg,
    reasons: group.map(p => p.rule.label(p.agg)),
  }));
}

// Recency-weighted distance between two equal-length % paths: the root mean
// square gap, with weights ramping linearly so the latest bar counts
// RECENCY_WEIGHT times the first. Small means the lines sit on top of each
// other, which is what "looks like today" means on this chart: same level
// above or below the open, same size of moves, same timing. Shape-only
// measures (correlation of levels or of 5-minute changes) were tried and
// ranked days ending 2% away from today near the top.
const RECENCY_WEIGHT = 3;
function weightedDistance(a, b) {
  const n = a.length;
  const w = a.map((_, i) => 1 + (n > 1 ? i / (n - 1) : 0) * (RECENCY_WEIGHT - 1));
  return Math.sqrt(d3.sum(a, (v, i) => w[i] * (v - b[i]) ** 2) / d3.sum(w));
}

// Similar-days filter. The reference is the latest day, which during a
// session is today so far. Its path is compared with every other day's over
// the same minutes by weighted distance and the closest KEEP_SHARE of them
// is kept (at least one day). A day missing any of those minutes (a half
// session shorter than the reference) is left out.
const KEEP_SHARE = 0.08;
function similarDays(days, reference) {
  const refByMinute = pctByMinute(reference);
  const cutoff = reference.points[reference.points.length - 1].minute;
  const minutes = d3.range(SESSION_OPEN_MIN, cutoff + 1, BAR_MINUTES);   // the open, now a real value, takes part
  const refSeries = minutes.map(m => refByMinute.get(m));
  const scored = days
    .filter(d => d !== reference)
    .map(d => {
      const byMinute = pctByMinute(d);
      if (!minutes.every(m => byMinute.has(m))) return null;
      return { day: d, distance: weightedDistance(refSeries, minutes.map(m => byMinute.get(m))) };
    })
    .filter(Boolean);
  const keepCount = Math.max(1, Math.round(scored.length * KEEP_SHARE));
  const kept = d3.sort(scored, d => d.distance).slice(0, keepCount).map(d => d.day);
  return { days: d3.sort([reference, ...kept], d => d.date), cutoff };
}

// What the page's charts share (the reusable-chart convention,
// .claude/skills/d3-charts): one state object with a chainable getter/setter
// per key, the _add() enter/exit/update helper, a width that follows the
// container, and the svg with its margin-shifted plot group.
class ChartBase {
  constructor(attrs) {
    this.getState = () => attrs;
    this.setState = d => Object.assign(attrs, d);
    Object.keys(attrs).forEach(key => {
      this[key] = function (_) {
        if (!arguments.length) return attrs[key];
        attrs[key] = _;
        return this;
      };
    });
    this.initializeEnterExitUpdatePattern();
  }

  calculateProperties() {
    const { marginLeft, marginTop, marginRight, marginBottom, svgWidth, svgHeight } = this.getState();
    const calc = { chartLeftMargin: marginLeft, chartTopMargin: marginTop };
    const chartWidth = svgWidth - marginRight - marginLeft;
    const chartHeight = svgHeight - marginBottom - marginTop;
    this.setState({ calc, chartWidth, chartHeight });
  }

  drawSvgAndWrappers() {
    const { d3Container, svgWidth, svgHeight, defaultFont, calc } = this.getState();
    const svg = d3Container._add('svg.svg-container')
      .attr('width', svgWidth)
      .attr('height', svgHeight)
      .attr('font-family', defaultFont);
    const chart = svg._add('g.chart')
      .attr('transform', `translate(${calc.chartLeftMargin},${calc.chartTopMargin})`);
    this.setState({ chart, svg });
  }

  initializeEnterExitUpdatePattern() {
    d3.selection.prototype._add = function (classSelector, data, params) {
      const container = this;
      const split = classSelector.split('.');
      const elementTag = split[0];
      const className = split[1] || 'not-good';
      const exitTransition = params?.exitTransition;
      const enterTransition = params?.enterTransition;

      let bindData = data;
      if (typeof data === 'function') bindData = data(container.datum());
      if (bindData && !Array.isArray(bindData)) bindData = [bindData];
      if (!bindData) bindData = container.datum() ? d => [d] : [className];

      let selection = container.selectAll(elementTag + '.' + className).data(bindData, (d, i) => {
        if (typeof d === 'object' && d.id) return d.id;
        return i;
      });
      if (exitTransition) exitTransition(selection); else selection.exit().remove();
      const enterSelection = selection.enter().append(elementTag);
      if (enterTransition) enterTransition(enterSelection);
      selection = enterSelection.merge(selection);
      selection.attr('class', className);
      if (className === 'not-good') {
        selection.attr('stroke', 'red').attr('stroke-width', 10);
        selection.selectAll('title').data(['not-good']).join('title').text("You don't have a class set for this element!");
      }
      return selection;
    };
  }

  setDynamicContainer() {
    const attrs = this.getState();
    const d3Container = d3.select(attrs.container);
    const containerRect = d3Container.node().getBoundingClientRect();
    if (containerRect.width > 0) attrs.svgWidth = containerRect.width;
    const self = this;
    d3.select(window).on('resize.' + attrs.id, function () {
      const rect = d3Container.node().getBoundingClientRect();
      if (rect.width > 0) attrs.svgWidth = rect.width;
      self.render();
    });
    this.setState({ d3Container });
  }
}

class IntradayOverlayChart extends ChartBase {
  constructor() {
    super({
      id: 'ID' + Math.floor(Math.random() * 1000000),
      svgWidth: 400,
      svgHeight: 600,
      marginTop: 8,
      marginBottom: 50,         // axis labels, then a row for the log toggle beneath them
      marginRight: 108,         // the label gutter: set from labelGutter on every render, or kept as set when that is null
      marginLeft: 52,
      // The gutter right of the plot: the mean / median names at the line ends
      // and, from `full` px, the hovered day's date beside them (in a narrower
      // one the date moves in over the plot's end, drawHover). It takes `share`
      // of the chart's width, so it is `full` on a chart 600px wide and up, and
      // never under `names`, what the two names need at the page's 10.5px type.
      // A fixed 108px left a phone's 300px chart a plot under half its width
      // (the user, 2026-11-25: "why are we displaying only half of the chart here").
      labelGutter: { full: 108, names: 48, share: 0.18 },
      container: 'body',
      defaultFont: 'inherit',
      data: null,
      aggregates: null,
      chartWidth: null,
      chartHeight: null,
      firstRender: true,
      yScaleType: 'symlog',
      symlogLinearPct: 0.1,
      yLimit: null,             // fixed |%| extent of the y-axis, set once from all days so filtering never rescales
      minuteOffset: 0,          // added to New York minutes for axis and readout labels
      zoneLabel: 'ET',
      referenceId: null,        // day drawn as the reference when the similar-days filter is on
      matchCutoff: null,        // last matched minute; shades the window when set
      todayId: null,            // the latest day in the file, drawn on its own layer on top
      opacityCount: null,       // days the opacity is tuned for; defaults to the days drawn
      extended: null,           // the latest pre-market or after-hours print { session, price, changePct }, pulsing at the start outside the session
      // A dragged range (drawHover): the bar pressed on while the button is
      // held, the span on screen { a, b, dayId } in minutes, and that span
      // once Shift at release keeps it, redrawn by every render until it clears.
      rangeAnchor: null,
      rangeShown: null,
      rangePinned: null,
    });
  }

  render() {
    this.setDynamicContainer();
    this.fitLabelGutter();
    this.calculateProperties();
    this.drawSvgAndWrappers();
    this.drawScales();
    this.drawAxes();
    this.drawDays();
    this.drawAggregates();
    this.drawNow();
    // The callouts' layer, made here so it stays under today's line. The
    // callouts go in last: they are laid out clear of the two labels drawn
    // after this (today's, an extended-hours print's).
    this.getState().chart._add('g.annotations');
    this.drawToday();
    this.drawExtended();
    this.drawAnnotations();
    this.drawHover();
    this.setState({ firstRender: false });
    return this;
  }

  fitLabelGutter() {
    const { labelGutter, svgWidth } = this.getState();
    if (!labelGutter) return;
    const { full, names, share } = labelGutter;
    this.setState({ marginRight: Math.round(Math.max(names, Math.min(full, share * svgWidth))) });
  }

  drawScales() {
    const { data, chartWidth, chartHeight, yScaleType, symlogLinearPct } = this.getState();
    const allPct = data.flatMap(d => d.points.map(p => p.pct));
    const x = d3.scaleLinear().domain([SESSION_OPEN_MIN, SESSION_CLOSE_MIN]).range([0, chartWidth]);
    // Log: a fixed, symmetric extent from all days, so filtering never
    // rescales. Linear: the extent of the days on screen, since on a linear
    // axis the file's full range would flatten a quiet selection.
    const [lo, hi] = d3.extent(allPct);
    const limit = this.getState().yLimit || Math.ceil(Math.max(-lo, hi));
    const y = yScaleType === 'symlog'
      ? d3.scaleSymlog().constant(symlogLinearPct).domain([-limit, limit]).range([chartHeight, 0])
      : d3.scaleLinear().domain([Math.min(0, lo), Math.max(0, hi)]).nice(8).range([chartHeight, 0]);
    const ladder = yScaleType === 'symlog'
      ? [0].concat(NICE_PCT_LADDER.filter(t => t >= symlogLinearPct && t <= limit).flatMap(t => [t, -t]))
      : y.ticks(8);
    // On a short chart (the desktop widget's frame) neighbouring labels would
    // overlap; walking out from 0, a tick too close to one already kept is dropped.
    const yTicks = [];
    for (const t of [...ladder].sort((a, b) => Math.abs(a) - Math.abs(b))) {
      if (yTicks.every(k => Math.abs(y(k) - y(t)) >= MIN_TICK_GAP_PX)) yTicks.push(t);
    }
    const line = d3.line().x(p => x(p.minute)).y(p => y(p.pct));
    // What a day's line stands on: while it is the same, so is the line's text (drawDays).
    const lineKey = [yScaleType, symlogLinearPct, x.range(), y.domain(), y.range()].join('|');
    this.setState({ x, y, yTicks, line, lineKey });
  }

  drawAxes() {
    const { chart, x, y, yTicks, chartWidth, chartHeight, minuteOffset } = this.getState();
    const isWholeHour = m => ((m + minuteOffset) % 60 + 60) % 60 === 0;
    const hourTicks = [SESSION_OPEN_MIN];
    for (const m of d3.range(SESSION_OPEN_MIN + 1, SESSION_CLOSE_MIN).filter(isWholeHour).concat(SESSION_CLOSE_MIN)) {
      if (x(m) - x(hourTicks[hourTicks.length - 1]) >= MIN_HOUR_GAP_PX) hourTicks.push(m);
      else if (m === SESSION_CLOSE_MIN) hourTicks[hourTicks.length - 1] = m;   // the close outranks the hour before it
    }
    const fmtTick = m => fmtClock(m + minuteOffset);

    chart._add('g.grid')
      .call(d3.axisLeft(y).tickValues(yTicks).tickSize(-chartWidth).tickFormat(''))
      .call(g => g.select('.domain').remove());

    chart._add('g.x-axis').classed('axis', true)
      .attr('transform', `translate(0,${chartHeight})`)
      .call(d3.axisBottom(x).tickValues(hourTicks).tickFormat(fmtTick).tickSizeOuter(0));

    chart._add('g.y-axis').classed('axis', true)
      .call(d3.axisLeft(y).tickValues(yTicks).tickFormat(fmtAxisPct).tickSizeOuter(0));

    chart._add('line.zero')
      .attr('x1', 0).attr('x2', chartWidth)
      .attr('y1', y(0)).attr('y2', y(0));
  }

  drawDays() {
    const { chart, data, line, referenceId, matchCutoff, x, chartHeight } = this.getState();
    chart._add('g.match')._add('rect.match-window')
      .attr('x', x(SESSION_OPEN_MIN)).attr('y', 0)
      .attr('width', matchCutoff === null ? 0 : x(matchCutoff) - x(SESSION_OPEN_MIN))
      .attr('height', chartHeight);
    const { todayId, opacityCount } = this.getState();
    const today = data.find(d => d.id === todayId);
    const live = today && isLiveDay(today);
    const faint = live ? data.filter(d => d.id !== todayId) : data;
    const opacity = dayOpacity(opacityCount ?? faint.length);
    // The similar-days reference is only picked out while the session is
    // live; after the close the latest day looks like any other.
    const highlighted = d => live && d.id === referenceId;
    // A step of the period slider redraws the chart with nearly every day as it
    // was: a day's line is worked out once for the scales in use and kept on
    // the day, and written to its path only when it is not there already.
    const { lineKey } = this.getState();
    const lineOf = d => { if (!d.line || d.line.key !== lineKey) d.line = { key: lineKey, text: line(d.points) }; return d.line.text; };
    chart._add('g.days')._add('path.day-path', faint)
      .each(function (d) { const text = lineOf(d); if (this.__line !== text) { this.setAttribute('d', text); this.__line = text; } })
      .classed('reference', highlighted)
      .style('opacity', d => highlighted(d) ? 1 : opacity);
  }

  // Today's path on its own layer above the aggregates and labels. The line
  // draws itself in on the first render; the ring pulses while the session
  // is open, and rests as a plain dot after the close.
  drawToday() {
    const { chart, data, line, x, y, chartWidth, todayId, firstRender } = this.getState();
    const today = data.find(d => d.id === todayId);
    const live = today && isLiveDay(today);
    const g = chart._add('g.today').style('display', live ? null : 'none');
    this.setState({ todayLabelBox: null });
    if (!live) return;
    const last = today.points[today.points.length - 1];
    const d = line(today.points);
    g._add('path.today-glow').attr('d', d);
    const path = g._add('path.today-path').attr('d', d);
    if (firstRender) {
      const length = path.node().getTotalLength();
      path.attr('stroke-dasharray', `${length} ${length}`).attr('stroke-dashoffset', length)
        .transition().duration(900).ease(d3.easeCubicOut).attr('stroke-dashoffset', 0)
        .on('end', () => path.attr('stroke-dasharray', null).attr('stroke-dashoffset', null));
    }
    const cx = x(last.minute), cy = y(last.pct);
    this.drawPulse(g, cx, cy);
    const nearRightEdge = cx > chartWidth - 180;
    // Today's change vs the previous close and the price itself, beside the dot.
    const label = g._add('text.today-label').attr('text-anchor', nearRightEdge ? 'end' : 'start')
      .html(`today ${moveHtml(last.pct, last.close)}`);
    this.setState({ todayLabelBox: this.placeLabel(label, cx, cy, nearRightEdge, today.points) });
  }

  // A dot with two rings pulsing out of it: today's last bar while the
  // session is open, an extended-hours print at the start outside it. The
  // rings group always exists and its circles are joined to two items, so an
  // empty join never has to chain off an empty selection.
  drawPulse(g, cx, cy) {
    g._add('g.pulse-rings').attr('transform', `translate(${cx},${cy})`)
      ._add('circle.pulse-ring', [0, 1]).attr('r', 5).classed('second', k => k === 1);
    g._add('circle.pulse-dot').attr('cx', cx).attr('cy', cy).attr('r', 4);
  }

  // Sets a label beside its dot. Below it by default; when the lines run
  // through that band over the label's width (near the right edge the label
  // sits over the line's last stretch), above the dot instead, and past the
  // lines when both bands are taken. `points` is the drawn line the dot ends;
  // the mean and median count everywhere.
  placeLabel(label, cx, cy, nearRightEdge, points) {
    const { x, y, aggregates } = this.getState();
    const labelW = label.node().getComputedTextLength(), lx = cx + (nearRightEdge ? -10 : 10);
    const x0 = nearRightEdge ? lx - labelW : lx, x1 = x0 + labelW;
    const ys = [];
    for (const p of points) { const px = x(p.minute); if (px >= x0 - 8 && px <= x1 + 8) ys.push(y(p.pct)); }
    for (const a of aggregates || []) { const px = x(a.minute); if (px >= x0 - 8 && px <= x1 + 8) { ys.push(y(a.mean)); ys.push(y(a.median)); } }
    const clear = (top, bottom) => !ys.some(v => v >= top - 7 && v <= bottom + 7);   // 7px: the glow's half width and a margin
    let ly = cy + 18;                                   // the band cy+8 .. cy+24
    if (!clear(cy + 8, cy + 24)) {
      if (clear(cy - 24, cy - 8)) ly = cy - 10;
      else { const lo = Math.max(...ys), hi = Math.min(...ys); ly = lo - cy <= cy - hi ? lo + 22 : hi - 14; }
    }
    label.attr('x', lx).attr('y', ly);
    return { left: x0, right: x1, top: ly - PLACED_LABEL_RISE, bottom: ly + PLACED_LABEL_DROP };
  }

  // Outside the regular session the proxy's quote for the ticker carries the latest
  // pre-market or after-hours print (cloudflare/quotes/README.md). Its change
  // against the close is where the next session's line will start, so it
  // pulses at the chart's start on the axis, its label beside it (the user,
  // 2026-11-06). Nothing while the session runs: the chart is live then.
  drawExtended() {
    const { chart, extended, x, y, chartHeight } = this.getState();
    const g = chart._add('g.extended').style('display', extended ? null : 'none');
    this.setState({ extendedLabelBox: null });
    if (!extended) return;
    const cx = x(SESSION_OPEN_MIN), cy = Math.max(0, Math.min(chartHeight, y(extended.changePct)));
    this.drawPulse(g, cx, cy);
    const label = g._add('text.extended-label').attr('text-anchor', 'start')
      .html(`${EXTENDED_SESSION_NAMES[extended.session]} ${moveHtml(extended.changePct, extended.price)}`);
    this.setState({ extendedLabelBox: this.placeLabel(label, cx, cy, false, []) });
  }

  drawAggregates() {
    const { chart, aggregates, x, y } = this.getState();
    const meanLine = d3.line().x(a => x(a.minute)).y(a => y(a.mean));
    const medianLine = d3.line().x(a => x(a.minute)).y(a => y(a.median));
    const g = chart._add('g.aggregates');
    g._add('path.median-path').attr('d', medianLine(aggregates));
    g._add('path.mean-path').attr('d', meanLine(aggregates));

    // Name each line at its right-hand end instead of a legend. When the two
    // end within a label's height of each other, push them apart.
    const last = aggregates[aggregates.length - 1];
    const labels = [
      { id: 'mean', text: 'mean', y: y(last.mean) },
      { id: 'median', text: 'median', y: y(last.median) },
    ];
    const gap = labels[0].y - labels[1].y;
    if (Math.abs(gap) < LINE_LABEL_MIN_GAP) {
      const push = (LINE_LABEL_MIN_GAP - Math.abs(gap)) / 2;
      labels[0].y += gap >= 0 ? push : -push;
      labels[1].y += gap >= 0 ? -push : push;
    }
    g._add('text.line-label', labels)
      .attr('class', d => `line-label ${d.id}`)
      .attr('x', x(last.minute) + 6).attr('y', d => d.y)
      .text(d => d.text);
    this.setState({ lineLabelYs: labels.map(l => l.y) });   // the hover end label steers around these
  }

  drawAnnotations() {
    const { chart, aggregates, x, y, chartWidth, minuteOffset, zoneLabel } = this.getState();
    const KIND_TITLE = { buy: 'Buy', sell: 'Sell' };
    const points = d3.sort(buildAnnotationPoints(aggregates), p => p.minute);
    // Buys prefer the space below the line, sells above; layoutLabels may
    // move one across when its own side has no room.
    const { chartHeight } = this.getState();
    const yOf = p => y(p.agg[p.anchor]);
    const sideOf = p => p.kind === 'buy' ? 1 : -1;
    const lineHits = this.highlightedLineHitTest();
    const { todayLabelBox, extendedLabelBox } = this.getState();
    const taken = [todayLabelBox, extendedLabelBox].filter(Boolean);
    const annotations = layoutLabels(points, x, yOf, sideOf, chartWidth, chartHeight, lineHits, taken).map(({ p, mode, route, dx, dy }) => {
      const px = x(p.minute), py = yOf(p);
      const stacked = mode === 'stacked';
      return {
        x: px, y: py, dx, dy,
        className: p.kind,
        subject: { radius: 5 },
        // Stacked: an L from the point to the label's near corner, bending
        // at the gutter (drop first) or at the point's height (leg first).
        // Side: the horizontal leg only. No diagonal legs either way.
        connector: stacked
          ? { type: 'curve', curve: d3.curveLinear, points: [route === 'dropFirst' ? [0, dy] : [dx, 0]] }
          : { type: 'line' },
        note: {
          title: `${KIND_TITLE[p.kind]} ${fmtClock(p.minute + minuteOffset)}`,
          label: p.reasons.join(', '),
          orientation: stacked ? 'topBottom' : 'leftRight',
          align: stacked ? 'left' : 'middle',
          lineType: 'none',
          wrap: LABEL_WIDTH - 14,      // text + 5px padding each side stays inside the LABEL_WIDTH box the layout assumes
          bgPadding: { top: 3, left: 5, right: 5, bottom: 3 },
        },
      };
    });
    const g = chart._add('g.annotations');
    g.selectAll('*').remove();          // d3-annotation owns this subtree; rebuild it each render
    g.call(d3.annotation().type(d3.annotationCalloutCircle).notePadding(LABEL_PADDING).annotations(annotations));
  }

  // The highlighted line is the thing to read, so no label may sit on it:
  // today's path when it is in view, else the reference day of the
  // similar-days filter. Returns a test of a label box, padded a little,
  // against every segment of that line.
  highlightedLineHitTest() {
    const { data, x, y, todayId } = this.getState();
    const line = data.find(d => d.id === todayId);
    if (!line || !isLiveDay(line)) return () => false;
    const PAD = 8;
    const pts = line.points.map(p => ({ x: x(p.minute), y: y(p.pct) }));
    return b => {
      const box = { left: b.left - PAD, right: b.right + PAD, top: b.top - PAD, bottom: b.bottom + PAD };
      return pts.some((p, i) => i > 0 && segmentHitsBox(pts[i - 1], p, box));
    };
  }

  drawNow() {
    const { chart, x, chartHeight, minuteOffset, zoneLabel } = this.getState();
    const minute = marketMinuteNow();
    const g = chart._add('g.now').style('display', minute === null ? 'none' : null);
    if (minute === null) return;
    const px = x(minute);
    const nearRightEdge = px > x(SESSION_CLOSE_MIN) - 90;
    // A short tick at the top rather than a full-height rule: enough to
    // place "now" without cutting across the paths.
    g._add('line.now-line').attr('x1', px).attr('x2', px).attr('y1', 0).attr('y2', chartHeight * NOW_TICK_SHARE);
    g._add('text.now-label')
      .attr('x', px + (nearRightEdge ? -6 : 6)).attr('y', 12)
      .attr('text-anchor', nearRightEdge ? 'end' : 'start')
      .text(`now ${fmtClock(minute + minuteOffset)} ${zoneLabel}`);
  }

  drawHover() {
    const { chart, d3Container, aggregates, data, x, y, chartWidth, chartHeight, minuteOffset, referenceId } = this.getState();
    const { todayId, opacityCount } = this.getState();
    const today = data.find(d => d.id === todayId);
    const live = today && isLiveDay(today);
    const opacity = dayOpacity(opacityCount ?? (live ? data.length - 1 : data.length));
    const restOpacity = d => live && d.id === referenceId ? 1 : opacity;
    const rule = chart._add('line.hover-rule')
      .attr('y1', 0).attr('y2', chartHeight)
      .style('display', 'none');
    const marks = chart._add('g.hover-marks').style('display', 'none');
    const range = chart._add('g.range-marks').style('display', 'none');
    const dayPaths = chart.selectAll('path.day-path');
    const bisectMinute = d3.bisector(a => a.minute).center;
    const bisectPoint = d3.bisector(p => p.minute).center;
    // The aggregate bar under a pointer, its x clamped to the plot, and the
    // move its height reads as, from any event: the drag's handlers sit on the
    // window, so the pointer is taken against the plot's own frame.
    const barAt = minute => aggregates[bisectMinute(aggregates, minute)];
    const pointerBar = event => {
      const [px, py] = d3.pointer(event, chart.node());
      return { agg: barAt(x.invert(Math.max(0, Math.min(chartWidth, px)))), cursorPct: y.invert(py) };
    };
    // The day whose path is nearest the pointer's height at a bar.
    const nearestDay = (minute, cursorPct) => d3.least(data, d => {
      const p = d.points[bisectPoint(d.points, minute)];
      return p.minute === minute ? Math.abs(p.pct - cursorPct) : Infinity;
    });
    const highlightDay = day => dayPaths.classed('hover', d => d === day).style('opacity', d => d === day ? 1 : restOpacity(d));
    const hideHover = () => { rule.style('display', 'none'); marks.style('display', 'none'); highlightDay(null); };

    // A dragged range, as on the site's charts: press on the plot and drag,
    // and the span between the two bars is shaded, with a chord across it for
    // today's line (while the session is live, as far as its last bar), the
    // mean, the median and the day nearest the pointer, a badge on each
    // naming its move over the span, and a time chip at each end. The two
    // readings on a line are moves from the previous close, so the move
    // across the span is the price ratio between them. It clears on release;
    // Shift at release keeps it until Escape or the next press.
    const showRange = (a, b, day) => {
      const lo = a.minute <= b.minute ? a : b, hi = a.minute <= b.minute ? b : a;
      const xA = x(lo.minute), xB = x(hi.minute);
      hideHover();
      highlightDay(day);
      range.style('display', null);
      range._add('rect.range-span').attr('x', xA).attr('y', 0).attr('width', xB - xA).attr('height', chartHeight);
      range._add('line.range-edge', [xA, xB]).attr('x1', d => d).attr('x2', d => d).attr('y1', 0).attr('y2', chartHeight);
      const at = (points, minute) => points[bisectPoint(points, minute)];
      const chords = [];
      if (live) {
        const p0 = at(today.points, lo.minute), p1 = at(today.points, hi.minute);
        if (p1.minute > p0.minute) chords.push({ id: 'today', name: 'today', p0, p1 });
      }
      chords.push({ id: 'mean', name: 'mean', p0: { minute: lo.minute, pct: lo.mean }, p1: { minute: hi.minute, pct: hi.mean } });
      chords.push({ id: 'median', name: 'median', p0: { minute: lo.minute, pct: lo.median }, p1: { minute: hi.minute, pct: hi.median } });
      if (day && !(live && day.id === todayId)) chords.push({ id: 'day', name: d3.timeFormat('%b %-d')(day.date), p0: at(day.points, lo.minute), p1: at(day.points, hi.minute) });
      for (const c of chords) {
        c.move = ((100 + c.p1.pct) / (100 + c.p0.pct) - 1) * 100;
        c.tone = toneOf(c.move);
        c.x0 = x(c.p0.minute); c.x1 = x(c.p1.minute); c.y0 = y(c.p0.pct); c.y1 = y(c.p1.pct);
      }
      range._add('line.range-chord', chords).attr('class', c => `range-chord ${c.id}`)
        .attr('x1', c => c.x0).attr('y1', c => c.y0).attr('x2', c => c.x1).attr('y2', c => c.y1);
      range._add('circle.range-end', chords.flatMap(c => [{ id: c.id + '-0', line: c.id, x: c.x0, y: c.y0 }, { id: c.id + '-1', line: c.id, x: c.x1, y: c.y1 }]))
        .attr('class', e => `range-end ${e.line}`).attr('cx', e => e.x).attr('cy', e => e.y).attr('r', 3);
      // Badges at the chords' midpoints, pushed apart when chords run close
      // together and kept inside the plot.
      const badges = chords.map(c => ({ id: c.id, tone: c.tone, name: c.name, text: fmtPct(c.move), x: (c.x0 + c.x1) / 2, y: (c.y0 + c.y1) / 2 }));
      for (const b of badges) { b.w = (b.name.length + 1 + b.text.length) * 6.6 + 12; b.x = Math.max(b.w / 2, Math.min(chartWidth - b.w / 2, b.x)); }
      const stacked = d3.sort(badges, b => b.y);
      for (let i = 1; i < stacked.length; i++) stacked[i].y = Math.max(stacked[i].y, stacked[i - 1].y + RANGE_BADGE_H);
      for (let i = stacked.length - 1; i >= 0; i--) stacked[i].y = Math.min(stacked[i].y, i === stacked.length - 1 ? chartHeight - RANGE_BADGE_H / 2 : stacked[i + 1].y - RANGE_BADGE_H);
      for (let i = 0; i < stacked.length; i++) stacked[i].y = Math.max(stacked[i].y, i === 0 ? RANGE_BADGE_H / 2 : stacked[i - 1].y + RANGE_BADGE_H);
      const badge = range._add('g.range-badge', badges).attr('class', b => `range-badge ${b.tone}`).attr('transform', b => `translate(${b.x},${b.y})`);
      badge._add('rect.range-badge-bg').attr('x', b => -b.w / 2).attr('y', -RANGE_BADGE_H / 2).attr('width', b => b.w).attr('height', RANGE_BADGE_H);
      badge._add('text.range-badge-text').html(b => `<tspan class="name">${b.name} </tspan><tspan class="move">${b.text}</tspan>`);
      // A time chip under each edge, one chip naming both when they would overlap.
      const clock = m => fmtClock(m + minuteOffset);
      const chipW = t => t.length * 6.6 + 12, chipH = 16;
      const chips = xB - xA >= chipW(clock(lo.minute)) + 6
        ? [{ id: 'a', x: xA, text: clock(lo.minute) }, { id: 'b', x: xB, text: clock(hi.minute) }]
        : [{ id: 'a', x: (xA + xB) / 2, text: `${clock(lo.minute)}–${clock(hi.minute)}` }];
      for (const c of chips) { c.w = chipW(c.text); c.x = Math.max(c.w / 2, Math.min(chartWidth - c.w / 2, c.x)); }
      const chip = range._add('g.range-time-chip', chips).attr('transform', c => `translate(${c.x},${chartHeight + 10})`);
      chip._add('rect.hover-time-bg').attr('x', c => -c.w / 2).attr('y', -chipH / 2).attr('width', c => c.w).attr('height', chipH);
      chip._add('text.hover-time').text(c => c.text);
    };
    const clearRange = () => {
      range.style('display', 'none');
      highlightDay(null);
      this.setState({ rangeShown: null, rangePinned: null });
    };

    chart._add('rect.hover-target')
      .attr('width', chartWidth).attr('height', chartHeight)
      .attr('fill', 'transparent')
      .on('mousedown', (event) => {
        if (event.button !== 0) return;
        this.setState({ rangeAnchor: pointerBar(event).agg.minute });
        event.preventDefault();   // no text selection while dragging
      })
      .on('mousemove', (event) => {
        const { rangeAnchor, rangePinned } = this.getState();
        if (rangeAnchor != null || rangePinned) return;   // a drag draws from the window's handler; a kept range holds
        const { agg, cursorPct } = pointerBar(event);
        rule.style('display', null).attr('x1', x(agg.minute)).attr('x2', x(agg.minute));

        // The day whose path is nearest the cursor gets highlighted.
        const nearest = nearestDay(agg.minute, cursorPct);
        highlightDay(nearest);
        const nearestPct = nearest.points[bisectPoint(nearest.points, agg.minute)].pct;

        marks.style('display', null);
        const hx = x(agg.minute);
        // Left of the crosshair near the plot's right edge, and only where the
        // left has more room: on a phone's plot, under HOVER_LABEL_ROOM wide,
        // every place is "near the right edge" and the labels left the chart.
        const { marginLeft, marginRight } = this.getState();
        const onRight = hx > chartWidth - HOVER_LABEL_ROOM && hx + marginLeft > chartWidth - hx + marginRight;

        // Time chip on the axis under the crosshair.
        const timeText = fmtClock(agg.minute + minuteOffset);
        const chipW = timeText.length * 6.6 + 12, chipH = 16;
        const chip = marks._add('g.hover-time-chip')
          .attr('transform', `translate(${Math.max(chipW / 2, Math.min(chartWidth - chipW / 2, hx))},${chartHeight + 10})`);
        chip._add('rect.hover-time-bg').attr('x', -chipW / 2).attr('y', -chipH / 2).attr('width', chipW).attr('height', chipH);
        chip._add('text.hover-time').text(timeText);

        // Values where the crosshair crosses each line, pushed apart when
        // two would sit on top of each other.
        const crossings = [
          { id: 'mean', text: `mean ${fmtPct(agg.mean)}`, y: y(agg.mean) },
          { id: 'median', text: `median ${fmtPct(agg.median)}`, y: y(agg.median) },
          { id: 'day', text: fmtPct(nearestPct), y: y(nearestPct) },
        ];
        const ordered = d3.sort(crossings, c => c.y);
        ordered.forEach(c => { c.ly = c.y; });
        for (let i = 1; i < ordered.length; i++) ordered[i].ly = Math.max(ordered[i].ly, ordered[i - 1].ly + HOVER_LABEL_GAP);
        for (let i = ordered.length - 2; i >= 0; i--) ordered[i].ly = Math.min(ordered[i].ly, ordered[i + 1].ly - HOVER_LABEL_GAP);
        const cross = marks._add('g.hover-cross', crossings)
          .attr('class', c => `hover-cross ${c.id}`)
          .attr('transform', c => `translate(${hx},0)`);
        cross._add('circle.hover-dot').attr('cy', c => c.y).attr('r', 3.5);
        cross._add('text.hover-value')
          .attr('x', onRight ? -9 : 9).attr('y', c => c.ly)
          .attr('text-anchor', onRight ? 'end' : 'start')
          .text(c => c.text);

        // The hovered day's end, in the right margin beside the plot like the
        // mean and median names: its date, then its close vs the previous
        // close. Two lines, placed at the line's end unless that would sit on
        // the mean or median name, in which case it moves up or down.
        const last = nearest.points[nearest.points.length - 1];
        const ey = y(last.pct);
        const { lineLabelYs = [] } = this.getState();
        const clearOfNames = cy => lineLabelYs.every(ly => Math.abs(cy - ly) > HOVER_END_CLEARANCE);
        const inPlot = cy => cy - HOVER_END_HEIGHT / 2 >= 0 && cy + HOVER_END_HEIGHT / 2 <= chartHeight;
        const endY = [ey, ey - HOVER_END_HEIGHT, ey + HOVER_END_HEIGHT, ey - 2 * HOVER_END_HEIGHT, ey + 2 * HOVER_END_HEIGHT]
          .find(cy => inPlot(cy) && clearOfNames(cy)) ?? ey;
        const endLabel = marks._add('text.hover-end')
          .attr('x', chartWidth + 6).attr('y', endY).attr('text-anchor', 'start')
          .attr('class', 'hover-end');
        endLabel.html(`<tspan x="${chartWidth + 6}" dy="-0.35em">${d3.timeFormat('%b %-d, %Y')(nearest.date)}</tspan>` +
          `<tspan x="${chartWidth + 6}" dy="1.2em" class="dim">${fmtPct(last.pct)}</tspan>`);
        // Wider than a narrow gutter (the widget's), the label ends at the
        // svg's right edge instead, over the plot's last few pixels.
        const endX = Math.min(chartWidth + 6, chartWidth + this.getState().marginRight - 2 - endLabel.node().getBBox().width);
        endLabel.attr('x', endX).selectAll('tspan').attr('x', endX);
      })
      .on('mouseleave', () => {
        const { rangeAnchor, rangePinned } = this.getState();
        if (rangeAnchor != null || rangePinned) return;
        hideHover();
      });
    // The drag follows the pointer past the plot's edges, so its handlers sit
    // on the window; one set per chart, replaced on each render.
    const { id } = this.getState();
    d3.select(window)
      // Any press dismisses a kept range; a press on the plot then starts its own drag.
      .on('mousedown.range-' + id, () => { if (this.getState().rangePinned) clearRange(); })
      .on('mousemove.range-' + id, (event) => {
        const { rangeAnchor, rangePinned } = this.getState();
        if (rangeAnchor == null || rangePinned) return;
        const { agg, cursorPct } = pointerBar(event);
        if (agg.minute === rangeAnchor) { range.style('display', 'none'); this.setState({ rangeShown: null }); return; }
        const day = nearestDay(agg.minute, cursorPct);
        showRange(barAt(rangeAnchor), agg, day);
        this.setState({ rangeShown: { a: rangeAnchor, b: agg.minute, dayId: day ? day.id : null } });
      })
      .on('mouseup.range-' + id, (event) => {
        const { rangeAnchor, rangeShown } = this.getState();
        if (rangeAnchor == null) return;
        this.setState({ rangeAnchor: null });
        if (event.shiftKey && rangeShown) { this.setState({ rangePinned: rangeShown }); return; }
        clearRange();
      })
      .on('keydown.range-' + id, (event) => { if (event.key === 'Escape' && this.getState().rangePinned) clearRange(); });
    // A kept range outlives a redraw (the widget's live print each minute).
    const pinned = this.getState().rangePinned;
    if (pinned) showRange(barAt(pinned.a), barAt(pinned.b), data.find(d => d.id === pinned.dayId) || null);
  }
}

// What the bars under the chart measure for each day: one of its five prices
// against another, in percent (the user, 2026-11-26: "I want to see what is
// opening price difference, what is min and max price difference also min and
// prev day, max and prev day, also difference in closing and min, max and
// closing and open and min, open and max and open and close ... basically I
// want to see all combinations there in a new dropdown"). Every pair of the
// five, ten in all, each the move from the one that came first, which its name
// gives first, and listed in the order the prices come in the day: the
// previous close, the open, the low, the high, the close (the user, 2026-11-27:
// "sort it so earlier always shows early, prev close vs today open, prev close
// vs today min, prev close vs today max ect, so sort based on time it
// happened, if time is not available like for min amd max, first have min,
// then max"). So "open vs low" is how far a day fell from its open (0 or less)
// and "low vs high" its whole range (0 or more). Prev close vs close is what
// the bars showed before the choice, and is still picked first.
const DAY_PRICE_NAMES = { prev: 'prev close', open: 'open', low: 'low', high: 'high', close: 'close' };
const DAY_PRICE_ORDER = Object.keys(DAY_PRICE_NAMES);
const DAY_MEASURES = DAY_PRICE_ORDER.flatMap((base, k) => DAY_PRICE_ORDER.slice(k + 1).map((of) => {
  const name = `${DAY_PRICE_NAMES[base]} vs ${DAY_PRICE_NAMES[of]}`;
  return { id: `${of}-${base}`, of, base, name, label: name[0].toUpperCase() + name.slice(1) };
}));
const DAY_MEASURE_DEFAULT = DAY_MEASURES.find(measure => measure.id === 'close-prev');
const DAY_MEASURE_STORAGE_KEY = 'tqqq-intraday-measure';
const dayChange = (day, measure) => (day.prices[measure.of] / day.prices[measure.base] - 1) * 100;
// The pre-market or after-hours print is a price against the last close: it
// stands in for prev close vs close and for no other measure.
const printMeasured = measure => measure === DAY_MEASURE_DEFAULT;

// The weekday bars, over the days the chart draws (the user, 2026-11-22:
// "daily bar chart (mon, tue, wed etc) average in the bottom, also a switch
// for median"; the day after: "have count, median, average", and "when
// choosing count ... red how many below and green how many in plus"). Each
// weekday gets one bar for its days' usual value of the measure picked
// (DAY_MEASURES), the mean or the median, or with Count two: the days it was
// up, in green over the line, and the days it was down, in red under it. A day
// at 0 is neither. A session still open is not final yet and is
// left out. The day stamps are the file's calendar dates at local midnight,
// so getDay() is the New York weekday.
const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
// A bar: its signed height, the text at its end, its tone, and the side of the line the text sits on.
const changeBar = pct => { const tone = toneOf(pct); return { value: pct, text: fmtPct(tone === 'flat' ? 0 : pct), tone, side: pct >= 0 ? 'above' : 'below' }; };
const countBars = changes => [
  { value: d3.sum(changes, pct => toneOf(pct) === 'up'), tone: 'up', side: 'above' },
  { value: -d3.sum(changes, pct => toneOf(pct) === 'down'), tone: 'down', side: 'below' },
].map(bar => ({ ...bar, text: String(Math.abs(bar.value)) }));
// What the bars can show, in the order of the choice: its button, the block's
// name for a measure, a weekday's bars from its days' values, and the least
// extent the scale spans either side of the line, so near-zero bars do not
// fill the plot.
const WEEKDAY_STATS = {
  count: { button: 'Count', name: () => 'Up and down days by weekday', bars: countBars, leastExtent: 1 },
  median: { button: 'Median', name: measure => `Median ${measure.name} by weekday`, bars: changes => changes.length ? [changeBar(d3.median(changes))] : [], leastExtent: 0.05 },
  average: { button: 'Average', name: measure => `Average ${measure.name} by weekday`, bars: changes => changes.length ? [changeBar(d3.mean(changes))] : [], leastExtent: 0.05 },
};
const WEEKDAY_DEFAULT_STAT = 'average';
function buildWeekdayBars(days, stat, measure) {
  const live = liveMarketDate();   // read once, not for each day: every reading builds date formatters
  const changesByWeekday = d3.rollup(days.filter(d => fmtIsoDay(d.date) !== live), group => group.map(d => dayChange(d, measure)), d => d.date.getDay());
  return WEEKDAYS.map((label, k) => {
    const changes = changesByWeekday.get(k + 1) || [];   // getDay(): 1 is Monday
    return { id: label, label, days: changes.length, bars: stat.bars(changes).map(bar => ({ ...bar, id: `${label}-${bar.side}`, label })) };
  });
}

// A weekday's bars on a zero line, each with its text past its end, the
// weekday and its count of days beneath. No axis: the values are on the bars.
const WEEKDAY_VALUE_GAP = 4;             // px between a bar's end and its value
const WEEKDAY_VALUE_CAP = 7;             // px the value's digits stand over their baseline, at 10.5px
const WEEKDAY_VALUE_ROOM = WEEKDAY_VALUE_GAP + WEEKDAY_VALUE_CAP + 4;   // px kept at the top and the bottom of the plot for the values past the bars' ends
const UNDER_CHART_HEIGHT = 126;          // px the weekday bars and the daily bars stand at the least, side by side
const UNDER_CHART_FULL_HEIGHT = 300;     // and at the most, in a window with the room (fitChartsToWindow)
const DAILY_LIFT = 26;                   // px the daily bars rise over the weekday bars beside them: the row of the chart's scale button, empty right of the button
const WEEKDAY_NAME_ROW = 16;             // px from the plot's bottom to the weekday names' baseline
const WEEKDAY_COUNT_ROW = 30;            // and to the day counts' baseline
class WeekdayBarChart extends ChartBase {
  constructor() {
    super({
      id: 'ID' + Math.floor(Math.random() * 1000000),
      svgWidth: 400,
      svgHeight: UNDER_CHART_HEIGHT,
      marginTop: 2,
      marginBottom: WEEKDAY_COUNT_ROW + 4,   // the weekday names, then the day counts
      marginRight: 4,
      marginLeft: 4,
      container: 'body',
      defaultFont: 'inherit',
      data: null,               // buildWeekdayBars' rows
      leastExtent: 0,           // least extent of the scale either side of the line (the statistic's)
      chartWidth: null,
      chartHeight: null,
      firstRender: true,
    });
  }

  render() {
    this.setDynamicContainer();
    this.calculateProperties();
    this.drawSvgAndWrappers();
    this.drawBars();
    this.setState({ firstRender: false });
    return this;
  }

  drawBars() {
    const { chart, data, leastExtent, chartWidth, chartHeight } = this.getState();
    const x = d3.scaleBand().domain(data.map(d => d.label)).range([0, chartWidth]).padding(0.38);
    const bars = data.flatMap(d => d.bars);
    const [lo, hi] = d3.extent(bars, bar => bar.value);
    const y = d3.scaleLinear()
      .domain([Math.min(-leastExtent, lo ?? 0), Math.max(leastExtent, hi ?? 0)])
      .range([chartHeight - WEEKDAY_VALUE_ROOM, WEEKDAY_VALUE_ROOM]);
    const mid = d => x(d.label) + x.bandwidth() / 2;
    const toned = selection => selection.classed('up', bar => bar.tone === 'up').classed('down', bar => bar.tone === 'down');

    chart._add('line.weekday-zero').attr('x1', 0).attr('x2', chartWidth).attr('y1', y(0)).attr('y2', y(0));
    chart._add('rect.weekday-bar', bars)
      .attr('x', bar => x(bar.label)).attr('width', x.bandwidth())
      .attr('y', bar => Math.min(y(0), y(bar.value))).attr('height', bar => Math.abs(y(bar.value) - y(0)))
      .attr('rx', 2)
      .call(toned);
