  {k:1,h:'CAGR',get:r=>'<span class="cagr">+'+r[1].toFixed(1)+'%</span>',t:'Compound annual growth rate reconciling every deposit with the final value (money-weighted, i.e. IRR). +25% means the money compounded about 25% per year. 9sig ceilings are lower than all-in leverage because part of the portfolio sits in the safe/park side.'},

  {k:3,h:'Underlying',cls:'l',get:r=>pill(r[3]),t:'The fund the 9sig signal actually trades — the growth engine. Every quarter (or your chosen period) it value-averages this fund toward a target line that grows at the Growth rate. Leverage is color-coded: red = 3× (TQQQ, SPXL), amber = 2× (QLD, SSO), blue = 1× (QQQ, SPY).'},
  {k:4,h:'Park',cls:'l',get:r=>pill(r[4]),t:'Where the safe/cash side of the split sits. cash just earns the parked-cash rate; a fund (e.g. SPY) means the "cash" buffer is itself invested, so both sides of the split are in the market. This is one of the three skeleton dimensions being swept.'},
  {k:5,h:'Period',cls:'l',get:r=>CAP(r[5]),t:'How often the strategy rebalances toward its target line: weekly, monthly, quarterly (standard 9sig), or yearly. Faster periods react sooner but trade more; the Growth rate is auto-rescaled to the period so 9% "per quarter" stays comparable.'},
  {k:6,h:'Cash',get:r=>r[6]+'%',t:'The split: this much of every entry goes to the Park side, the rest buys the Underlying. 40% cash = the classic 60/40 9sig. Lower cash is more aggressive (more in the leveraged fund); higher cash is a bigger safety buffer.'},
  {k:7,h:'Growth',get:r=>r[7]+'%',t:'How fast the target line grows each period — the "signal". Standard 9sig is 9% per quarter. A low growth target keeps the strategy selling into strength; a high target keeps it buying. The optimizer often games this together with the crash rule.'},
  {k:8,h:'CrashΔ',get:r=>'−'+r[8]+'%',t:'Crash no-sell threshold. Once the underlying has fallen this far below its recent peak, skip the quarterly sell (up to two periods) so you don\'t dump at the bottom. A tiny value (e.g. −5%) makes the rule fire constantly, so the strategy almost never sells — a classic overfit lever.'},
  {k:9,h:'CrashWin',get:r=>r[9]+'mo',t:'Lookback for the crash rule\'s "recent peak", in months. 24 = the standard two-year high. Shorter windows treat smaller pullbacks as crashes; longer ones only forgive selling after a fall from a multi-year top.'},
  {k:10,h:'Reset→',get:r=>r[10]+'%',t:'Spike reset target: after a big rally trips the spike trigger, take profits back down to THIS stock weight. 60% means reset to 60% in the underlying. Decoupled from the entry split, so it can bank more or less than you started with.'},
  {k:11,h:'Spike',get:r=>'+'+r[11]+'%',t:'Spike trigger: if the underlying rips this much in a single period, force a rebalance back to the Reset weight so a runaway spike doesn\'t leave you over-concentrated. Higher lets winners run longer; a low value banks gains often.'},
  {k:12,h:'BuyPwr',get:r=>r[12]+'%',t:'Buy throttle: a single buy never spends more than this share of your park cash, so you always keep some dry powder. Standard 9sig spends 90%. 100% goes all-in on every buy signal.'},
  {k:13,h:'Deploy',get:r=>r[13]+'%',t:'Deploy contributions right away: this share of each monthly contribution goes straight into the underlying at that month\'s price; the rest waits as cash until the next rebalance. 0% = canonical 9sig (hold contributions as cash).'},
  {k:14,h:'RebalPt',get:r=>r[14]+'%',t:'Where inside each period the rebalance check happens: 0% = near the start, 100% = near the end. Purely a timing-sensitivity knob — it shifts which day the period-end snapshot lands on.'},
  {k:15,h:'Target',cls:'l',get:r=>r[15]==='target'?'prior target':'prior holding',t:'What the target line grows FROM each period: the prior period\'s actual holding (standard 9sig) or the prior target itself. Growing from the prior target compounds the line faster and keeps demanding more, regardless of what you actually held.'},
];
const COL_CAGR = COLS.findIndex(c=>c.k===1);  // sort-column indices, robust to reordering
const COL_DD   = COLS.findIndex(c=>c.k===2);

// ---------- filters: every column, numeric ones bucketed into range categories ----------
const INF=1/0;
const CATLBL={weekly:'Weekly',monthly:'Monthly',quarterly:'Quarterly',yearly:'Yearly',holding:'Prior holding',target:'Prior target'};
const FILTERS=[
  {idx:0,lbl:'Final value',kind:'range',b:[['< $250K',0,25e4],['$250K–1M',25e4,1e6],['$1–5M',1e6,5e6],['$5–20M',5e6,20e6],['≥ $20M',20e6,INF]]},
  {idx:1,lbl:'CAGR',kind:'range',b:[['< 15%',0,15],['15–25%',15,25],['25–35%',25,35],['35–45%',35,45],['≥ 45%',45,INF]]},
  {idx:2,lbl:'Max drawdown',kind:'range',b:[['< 30%',0,30],['30–45%',30,45],['45–60%',45,60],['60–75%',60,75],['≥ 75%',75,INF]]},
  {idx:3,lbl:'Underlying',kind:'cat'},
  {idx:4,lbl:'Park asset',kind:'cat'},
  {idx:5,lbl:'Period',kind:'cat'},
  {idx:6,lbl:'Cash split',kind:'range',b:[['0–10%',0,11],['20–30%',11,31],['40–50%',31,51],['≥ 60%',51,INF]]},
  {idx:7,lbl:'Target growth',kind:'range',b:[['< 5%',0,5],['5–15%',5,15],['15–40%',15,40],['40–80%',40,80],['≥ 80%',80,INF]]},
  {idx:8,lbl:'Crash Δ',kind:'range',b:[['≤ 15%',0,16],['20–40%',16,41],['45–70%',41,71],['≥ 75%',71,INF]]},
  {idx:9,lbl:'Crash window',kind:'range',b:[['3–9 mo',0,10],['12–24 mo',10,25],['≥ 36 mo',25,INF]]},
  {idx:10,lbl:'Spike reset',kind:'range',b:[['≤ 25%',0,26],['30–50%',26,51],['60–75%',51,76],['≥ 80%',76,INF]]},
  {idx:11,lbl:'Spike trigger',kind:'range',b:[['off (0)',0,1],['+25–75%',1,76],['+80–150%',76,151],['≥ +160%',151,INF]]},
  {idx:12,lbl:'Buy power',kind:'range',b:[['50–70%',0,71],['75–90%',71,91],['95–100%',91,INF]]},
  {idx:13,lbl:'Deploy now',kind:'range',b:[['0%',0,1],['10–25%',1,26],['50–75%',26,76],['100%',76,INF]]},
  {idx:14,lbl:'Rebalance pt',kind:'range',b:[['0–20%',0,21],['25–50%',21,51],['55–75%',51,76],['≥ 80%',76,INF]]},
  {idx:15,lbl:'Target base',kind:'cat'},
];
const FBYIDX={}; FILTERS.forEach(f=>FBYIDX[f.idx]=f);

function filterOptions(f,rows){
  if(f.kind==='cat'){const set=[...new Set(rows.map(r=>String(r[f.idx])))].sort();return set.map(v=>({v,l:CATLBL[v]||v.toUpperCase()}));}
  if(f.kind==='enum'){const set=[...new Set(rows.map(r=>r[f.idx]))].sort((a,b)=>a-b);return set.map(v=>({v:String(v),l:String(v)}));}
  return f.b.map(b=>({v:b[1]+':'+b[2],l:b[0]}));
}
function passes(r,state){
  const F=state.filters||{};
  for(const idx in F){
    const sel=F[idx]; if(!sel||!sel.length)continue;
    const spec=FBYIDX[idx]; let ok=false;
    for(const val of sel){
      if(spec.kind==='range'){const p=val.split(':'); if(r[+idx]>=+p[0]&&r[+idx]<+p[1]){ok=true;break;}}
      else{ if(String(r[+idx])===String(val)){ok=true;break;} }
    }
    if(!ok)return false;   // OR within a filter, AND across filters
  }
  return true;
}
function sortRows(rows,state){
  const arr=rows.map((r,i)=>[r,i]).filter(([r])=>passes(r,state));
  const col=COLS[state.sort];
  if(col){arr.sort((A,B)=>{const a=col.k==='l'?A[1]:A[0][col.k], b=col.k==='l'?B[1]:B[0][col.k]; const d=(typeof a==='string'||typeof b==='string')?String(a).localeCompare(String(b)):(a-b); return state.desc?-d:d;});}
  return arr;
}
function drawTable(tblId,rows,state){
  const el=document.getElementById(tblId);
  const th=COLS.map((c,ci)=>{const on=state.sort===ci; const ar=on?(state.desc?' ▼':' ▲'):''; const q=c.t?' <span class="q" data-tip="'+c.t.replace(/"/g,'&quot;')+'">?</span>':''; return '<th class="'+(c.cls&&c.cls.includes('l')?'l':'')+'" data-ci="'+ci+'">'+c.h+q+'<span class="ar">'+ar+'</span></th>';}).join('');
  const arr=sortRows(rows,state);
  const body=arr.map(([r,idx])=>'<tr>'+COLS.map(c=>{const align=(c.cls&&c.cls.includes('l'))?'l':''; const rankcls=(c.k==='l')?'rank':''; return '<td class="'+align+' '+rankcls+'">'+c.get(r,idx)+'</td>';}).join('')+'</tr>').join('');
  el.innerHTML='<thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody>';
  el.querySelectorAll('th').forEach(t=>t.onclick=()=>{const ci2=+t.dataset.ci; if(COLS[ci2].k==='open')return; if(state.sort===ci2)state.desc=!state.desc; else{state.sort=ci2; const kk=COLS[ci2].k; state.desc=(kk===0||kk===1);} state.render();});
  return arr.length;
}
// download the CURRENT (filtered + sorted) view as CSV
const CSVHEAD=['rank','final','cagr_pct','maxdd_pct','underlying','park','period','cash_pct','growth_pct','crashdrop_pct','crashwin_mo','spike_reset_pct','spike_trigger_pct','buypower_pct','deploy_pct','rebalance_pt_pct','target_base','link'];
function rowObj(r,rank){return {rank,final:r[0],cagr_pct:r[1],maxdd_pct:r[2],underlying:String(r[3]).toUpperCase(),park:String(r[4]).toUpperCase(),period:r[5],cash_pct:r[6],growth_pct:r[7],crashdrop_pct:r[8],crashwin_mo:r[9],spike_reset_pct:r[10],spike_trigger_pct:r[11],buypower_pct:r[12],deploy_pct:r[13],rebalance_pt_pct:r[14],target_base:r[15],link:buildLink(r)};}
function downloadCSV(prefix,rows,state){
  const arr=sortRows(rows,state).map(([r],i)=>rowObj(r,i+1));
  const esc=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const text=[CSVHEAD.join(',')].concat(arr.map(o=>CSVHEAD.map(h=>esc(o[h])).join(','))).join('\n');
  const b=new Blob([text],{type:'text/csv'}), u=URL.createObjectURL(b), a=document.createElement('a');
  const ds=DATA.datasets[prefix]; const nm=ds?(ds.label+'-'+ds.span).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''):'strategies';
  a.href=u; a.download=nm+'-'+arr.length+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
// ---- multiselect popover: one shared, fixed-position element (escapes clipping) ----
const mspop=document.createElement('div'); mspop.className='mspop'; mspop.style.display='none'; document.body.appendChild(mspop);
let msCtx=null;
function selText(f,rows,sel){ if(!sel||!sel.length)return 'All'; if(sel.length===1){const o=filterOptions(f,rows).find(o=>o.v===sel[0]); return o?o.l:'1';} return sel.length+' selected'; }
function openMS(idx,rows,state,btn){
  const f=FBYIDX[idx]; state.filters=state.filters||{}; const sel=state.filters[idx]||[];
  const opts=filterOptions(f,rows);
  mspop.innerHTML='<div class="msrow msall"><label><input type="checkbox" data-all '+(sel.length?'':'checked')+'> All</label></div>'+
    opts.map(o=>'<div class="msrow"><label><input type="checkbox" value="'+o.v+'" '+(sel.includes(o.v)?'checked':'')+'> '+o.l+'</label></div>').join('');
  mspop.style.display='block';
  const rc=btn.getBoundingClientRect(), w=mspop.offsetWidth, h=mspop.offsetHeight;
  let left=Math.min(rc.left, innerWidth-w-8), top=rc.bottom+4; if(top+h>innerHeight-8)top=Math.max(8,rc.top-h-4);
  mspop.style.left=left+'px'; mspop.style.top=top+'px'; msCtx={idx,btn};
  mspop.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{
    let s=state.filters[idx]||[];
    if(cb.hasAttribute('data-all')){ s=[]; mspop.querySelectorAll('input:not([data-all])').forEach(x=>x.checked=false); }
    else{ if(cb.checked){ if(!s.includes(cb.value))s=s.concat(cb.value); } else s=s.filter(v=>v!==cb.value); mspop.querySelector('[data-all]').checked=(s.length===0); }
    state.filters[idx]=s;
    btn.classList.toggle('set',s.length>0); btn.firstChild.nodeValue=selText(f,rows,s);
    state.refreshBar(); state.render();
  });
}
document.addEventListener('mousedown',e=>{ if(mspop.style.display==='block' && !mspop.contains(e.target) && !e.target.closest('.fsel')) mspop.style.display='none'; });

function renderPane(prefix,rows,state){
  const bar=document.getElementById(prefix+'-bar');
  const refreshBar=()=>{
    const nset=Object.keys(state.filters||{}).filter(k=>(state.filters[k]||[]).length>0).length;
    bar.innerHTML='<button class="btn'+(state.filtersOpen?' on':'')+'" data-act="filters">⚑ Filters'+(nset?'<span class="fbadge">'+nset+'</span>':'')+'</button>'
      +'<button class="btn" data-act="reset">Reset</button>'
      +'<button class="btn dl" data-act="csv">⬇ CSV</button>'
      +'<span class="count" id="'+prefix+'-count"></span>';
    bar.querySelector('[data-act="filters"]').onclick=()=>{state.filtersOpen=!state.filtersOpen; renderPane(prefix,rows,state);};
    bar.querySelector('[data-act="reset"]').onclick=()=>{state.filters={}; mspop.style.display='none'; renderPane(prefix,rows,state);};
    bar.querySelector('[data-act="csv"]').onclick=()=>downloadCSV(prefix,rows,state);
  };
  const upd=()=>{const n=drawTable(prefix+'-tbl',rows,state); const c=document.getElementById(prefix+'-count'); if(c)c.textContent=n+' of '+rows.length;};
  state.refreshBar=refreshBar; state.render=upd;
  refreshBar();
  const fp=document.getElementById(prefix+'-filters');
  fp.className='filters'+(state.filtersOpen?' open':'');
  fp.innerHTML=FILTERS.map(f=>{const sel=((state.filters||{})[f.idx]||[]); return '<label class="fl"><span>'+f.lbl+'</span><button type="button" class="fsel'+(sel.length?' set':'')+'" data-idx="'+f.idx+'">'+selText(f,rows,sel)+'<i>▾</i></button></label>';}).join('');
  fp.querySelectorAll('.fsel').forEach(b=>b.onclick=()=>{ if(mspop.style.display==='block'&&msCtx&&msCtx.btn===b){mspop.style.display='none';return;} openMS(+b.dataset.idx,rows,state,b); });
  upd();
}

const STATE={};
DATA.order.forEach(k=>{const ds=DATA.datasets[k]; STATE[k]={sort: ds.kind==='dd'?COL_DD:COL_CAGR, desc: ds.kind!=='dd', filters:{}, filtersOpen:false};});

function chips(id, arr){const el=document.getElementById(id); if(el)el.innerHTML=arr.map(c=>'<div class="chip"><div class="k">'+c.k+'</div><div class="v" style="color:'+(c.c||'var(--text)')+'">'+c.v+'</div></div>').join('');}

function renderDataset(k){
  const ds=DATA.datasets[k], pane=document.getElementById('pane-'+k), state=STATE[k];
  if(!ds.ready){ pane.innerHTML='<div class="pending"><span class="spin"></span>'+(ds.kind==='dd'?'Drawdown optimization':'Optimization')+' for '+ds.span+' still running — this tab fills in when it finishes.</div>'; return; }
  const table='<div class="head"><div class="bar" id="'+k+'-bar"></div></div><div class="filters" id="'+k+'-filters"></div><div class="scroll"><table id="'+k+'-tbl"></table></div>';
  if(ds.kind==='ret'){
    pane.innerHTML=table+'<p class="foot">Optimized to <b>maximize final value</b> (≡ max money-weighted CAGR) over '+ds.span+', on a <b>$10,000 initial + $500/month</b> contribution stream — identical for every strategy, so Final values are directly comparable. Filters &amp; CSV act on the current view.</p>';
    renderPane(k,ds.rows,state);
  } else {
    if(!ds.n){ pane.innerHTML='<div class="pending">No strategy reached CAGR ≥ '+ds.cagrMin+'% over '+ds.span+' — the floor is above what any strategy achieved on this window.</div>'; return; }
    pane.innerHTML=table+'<p class="foot">Optimized to <b>minimize max-drawdown subject to CAGR ≥ '+ds.cagrMin+'%</b> over '+ds.span+', on a <b>$10,000 initial + $500/month</b> contribution stream — identical for every strategy. Showing the '+ds.n+' strategies that met the constraint (of '+ds.total+'), sorted by lowest drawdown. Filters &amp; CSV act on the current view.</p>';
    renderPane(k,ds.rows,state);
  }
}

// build tabs + empty panes from DATA.order
const tabsEl=document.getElementById('tabs'), panesEl=document.getElementById('panes');
DATA.order.forEach((k,i)=>{const ds=DATA.datasets[k];
  tabsEl.insertAdjacentHTML('beforeend','<button class="tab '+ds.kind+(i===0?' on':'')+'" data-key="'+k+'" role="tab"><span class="dot"></span>'+ds.label+' <span class="tspan">'+ds.span+'</span> <span class="cnt">'+(ds.ready?ds.n:'…')+'</span></button>');
  panesEl.insertAdjacentHTML('beforeend','<section class="pane'+(i===0?' on':'')+'" id="pane-'+k+'"></section>');
});
const rendered={};
function showDataset(k){ LINK_E=DATA.datasets[k].e; if(!rendered[k]){ renderDataset(k); rendered[k]=true; } }
tabsEl.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  tabsEl.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  panesEl.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+t.dataset.key));
  showDataset(t.dataset.key);
});
showDataset(DATA.order[0]);
// theme toggle
const tb=document.getElementById('themebtn');
tb.onclick=()=>{const cur=document.documentElement.getAttribute('data-theme'); const sysDark=matchMedia('(prefers-color-scheme:dark)').matches; const now=cur||(sysDark?'dark':'light'); document.documentElement.setAttribute('data-theme',now==='dark'?'light':'dark');};

// column-header help tooltips — single fixed-position element, delegated so it
// keeps working after tables re-render; fixed pos escapes the scroll clipping.
const tt=document.createElement('div'); tt.className='tt'; document.body.appendChild(tt);
function showTip(el){
  tt.textContent=el.getAttribute('data-tip');
  const r=el.getBoundingClientRect(), w=tt.offsetWidth, h=tt.offsetHeight;
  let left=Math.min(Math.max(8, r.left+r.width/2-w/2), innerWidth-w-8);
  let top=r.bottom+8; if(top+h>innerHeight-8) top=r.top-h-8;
  tt.style.left=left+'px'; tt.style.top=top+'px'; tt.classList.add('on');
}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]'); if(el) showTip(el);});
document.addEventListener('mouseout', e=>{const el=e.target.closest('[data-tip]'); if(el) tt.classList.remove('on');});
</script>

</body>
